}
// colores (RGB, 0-255) de todos los vértices de una pieza ya ubicada en el mundo
function bakePart(mesh,xf,ctx){
  const out = new Uint8Array(mesh.nv*3), res = [0,0,0], m = xf.m || rotMat(0,xf.rot||0,0);
  for(let t=0;t<mesh.nv;t+=3){
    const lnx = mesh.nor[t*3], lny = mesh.nor[t*3+1], lnz = mesh.nor[t*3+2];
    const nx = m[0]*lnx+m[1]*lny+m[2]*lnz, ny = m[3]*lnx+m[4]*lny+m[5]*lnz, nz = m[6]*lnx+m[7]*lny+m[8]*lnz;
    for(let k=0;k<3;k++){
      const i = (t+k)*3, x = mesh.pos[i], y = mesh.pos[i+1], z = mesh.pos[i+2];
      shadeVertex(xf.pos[0]+m[0]*x+m[1]*y+m[2]*z, xf.pos[1]+m[3]*x+m[4]*y+m[5]*z, xf.pos[2]+m[6]*x+m[7]*y+m[8]*z, nx,ny,nz, ctx, res);
      out[i] = Math.round(res[0]*255); out[i+1] = Math.round(res[1]*255); out[i+2] = Math.round(res[2]*255);

}
function bakeTasks(objects,prefabs){
  const tasks = [];

    if(o.kind==='prim'){ if(!o.water) tasks.push({oid:o.id, idx:0, geo:o.geo, size:o.size, pos:o.pos, rot:o.rot, m:rotMatOf(o)}); }

// hornea toda la escena; cede el control cada tanto para no congelar la pantalla
async function runBake(state,opts,provider,onProgress){
  const t0 = Date.now(), tasks = bakeTasks(state.objects,state.prefabs), boxes = collectOccluders(state.objects,state.prefabs), grid = buildGrid(boxes,2);
  const lights = opts.lights ? state.objects.filter(o => o.kind==='light' && !o.hidden).map(o => lightOfObj(o,1)) : [];
  const tmp = [];
  for(const L of lights){
    if(L.ty===1){ L.cand = null; continue; }   // la direccional busca obstáculos vértice por vértice
    gridQuery(grid,L.x-L.r,L.y-L.r,L.z-L.r,L.x+L.r,L.y+L.r,L.z+L.r,tmp); L.cand = tmp.slice();
  }
  const ctx = {opts, grid, cand:[], cand2:[], lights, amb:lights.length ? opts.amb/100 : 1};
  const byTask = new Map(); let verts = 0, last = Date.now();
  for(let i=0;i<tasks.length;i++){
    const t = tasks[i], mesh = bakeMesh(t.geo,t.size,opts.detail,provider);
    byTask.set(t.oid+'#'+t.idx,{mesh, colors:bakePart(mesh,{pos:t.pos,rot:t.rot,m:t.m},ctx)});
    verts += mesh.nv;
    if(Date.now()-last>40){ if(onProgress) onProgress((i+1)/tasks.length); await new Promise(r => setTimeout(r,0)); last = Date.now(); }
  }
  return {byTask, stats:{verts, parts:tasks.length, lights:lights.length, boxes:boxes.length, ms:Date.now()-t0, aoOnly:!lights.length}};
}

const ONES_LW = new Float32Array(MAXL).fill(1);
function bakeProvider(geo,size){
  const g = buildGeo(geo,size);
  const m = {pos:new Float32Array(g.attributes.position.array), uv:new Float32Array(g.attributes.uv.array), sub:g.userData.sub.map(q => ({slot:q.slot, start:q.start, count:q.count}))};

// las luces cuya esfera queda más cerca de la cámara tienen prioridad
function selectLights(lights,cx,cy,cz,max){
  return lights.map(L => ({L, d:Math.max(0,Math.hypot(L.x-cx,L.y-cy,L.z-cz)-L.r)})).sort((a,b) => a.d-b.d).slice(0,max).map(q => q.L);
}
// peso de cada celda para una luz: la propia 1, las vecinas por portales 0.55 y 0.25
function lightCellMap(start,ci){
  const w = new Map([[start,1]]), W = [1,0.55,0.25];
  let frontier = [start];
  for(let d=1;d<3;d++){
    const next = [];
    for(const c of frontier) for(const pe of ci.byCell[c]) if(!w.has(pe.other)){ w.set(pe.other,W[d]); next.push(pe.other); }
    frontier = next;
  }

}

  const map = L.map || (L.map = lightCellMap(L.cell,ci));
  let w = 0;
  for(const cid of o.cells){ const k = ci.idx.get(cid); if(k!==undefined){ const v = map.get(k); if(v>w) w = v; } }
  return w;
}

function updateLighting(){
  const hasLights = S.objects.some(o => o.kind==='light' && !o.hidden);
  const active = PSX.on && !bakeActive && ((PSX.lights && hasLights) || PSX.flash);
  UPSX.uLit.value = active ? 1 : 0;
  UPSX.uBaked.value = (PSX.on && bakeActive) ? 1 : 0;
  if(!active) return;
  const t = performance.now()/1000, cp = cam.position, ci = ensureCullCache();
  const lights = PSX.lights ? sceneLights().map(o => lightOfObj(o,PSX.lgain/100,t)) : [];
  lights.forEach(L => { L.cell = (L.ty!==1 && ci.cells.length) ? findCell(ci.cells,L.x,L.y,L.z) : -1; });
  const sel = selectLights(lights,cp.x,cp.y,cp.z,PSX.flash ? MAXL-1 : MAXL);
  if(PSX.flash){
    const e = cam.matrixWorld.elements;
    sel.push({x:cp.x-e[8]*0.2, y:cp.y-e[9]*0.2, z:cp.z-e[10]*0.2, r:PSX.flashR||9, c:[1.1,1.04,0.9], flash:true, cell:-1});

    const n = nodes.get(o.id); if(!n || !n.visible) continue;

}

const STATS = Object.assign({on:false, live:false}, loadJson(STATSKEY));

// empaqueta cuadros en un atlas (filas), con margen de 2 px; devuelve null si no entran en 4096
function packAtlas(items,maxSize){
  const PAD = 2, sorted = items.slice().sort((a,b) => b.h-a.h || b.w-a.w);
  for(const W of [256,512,1024,2048,4096]){
    if(W>maxSize) break;
    const rects = new Map(); let x = PAD, y = PAD, rowH = 0, ok = true;
    for(const it of sorted){
      if(it.w+2*PAD>W){ ok = false; break; }
      if(x+it.w+PAD>W){ x = PAD; y += rowH+PAD; rowH = 0; }
      rects.set(it.id,{x, y, w:it.w, h:it.h});
      x += it.w+PAD; rowH = Math.max(rowH,it.h+PAD);
    }
    if(!ok) continue;
    const used = y+rowH+PAD; let H = 1; while(H<used) H *= 2;
    if(H<=W*2 && H<=maxSize) return {W, H, rects};
  }
  return null;
}
// a qué lote va una pieza según el modo
function chunkKey(p,mode,size){
  if(mode==='all') return 'all';
  if(mode==='room') return (p.cells && p.cells.length) ? p.cells.slice().sort().join('|') : 'libre';
  return Math.floor(p.pos[0]/size)+','+Math.floor(p.pos[2]/size)+','+Math.floor(p.pos[1]/4);
}
// une todas las piezas en lotes en coordenadas del mundo, con todo el material resuelto por vértice (atlas + tinte)
function buildChunks(parts,ctx){
  const chunks = new Map();
  for(const p of parts){
    const key = chunkKey(p,ctx.mode,ctx.size);
    let ch = chunks.get(key);
    if(!ch){ ch = {key, pos:[], nor:[], uv:[], col:[], tint:[], rect:[], plain:[], cells:new Set(), gid:p.gid||null, box:[1e9,1e9,1e9,-1e9,-1e9,-1e9], parts:0}; chunks.set(key,ch); }
    const md = ctx.getMesh(p), mesh = md.mesh, colors = md.colors, m = p.m || rotMat(0,p.rot||0,0);
    for(const g of mesh.sub){
      const info = ctx.slotInfo(p,g.slot);
      for(let v=g.start;v<g.start+g.count;v++){
        const x = mesh.pos[v*3], y = mesh.pos[v*3+1], z = mesh.pos[v*3+2];
        const wx = p.pos[0]+m[0]*x+m[1]*y+m[2]*z, wy = p.pos[1]+m[3]*x+m[4]*y+m[5]*z, wz = p.pos[2]+m[6]*x+m[7]*y+m[8]*z;
        ch.pos.push(wx,wy,wz);
        const b = ch.box; if(wx<b[0]) b[0] = wx; if(wy<b[1]) b[1] = wy; if(wz<b[2]) b[2] = wz; if(wx>b[3]) b[3] = wx; if(wy>b[4]) b[4] = wy; if(wz>b[5]) b[5] = wz;
        const nx = mesh.nor[v*3], ny = mesh.nor[v*3+1], nz = mesh.nor[v*3+2];
        ch.nor.push(m[0]*nx+m[1]*ny+m[2]*nz, m[3]*nx+m[4]*ny+m[5]*nz, m[6]*nx+m[7]*ny+m[8]*nz);
        ch.uv.push(mesh.uv[v*2]*info.uvk, mesh.uv[v*2+1]*info.uvk);
        if(colors) ch.col.push(colors[v*3]/255, colors[v*3+1]/255, colors[v*3+2]/255); else ch.col.push(1,1,1);
        ch.tint.push(info.tint[0],info.tint[1],info.tint[2]);
        ch.rect.push(info.rect[0],info.rect[1],info.rect[2],info.rect[3]); ch.plain.push(info.plain||0);
      }
    }
    ch.parts++;
    if(ctx.mode==='room' && p.cells) p.cells.forEach(cc => ch.cells.add(cc));
    if(ch.gid!==(p.gid||null)) ch.gid = null;
  }
  return [...chunks.values()];
}
const hasWaterPart = (o,prefabs) => o.kind==='inst' && !!(prefabs[o.prefab] && prefabs[o.prefab].parts.some(p => p.water));
function combineParts(objects,prefabs){
  const out = [];
  for(const o of objects){
    if(o.hidden || o.water || hasWaterPart(o,prefabs)) continue;
    if(o.kind==='prim') out.push({oid:o.id, idx:0, geo:o.geo, size:o.size, pos:o.pos, rot:o.rot, m:rotMatOf(o), color:o.color, tex:o.tex||null, cells:o.cells||null, gid:o.gid||null});

      pf.parts.forEach((p,i) => { const x = partXf(o,p); out.push({oid:o.id, idx:i, geo:p.geo, size:p.size, pos:x.pos,
        rot:p.rot+o.rot, m:x.m, color:p.color, tex:p.tex||null, cells:o.cells||null, gid:o.gid||null}); });
    }
  }

}

function buildCombined(key){
  const t0 = performance.now();
  const parts = combineParts(S.objects,S.prefabs);
  const used = new Set();
  for(const p of parts) if(p.tex) for(const k of Object.keys(p.tex)){ const id = p.tex[k]; if(id && texMeta(id)) used.add(id); }
  const atlas = {W:ATL_W, H:ATL_W, tex:null};   // el atlas es único y permanente
  const slotInfo = (p,slot) => slotLook(p,slot);
  const getMesh = p => {
    const r = currentBake && currentBake.byTask.get(p.oid+'#'+p.idx);
    return r ? {mesh:r.mesh, colors:r.colors} : {mesh:bakeMesh(p.geo,p.size,1e9,bakeProvider), colors:null};
  };
  const raw = buildChunks(parts,{mode:COMB.mode, size:COMB.size, getMesh, slotInfo});
  const chunks = []; let verts = 0;
  for(const ch of raw){
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(new Float32Array(ch.pos),3));
    g.setAttribute('normal', new T.BufferAttribute(new Float32Array(ch.nor),3));
    g.setAttribute('uv', new T.BufferAttribute(new Float32Array(ch.uv),2));
    g.setAttribute('color', new T.BufferAttribute(new Float32Array(ch.col),3));
    g.setAttribute('tint', new T.BufferAttribute(new Float32Array(ch.tint),3));
    g.setAttribute('rect', new T.BufferAttribute(new Float32Array(ch.rect),4));
    g.setAttribute('plain', new T.BufferAttribute(new Float32Array(ch.plain),1));
    g.computeBoundingSphere();
    const mesh = new T.Mesh(g,atlasMat);
    mesh.userData.chunk = true; mesh.userData.rootNode = mesh; mesh.userData.lw = new Float32Array(MAXL);
    mesh.onBeforeRender = lightHook;
    scene.add(mesh);
    chunks.push({mesh, cells:[...ch.cells], gid:ch.gid, box:ch.box, verts:ch.pos.length/3, parts:ch.parts});
    verts += ch.pos.length/3;
  }
  for(const o of S.objects){ if(o.water || hasWaterPart(o,S.prefabs)) continue; const n = nodes.get(o.id); if(n){ n.userData.hid = true; n.visible = false; } }   // el agua queda como pieza propia (es transparente)
  invalidate();
  return {key, chunks, atlas, info:{mode:COMB.mode, size:COMB.size, chunks:chunks.length, parts:parts.length, objects:S.objects.length, verts, ms:Math.round(performance.now()-t0), atlasW:atlas.W, atlasH:atlas.H, textures:used.size}};
}
function clearCombined(){

  if(!show || stepped) return;
  const t = terrHover.t, rt = terrRT.get(t.id), p = terrRing.geometry.attributes.position, R = TERR.radius;
  for(let k=0;k<64;k++){
    const a = k/64*Math.PI*2, x = terrHover.x+Math.cos(a)*R, z = terrHover.z+Math.sin(a)*R;
    p.setXYZ(k,x,terrainHeight(t,rt.hf,x,z)+0.08,z);
  }
  p.needsUpdate = true;
}
const terrFrame = () => {
  if(tool==='terrain' && !PSX.on && !walk.on) return;
  if(terrRing && terrRing.visible) terrRing.visible = false;
  if(terrCells && terrCells.visible) terrCells.visible = false;
};

/* ---- esculpir ---- */
function terrBegin(e){
  if(terrDrag && e.pointerId!==terrDrag.pid){       // con un segundo dedo se corta el trazo y se navega con dos dedos
    const d = terrDrag; terrEnd();
    pointers.set(d.pid,{x:d.cx,y:d.cy,sx:d.cx,sy:d.cy,t:performance.now(),moved:true,type:'touch'});
    return false;
  }
  if(e.pointerType==='pen') terrPen = true;
  if(!terrains().length || TERR.nav) return false;
  if(e.pointerType==='mouse' && e.button!==0) return false;
  if(e.pointerType==='touch' && terrPen) return false;   // con lápiz, los dedos mueven la cámara
  setRay(e);
  const h = terrainPick(); if(!h) return false;           // tocar fuera del terreno mueve la cámara
  TERR.sel = h.t.id;
  terrDrag = {pid:e.pointerId, t:h.t, cx:e.clientX, cy:e.clientY, last:performance.now()-16, target:h.y, changed:false, mask:new Uint8Array((h.t.nx+1)*(h.t.nz+1))};
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  terrainTick(); return true;
}
function terrMove(e){
  if(terrDrag){ if(e.pointerId===terrDrag.pid){ terrDrag.cx = e.clientX; terrDrag.cy = e.clientY; invalidate(); } return true; }
  if(e.pointerType==='touch' || !terrains().length) return false;
  setRay(e); const h = terrainPick();
  terrHover = h ? {x:h.x, z:h.z, t:h.t} : null; drawRing(); invalidate();
  return false;
}
function terrainTick(){
  const d = terrDrag; if(!d) return;
  const now = performance.now(), dt = Math.min(0.05,Math.max(0.008,(now-d.last)/1000)); d.last = now;
  setRay({clientX:d.cx, clientY:d.cy});
  const rt = rtOf(d.t), q = rayParts();
  const r = rayTerrain(d.t,rt.hf,q[0],q[1],q[2],q[3],q[4],q[5],3000);
  if(!r) return;
  terrHover = {x:r.x, z:r.z, t:d.t};
  const tmode_ = terrMode();
const reg = (TERR.step && tmode_!=='smooth')
    ? brushStep(d.t,rt.hf,brushCells(d.t,r.x,r.z,TERR.radius),TERR.stepSize,tmode_,d.mask,d.target)
    : brushApply(d.t,rt.hf,r.x,r.z,TERR.radius,TERR.strength,tmode_,dt,d.target);
  if(reg){
    const [i0,i1,j0,j1] = terrainRegion(rt.A,d.t,rt.hf,reg[0],reg[1],reg[2],reg[3]), w = d.t.nx+1, g = rt.mesh.geometry;
    for(const k of ['position','normal','color']){
      const at = g.attributes[k]; at.updateRange.offset = j0*w*3; at.updateRange.count = (j1-j0+1)*w*3; at.needsUpdate = true;
    }
    let mn = terrMinH; for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){ const v = rt.hf[j*w+i]; if(v<mn) mn = v; }
    terrMinH = mn;   // si se baja el relieve durante el trazo, el piso baja con él
    d.changed = true;
  }
  drawRing(); invalidate();
}
function terrEnd(){
  const d = terrDrag; if(!d) return;
  terrDrag = null;
  if(d.changed){
    const rt = terrRT.get(d.t.id);
    if(rt){ d.t.hb64 = encodeH(rt.hf); rt.str = d.t.hb64; rt.mesh.geometry.computeBoundingSphere(); }
    recomputeTerrMin();
    commit();
  }
  invalidate();
}

/* ---- crear, teselar y retocar ---- */
function terrainCreate(w,d,cs,base){
  cs = Math.max(0.25,cs);
  const nx = Math.max(2,Math.round(w/cs)), nz = Math.max(2,Math.round(d/cs));
  if((nx+1)*(nz+1)>TERR_MAXV) return {error:'Son demasiados vértices ('+fmtN((nx+1)*(nz+1))+'). Probá con celdas más grandes o un terreno más chico.'};
  const hf = new Float32Array((nx+1)*(nz+1)).fill(base);
  const t = {id:newId('t'), name:'Terreno '+(terrains().length+1), x:Math.round(view.target.x-nx*cs/2), z:Math.round(view.target.z-nz*cs/2), nx, nz, cs, color:4, tex:null, hb64:encodeH(hf)};
  terrains().push(t); TERR.sel = t.id; saveTerr(); syncTerrains(); commit();
  return {t};
}
function openTerrainCreate(){ WH.cat = 'ter'; WH.sub = 'tnew'; WH.open = true; WH.dialIt = null; renderWheel(); }
function terrCommitHf(t,hf){ t.hb64 = encodeH(hf); rtOf(t); recomputeTerrMin(); drawRing(); commit(); }
function terrOp(op){
  const t = selTerrain(); if(!t) return;
  const rt = rtOf(t), hf = rt.hf.slice();
  if(op==='sub'){
    if((t.nx*2+1)*(t.nz*2+1)>TERR_MAXV){ toast('No se puede teselar más: pasaría de '+fmtN(TERR_MAXV)+' vértices'); return; }
    const r = terrainSubdivide(t,hf); t.nx = r.nx; t.nz = r.nz; t.cs = r.cs; terrCommitHf(t,r.hf);
    toast('Teselado: celdas de '+String(t.cs).replace('.',',')+' m');
  } else if(op==='simp'){
    const r = terrainSimplify(t,hf); if(!r){ toast('No se puede simplificar: la cantidad de celdas es impar'); return; }
    t.nx = r.nx; t.nz = r.nz; t.cs = r.cs; terrCommitHf(t,r.hf);
  } else if(op==='noise'){ terrainNoise(t,hf,TERR.nAmp,TERR.nScale,(Math.random()*1e9)|0); terrCommitHf(t,hf); }
  else if(op==='flat'){ hf.fill(TERR.flat); terrCommitHf(t,hf); }
  else if(op==='smooth'){ terrainSmoothAll(t,hf,2); terrCommitHf(t,hf); }
  else if(op==='snap'){ terrainSnapAll(hf,TERR.stepSize); terrCommitHf(t,hf); }
}
function terrDelete(id){
  S.meta.terrains = terrains().filter(t => t.id!==id);
  if(TERR.sel===id) TERR.sel = null;
  terrHover = null; syncTerrains(); commit(); renderTerrbar();
}
function exportTerrains(){
  return terrains().map(t => { const m = t.tex && texMeta(t.tex);
    return {id:t.id, name:t.name, x:t.x, z:t.z, nx:t.nx, nz:t.nz, cs:t.cs, color:t.color, tex:m ? t.tex : null, tile:m ? (m.tile||2) : 0, h:t.hb64}; });
}

/* ---------- agua: material simple y transparente para lagos ---------- */
const FS_WATER = `
uniform float uTime;
uniform float uPsx; uniform float uFogOn; uniform vec3 uFogC; uniform float uFogN; uniform float uFogF;
${GLSL_LIGHT}
varying vec3 vWP; varying vec3 vWN; varying float vDepth; varying vec3 vCol;
void main(){
  vec3 n = normalize(vWN);
  float top = clamp(n.y,0.0,1.0);
  vec2 p = vWP.xz; float t = uTime;
  float a1 = sin(p.x*1.9 + t*0.8 + sin(p.y*0.8 + t*0.5)*1.6);
  float a2 = sin(p.y*2.4 - t*0.6 + sin(p.x*1.1 - t*0.4)*1.3);
  float a3 = sin((p.x+p.y)*1.3 + t*0.35);
  float rip = smoothstep(0.55, 1.15, (a1+a2+a3)/3.0*1.6 + 0.2);
  vec3 col = mix(vec3(0.13,0.36,0.46), vec3(0.45,0.72,0.80), rip*0.55*top);
  float lt = 1.0;
  if(uPsx>0.5 && uBaked<0.5 && uLit>0.5){ vec3 l = psxLight(vWP,n); lt = clamp((l.r+l.g+l.b)/3.0, 0.0, 1.4); }
  col *= mix(0.5,1.0,top)*lt;
  float alpha = clamp(mix(0.92,0.66,top) + rip*0.12*top, 0.0, 0.95);
  if(uPsx>0.5 && uFogOn>0.5){ float f = clamp((vDepth-uFogN)/max(uFogF-uFogN,0.001),0.0,1.0); col = mix(col,uFogC,f); alpha = mix(alpha,1.0,f); }
  gl_FragColor = vec4(col,alpha);
}`;
const waterMat = new T.ShaderMaterial({uniforms:Object.assign({uTime:{value:0}}, UPSX), vertexShader:VS_OBJ, fragmentShader:FS_WATER, transparent:true, depthWrite:false});
const waterAnim = () => S.objects.some(o => o.water && !o.hidden);

// un plano de agua del tamaño del terreno, a la altura elegida

}

/* ---------- sliders táctiles: sin saltos al tocar ni al scrollear ---------- */
// Un toque sobre un slider lo hacía saltar a ese punto, también cuando el toque era para scrollear el panel.
// Ahora el slider no recibe el toque directo: con el dedo se arrastra en horizontal desde el valor que tenía
// (si el gesto es vertical, es un scroll y no lo toca); con el mouse funciona como siempre.
const SLD = {p:null};
function sliderAt(x,y){
  for(const el of document.querySelectorAll('input[type=range]')){
    if(el.disabled || !el.offsetParent) continue;
    const r = el.getBoundingClientRect();
    if(r.width && x>=r.left-6 && x<=r.right+6 && y>=r.top-10 && y<=r.bottom+10) return el;
  }
  return null;
}
function sliderSet(el,v){
  const min = el.min==='' ? 0 : +el.min, max = el.max==='' ? 100 : +el.max, st = (+el.step>0) ? +el.step : 1;
  v = Math.min(max,Math.max(min,Math.round((v-min)/st)*st+min));
  const nv = String(+v.toFixed(6));
  if(nv===el.value) return false;
  el.value = nv; el.dispatchEvent(new Event('input',{bubbles:true}));
  return true;
}
document.addEventListener('pointerdown', e => {
  if(e.pointerType==='mouse' && e.button!==0) return;
  const el = sliderAt(e.clientX,e.clientY); if(!el) return;
  const r = el.getBoundingClientRect();
  const p = SLD.p = {id:e.pointerId, el, x0:e.clientX, y0:e.clientY, v0:+el.value, w:Math.max(20,r.width-20), left:r.left+10,
    min:el.min==='' ? 0 : +el.min, max:el.max==='' ? 100 : +el.max, on:false, abs:e.pointerType==='mouse', changed:false};
  if(p.abs){ p.on = true; p.changed = sliderSet(el,p.min+(e.clientX-p.left)/p.w*(p.max-p.min)); e.preventDefault(); }
}, true);
document.addEventListener('pointermove', e => {
  const p = SLD.p; if(!p || e.pointerId!==p.id) return;
  const dx = e.clientX-p.x0, dy = e.clientY-p.y0;
  if(!p.on){
    if(Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)){ SLD.p = null; return; }     // es un scroll: el valor no cambia
    if(Math.abs(dx)<8 || Math.abs(dx)<Math.abs(dy)*1.2) return;
    p.on = true; p.x0 = e.clientX; p.v0 = +p.el.value;                             // desde acá se arrastra
  }
  const v = p.abs ? p.min+(e.clientX-p.left)/p.w*(p.max-p.min) : p.v0+(e.clientX-p.x0)/p.w*(p.max-p.min);
  if(sliderSet(p.el,v)) p.changed = true;
  e.preventDefault();
}, {capture:true, passive:false});
const sliderEnd = e => {
  const p = SLD.p; if(!p || e.pointerId!==p.id) return;
  SLD.p = null;
  if(p.changed) p.el.dispatchEvent(new Event('change',{bubbles:true}));
};
document.addEventListener('pointerup', sliderEnd, true);
document.addEventListener('pointercancel', sliderEnd, true);

// todas las texturas dibujadas en su celda; devuelve el PNG del atlas (base64)
async function atlasForExport(){

/* ---------- Google Drive ----------
   El proyecto ya vive en archivos (IndexedDB). Drive es un segundo destino con los mismos archivos: primero se suben los que cambiaron y al final
   el manifiesto (project.json), así que lo que hay en Drive es siempre un proyecto completo o el estado anterior. Un archivo por cada archivo local,
   en una carpeta por proyecto dentro de «Maqueta» (nombres con «~» en lugar de «/»). Permiso drive.file: la app solo ve lo que ella misma creó.
   Solo funciona en la versión alojada, con un Client ID propio de Google Cloud. */

function drvLoadGIS(){
  return new Promise((res,rej) => {
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ res(); return; }
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    const to = setTimeout(() => rej(drvErr('Google tardó demasiado en responder')),12000);
    sc.onload = () => { clearTimeout(to); res(); };
    sc.onerror = () => { clearTimeout(to); rej(drvErr('No se pudo cargar Google. ¿Este sitio bloquea las conexiones externas? La versión del chat las bloquea: usá la versión alojada.')); };

// interactive=false (guardado automático): nunca abre ventanas; si no hay permiso vigente, avisa que hay que reconectar
async function drvToken(interactive){
  if(DRV.token && Date.now()<DRV.exp-60000) return DRV.token;
  if(!interactive) throw drvErr('Hay que volver a conectar con Google','auth');
  if(!DRV.cid) throw drvErr('Falta el Client ID de Google','noid');
  await drvLoadGIS();
  return new Promise((res,rej) => {
    if(!DRV.client){
      DRV.client = window.google.accounts.oauth2.initTokenClient({client_id:DRV.cid, scope:'https://www.googleapis.com/auth/drive.file',
        callback:r => { const p = DRV.pending; DRV.pending = null; if(!p) return; if(r && r.access_token){ DRV.token = r.access_token; DRV.exp = Date.now()+(+r.expires_in || 3600)*1000; DRV.connected = true; drvSave(); p.res(DRV.token); } else p.rej(drvErr((r && (r.error_description || r.error)) || 'Google no dio el permiso')); },
        error_callback:r => { const p = DRV.pending; DRV.pending = null; if(p) p.rej(drvErr(r && r.type==='popup_closed' ? 'Cerraste la ventana de Google' : 'No se pudo abrir la ventana de Google (¿está bloqueada?)')); }});
    }
    DRV.pending = {res, rej};
    DRV.client.requestAccessToken({prompt:DRV.connected ? '' : 'consent'});
  });
}
// pedido a Drive con reintentos (corte de red, 429, 5xx); un 401 pide permiso otra vez si el usuario lo está haciendo a mano
async function dReq(url,opts){
  opts = opts || {}; let tok = await drvToken(DRV.interactive);
  for(let i = 0;; i++){
    let r;
    try{ r = await driveFetch(url,Object.assign({},opts,{headers:Object.assign({},opts.headers || {},{Authorization:'Bearer '+tok})})); }
    catch(_){ if(i<DRV.retryMs.length){ await dSleep(DRV.retryMs[i]); continue; } throw drvErr('Sin conexión con Drive','net'); }
    if(r.ok) return r;
    if(r.status===401){ DRV.token = null; if(i>=1) throw drvErr('Hay que volver a conectar con Google','auth'); tok = await drvToken(DRV.interactive); continue; }
    let body = ''; try{ body = await r.text(); }catch(_){}
    if((r.status===429 || r.status>=500 || (r.status===403 && /rate|quota/i.test(body))) && i<DRV.retryMs.length){ await dSleep(DRV.retryMs[i]); continue; }
    let msg = ''; try{ const j = JSON.parse(body); msg = (j.error && (j.error.message || j.error)) || ''; }catch(_){}
    const e = drvErr('Drive: '+(msg || r.status)); e.status = r.status; throw e;
  }
}
const dJson = async (u,o) => (await dReq(u,o)).json();
const dq = x => String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function dFolderFind(name,parent){

  const j = await dJson(DRIVE_API+'/files?q='+encodeURIComponent(q)+'&fields='+encodeURIComponent('files(id,name)')+'&pageSize=10');

}
const dFolderMake = (name,parent,props) => dJson(DRIVE_API+'/files?fields=id',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, mimeType:'application/vnd.google-apps.folder', parents:parent ? [parent] : undefined, appProperties:props})});

async function dProjFolder(e){

async function dList(folderId){

    const j = await dJson(DRIVE_API+'/files?q='+encodeURIComponent("'"+folderId+"' in parents and trashed=false")+'&fields='+encodeURIComponent('nextPageToken,files(id,name,appProperties)')+'&pageSize=1000'+(page ? '&pageToken='+encodeURIComponent(page) : ''));
    for(const f of j.files || []) out.set(f.name,{id:f.id, h:(f.appProperties || {}).h || ''});
    page = j.nextPageToken || '';

  return out;

async function dPut(folderId,name,text,hash,id){
  if(text.length>4800000) throw drvErr('«'+name+'» pesa más de 4,8 MB y Drive no lo acepta así');
  const bd = 'mq'+Math.random().toString(36).slice(2), meta = id ? {appProperties:{h:hash}} : {name, parents:[folderId], mimeType:'application/json', appProperties:{h:hash}};
  const body = '--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+text+'\r\n--'+bd+'--';
  const r = await dReq(DRIVE_UP+'/files'+(id ? '/'+id : '')+'?uploadType=multipart&fields=id',{method:id ? 'PATCH' : 'POST', headers:{'Content-Type':'multipart/related; boundary='+bd}, body});

const dGetText = async id => (await dReq(DRIVE_API+'/files/'+id+'?alt=media')).text();
const dDelete = id => dReq(DRIVE_API+'/files/'+id,{method:'DELETE'});
async function dPool(items,fn){
  let i = 0, err = null;
  await Promise.all(Array.from({length:Math.min(DRV.conc,items.length)}, async () => { while(!err){ const k = i++; if(k>=items.length) return; try{ await fn(items[k],k); }catch(e){ err = err || e; } } }));
  if(err) throw err;
}
// ---- decidir qué hacer: comparar el manifiesto local y el de Drive con lo que había en la última sincronización ----
async function drvLocal(e){
  const mr = await FS.get(e.base+'project.json');
  if(!mr || hash53(mr.data)!==mr.hash) throw drvErr('El proyecto local está dañado');
  return {text:mr.data, hash:mr.hash, man:JSON.parse(mr.data)};
}
function drvPlan(d,rp,lh){
  if(!rp) return 'push';
  if(rp.h===lh) return 'same';
  const rc = rp.h!==d.rh, lc = lh!==d.lh;
  return rc===lc ? 'conflict' : rc ? 'pull' : 'push';   // cambió en los dos lados (o no se sabe cuál): decide la persona
}
async function drvPush(e,folder,R,loc){
  const files = loc.man.files || {}, jobs = [];
  for(const rel of Object.keys(files)){ const r = R.get(dEnc(rel)); if(!r || r.h!==files[rel]) jobs.push({rel, nm:dEnc(rel), id:r && r.id, h:files[rel]}); }
  const recs = await FS.getMany(jobs.map(j => e.base+j.rel));
  await dPool(jobs,async (j,i) => { const rec = recs[i]; if(!rec || hash53(rec.data)!==j.h) throw drvErr('Falta o está dañado el archivo local «'+j.rel+'»'); await dPut(folder,j.nm,rec.data,j.h,j.id); });
  const keep = new Set(Object.keys(files).map(dEnc)); keep.add('project.json');
  await dPool([...R.entries()].filter(([n]) => !keep.has(n)), async ([,r]) => { await dDelete(r.id); });
  await dPut(folder,'project.json',loc.text,loc.hash,(R.get('project.json') || {}).id);   // el manifiesto va al final: es el «commit»
}
// baja y verifica todo antes de tocar nada local; devuelve lo que hay que escribir
async function drvPull(e,R,rp,loc){
  const text = await dGetText(rp.id);
  if(hash53(text)!==rp.h) throw drvErr('El manifiesto de Drive no coincide con su hash (subida incompleta)');
  const man = JSON.parse(text), files = man.files || {}, have = (loc && loc.man.files) || {}, jobs = [];
  for(const rel of Object.keys(files)){ const r = R.get(dEnc(rel)); if(!r || r.h!==files[rel]) throw drvErr('En Drive falta o no coincide «'+rel+'»: la subida quedó a medias'); if(have[rel]!==files[rel]) jobs.push({rel, id:r.id, h:files[rel]}); }
  const got = new Array(jobs.length);
  await dPool(jobs,async (j,i) => { const t = await dGetText(j.id); if(hash53(t)!==j.h) throw drvErr('«'+j.rel+'» llegó dañado desde Drive'); got[i] = t; });
  const now = Date.now(), puts = jobs.map((j,i) => ({path:e.base+j.rel, data:got[i], hash:j.h, t:now}));
  puts.push({path:e.base+'project.json', data:text, hash:rp.h, t:now});
  return {puts, dels:Object.keys(have).filter(rel => !(rel in files)).map(rel => e.base+rel), text, h:rp.h};

const drvCommitReg = () => projQ(() => FS.commit([regRec(Date.now())],[]));
async function drvReloadOpen(e){

// resolve: 'local' o 'drive' cuando la persona ya eligió en un conflicto
async function drvSyncOne(e,resolve){
  const d = e.drive || (e.drive = {});
  if(PROJ.id===e.id) await projFlush();
  const loc = await drvLocal(e), folder = await dProjFolder(e), R = await dList(folder), rp = R.get('project.json');
  let plan = drvPlan(d,rp,loc.hash);
  if(plan==='conflict'){ if(resolve==='local') plan = 'push'; else if(resolve==='drive') plan = 'pull'; else return {plan:'conflict'}; }
  if(plan==='pull' && PROJ.id===e.id && (edit || ME.on || UVE.on || ted || walk.on)) return {plan:'blocked'};
  if(plan==='same'){ d.rh = d.lh = loc.hash; d.last = Date.now(); await drvCommitReg(); return {plan}; }
  if(plan==='push'){ await drvPush(e,folder,R,loc); d.rh = d.lh = loc.hash; d.last = Date.now(); await drvCommitReg(); return {plan}; }
  const pl = await drvPull(e,R,rp,loc);
  d.rh = d.lh = pl.h; d.last = Date.now();
  await projQ(() => FS.commit(pl.puts.concat([regRec(Date.now())]),pl.dels));
  if(PROJ.id===e.id) await drvReloadOpen(e);
  return {plan};
}

    row.appendChild(chip(okTok ? 'Reconectar' : (DRV.connected ? 'Reconectar' : 'Conectar'),() => act(async () => { const v = inp.value.trim(); if(v!==DRV.cid){ DRV.cid = v; DRV.client = null; drvSave(); } await drvToken(true); DRV.status = 'ok'; DRV.err = ''; toast('Conectado con Google'); })));
    row.appendChild(chip('Sincronizar ahora',() => act(async () => {
      await drvToken(true); DRV.status = 'sync'; drvRefreshUI();
      const r = await drvSyncOne(e); DRV.status = r.plan==='conflict' ? 'conflict' : 'ok'; DRV.last = Date.now();
      if(r.plan==='conflict'){ drvAskConflict(e); return false; } else toast(r.plan==='pull' ? 'Se trajeron los cambios de Drive' : r.plan==='push' ? 'Subido a Drive' : r.plan==='blocked' ? 'Terminá de editar para traer lo de Drive' : 'Todo al día');
    }),!on || !DRV.cid));
    row.appendChild(chip('Traer proyectos de Drive',() => act(async () => { await drvToken(true); const n = await drvImport(); toast(n ? 'Se trajeron '+n+(n===1 ? ' proyecto' : ' proyectos')+' de Drive' : 'No hay proyectos nuevos en Drive'); }),!DRV.cid));
    if(okTok) row.appendChild(chip('Desconectar',() => act(async () => { try{ if(window.google && window.google.accounts) window.google.accounts.oauth2.revoke(DRV.token,() => {}); }catch(_){} DRV.token = null; DRV.exp = 0; DRV.connected = false; DRV.status = 'off'; drvSave(); toast('Desconectado'); })));
    const cl = document.createElement('label'); cl.style.cssText = 'display:flex;align-items:center;gap:10px;margin:8px 0 4px;font-size:14px';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = on; cb.disabled = !okTok; cb.style.cssText = 'width:20px;height:20px';
    cb.onchange = () => act(async () => {
      if(cb.checked){ e.drive = e.drive || {}; e.drive.on = true; await drvToken(true); const r = await drvSyncOne(e); DRV.status = r.plan==='conflict' ? 'conflict' : 'ok'; DRV.last = Date.now(); if(r.plan==='conflict'){ drvAskConflict(e); return false; } else toast('«'+e.name+'» se guarda en Drive'); }
      else { e.drive.on = false; await drvCommitReg(); toast('Este proyecto ya no se guarda en Drive'); }
    });
    cl.appendChild(cb); cl.appendChild(document.createTextNode('Guardar «'+((e && e.name) || 'este proyecto')+'» en Drive')); body.appendChild(cl);
    if(!okTok) P('Primero conectá con Google para activar esta opción.','font-size:12px;color:var(--muted);margin:0 0 8px');
    P('Cómo conseguir el Client ID: en Google Cloud creás un proyecto, activás la API de Google Drive y creás un «ID de cliente de OAuth» de tipo aplicación web, con la dirección de este sitio como origen autorizado. La guía paso a paso está en el LEEME que viene con el sitio.','font-size:12px;color:var(--muted);margin:6px 0 0');
  }, [{label:'Cerrar', primary:true}]);
}

/* ---------- mouse y teclado ---------- */
const KB = {space:false};
const KB_HELP = [
  ['Herramientas',[['W o V','Mover'],['E','Rotar'],['R','Tamaño'],['B','Pintar'],['T','Terreno'],['P','Colocar (Construir)'],['L','Luz'],['N','Nota']]],
  ['Selección',[['Clic','Elegir una pieza'],['Ctrl + clic','Sumar o quitar de la selección'],['Ctrl + A','Elegir todo'],['Doble clic','Prefab o malla: editar · pieza: enfocar · vacío: encuadrar todo'],['Clic derecho','Menú de lo elegido'],['Esc','Quitar la selección']]],
  ['Edición',[['Flechas','Mover lo elegido (según la cámara)'],['Re Pág y Av Pág','Subir y bajar'],['Mayús + flecha','Paso fino'],[', y .','Girar a la izquierda y a la derecha'],['Ctrl + D','Duplicar'],['Supr','Borrar'],['F2','Renombrar'],['H','Ocultar o mostrar'],['Alt + H','Mostrar todo'],['Ctrl + G','Agrupar'],['Ctrl + Mayús + G','Desagrupar'],['Ctrl + Z o Y','Deshacer y rehacer'],['Ctrl + S','Guardar ahora']]],
  ['Cámara',[['Arrastrar','Orbitar'],['Botón derecho o medio + arrastrar','Desplazar'],['Mayús + arrastrar','Desplazar'],['Espacio + arrastrar','Desplazar'],['Rueda','Zoom hacia el cursor'],['F','Enfocar lo elegido'],['Inicio','Encuadrar todo'],['O','Perspectiva u ortogonal'],['Teclado numérico 1, 3 y 7','Frente, derecha y arriba (con Ctrl: atrás e izquierda)']]],
  ['Editar malla',[['V, A y C (o 1, 2 y 3)','Vértices, aristas y caras'],['X, I y B','Extruir, inset y biselar'],['Flechas','Mover lo elegido'],['U','Editor UV'],['Supr','Borrar lo elegido'],['O o Esc','Salir']]],
  ['Editor UV',[['G, R y S','Mover, girar y escalar'],['Ctrl + A','Elegir todas las caras'],['Esc','Volver']]],
  ['Terreno',[['- y +','Radio del pincel']]],
  ['Recorrido',[['W A S D o flechas','Caminar'],['Mayús','Correr'],['Ctrl o C','Agacharse'],['Espacio','Saltar'],['Mouse','Mirar (el clic lo captura; Esc lo suelta)'],['Esc','Salir']]],
  ['Editor de texturas',[['Supr','Borrar el nodo'],['Ctrl + D','Duplicar el nodo'],['Ctrl + Z o Y','Deshacer y rehacer'],['Esc','Cerrar']]]
];
function kbHelpHtml(){
  return KB_HELP.map(g => '<div class="kg"><h4>'+esc(g[0])+'</h4>'+g[1].map(r => '<div class="kr"><span class="kk">'+r[0].split(' + ').map(x => '<span class="kbd">'+esc(x)+'</span>').join('+')+'</span><span>'+esc(r[1])+'</span></div>').join('')+'</div>').join('');
}
const typing = t => {
  const tg = (t && t.tagName || '').toLowerCase();
  if(tg==='input') return !['checkbox','radio','button','submit','reset','file','image','color'].includes(String(t.type || 'text').toLowerCase());   // las casillas no son texto: dejan pasar los atajos
  return tg==='textarea' || tg==='select' || !!(t && t.isContentEditable);
};
function physMod(k,on){ const m = MOD[k]; if(m.key===on) return; m.key = on; modChanged(k); }
// cursor del mapa (solo con mouse)
function setCur(c){ if(canvas.dataset.cur!==c){ canvas.dataset.cur = c; canvas.style.cursor = c; } }
const curDefault = () => walk.on ? 'default' : KB.space ? 'grab' : (ME.on ? 'default' : ({place:'crosshair', light:'crosshair', pin:'crosshair', paint:'crosshair', terrain:'crosshair'})[tool] || 'default');
let hoverT = 0;
canvas.addEventListener('pointermove', e => {
  if(e.pointerType!=='mouse' || walk.on) return;
  if(e.buttons){ setCur(gest && (gest.type==='cam' || gest.type==='gizmo') ? 'grabbing' : curDefault()); return; }
  const now = performance.now(); if(now-hoverT<60) return; hoverT = now;
  let c = curDefault();
  if(!ME.on && !UVE.on && (tool==='move' || tool==='rot' || tool==='size')){ setRay(e); if(gizmoHit()) c = 'grab'; else if(pickObject()) c = 'pointer'; }
  setCur(c);
});
window.addEventListener('pointerdown', e => { if(e.pointerType==='mouse'){ physMod('ctrl',!!e.ctrlKey); physMod('shift',!!e.shiftKey); } }, true);
window.addEventListener('blur', () => { KB.space = false; physMod('ctrl',false); physMod('shift',false); setCur(curDefault()); });
window.addEventListener('keyup', e => {
  if(e.key==='Control') physMod('ctrl',false); else if(e.key==='Shift') physMod('shift',false);
  else if(e.code==='Space' && KB.space){ KB.space = false; setCur(curDefault()); }
});
// acciones sobre la selección
function selectAll(){ setSel(S.objects.filter(o => !o.hidden && !o.parent).map(o => o.id)); }
function renameSel(){ const o = selObjs()[0]; if(!o || sel.length!==1) return; askText('Nombre', o.name||'', v => { if(v){ o.name = v; commit(); renderHier(); } }); }
function toggleHideSel(){
  const roots = selObjs(); if(!roots.length) return;
  const v = roots.some(o => !o.hidden);
  for(const r of roots) for(const x of [r].concat(descendants(r.id))){ if(v) x.hidden = true; else delete x.hidden; syncNode(x); }
  commit(); renderHier();
}
function showAllObjs(){ let n = 0; for(const o of S.objects) if(o.hidden){ delete o.hidden; syncNode(o); n++; } if(n){ commit(); renderHier(); } toast(n ? 'Todo a la vista' : 'No había nada oculto'); }
function viewPreset(yaw,pitch){ setOrthographic(); view.yaw = yaw; view.pitch = pitch; updateCamera(); }
// flechas: mueven lo elegido en pasos de snap (con Mayús, fino), según hacia dónde mira la cámara
function kbNudge(e){
  const c = e.code;
  if(!(tool==='move' || (!ME.on && (tool==='rot' || tool==='size')))) return false;
  const st = snapStep() || 0.1, d = [0,0,0];
  if(c==='PageUp') d[1] = st; else if(c==='PageDown') d[1] = -st;
  else {
    const R = [Math.cos(view.yaw),-Math.sin(view.yaw)], F = [-Math.sin(view.yaw),-Math.cos(view.yaw)];
    const ax = v => Math.abs(v[0])>=Math.abs(v[1]) ? [Math.sign(v[0]),0] : [0,Math.sign(v[1])];
    const v = c==='ArrowRight' ? ax(R) : c==='ArrowLeft' ? ax([-R[0],-R[1]]) : c==='ArrowUp' ? ax(F) : ax([-F[0],-F[1]]);
    d[0] = v[0]*st; d[2] = v[1]*st;
  }
  if(ME.on){
    if(!ME.sel.size) return false;
    const cn = meCentroidArr(); if(!cn) return false;
    e.preventDefault(); const a = d.findIndex(x => x!==0); mePosSet(a,r4(cn[a]+d[a])); mePosDone(); return true;
  }
  if(!sel.length) return false;
  e.preventDefault();
  const ids = new Set(sel), roots = selObjs().filter(o => { let p = o.parent; while(p){ if(ids.has(p)) return false; p = (byId(p) || {}).parent; } return true; });
  for(const o of roots) moveTree(o,[r4(o.pos[0]+d[0]), r4(o.pos[1]+d[1]), r4(o.pos[2]+d[2])]);
  refreshOutlines(); commit(); return true;
}
// doble clic en el mapa
function canvasDbl(e){
  if(walk.on || ME.on || UVE.on || (gest && gest.type==='gizmo')) return;
  if(tool==='paint' || tool==='place' || tool==='light' || tool==='pin' || tool==='terrain') return;   // esas herramientas actúan con cada clic
  setRay(e);
  const h = pickObject();
  if(!h){ frame(null); updateCamera(); return; }   // en el vacío: encuadra todo
  const o = byId(h.id); if(!o) return;
  if(o.kind==='inst'){ if(!edit){ setSel([o.id]); enterEdit(o.id); } return; }   // prefab: editarlo
  if(meshOf(o.geo)){ setSel([o.id]); enterME(); return; }                          // malla: editarla
  setSel([o.id]); frame([o.id]); updateCamera();                                    // pieza suelta: enfocarla
}
// clic derecho en el mapa: menú de lo que haya debajo
let ctxAnchor = null;
function ctxMenuAt(e){
  if(ME.on || UVE.on || walk.on) return;
  const h = pickObject();
  if(h && !sel.includes(h.id)) setSel([h.id]);
  const os = selObjs(), one = os.length===1 ? os[0] : null, items = [];
  if(os.length){
    items.push({title: one ? (one.name || 'Objeto') : os.length+' objetos'});
    items.push({label:'Enfocar', hint:'F', run:() => { frame(sel); updateCamera(); }});
    items.push({label:'Duplicar', hint:'Ctrl+D', run:dupSel});
    if(one) items.push({label:'Renombrar', hint:'F2', run:renameSel});
    items.push({label:os.some(o => !o.hidden) ? 'Ocultar' : 'Mostrar', hint:'H', run:toggleHideSel});
    if(one && one.kind==='inst') items.push({label:'Editar prefab', hint:'doble clic', run:() => { if(!edit) enterEdit(one.id); }});
    else if(one && meshOf(one.geo)) items.push({label:'Editar malla', hint:'doble clic', run:enterME});
    if(os.length>1) items.push({label:'Agrupar', hint:'Ctrl+G', run:groupSel});
    if(os.some(isGroup)) items.push({label:'Desagrupar', hint:'Ctrl+Mayús+G', run:ungroupSel});
    items.push({sep:1}, {label:'Borrar', hint:'Supr', run:delSel});
  } else {
    items.push({label:'Encuadrar todo', hint:'Inicio', run:() => { frame(null); updateCamera(); }},
      {label:'Elegir todo', hint:'Ctrl+A', run:selectAll},
      {label:view.ortho ? 'Vista en perspectiva' : 'Vista ortogonal', hint:'O', run:() => $('bProj').click()});
  }
  closeMenu();
  if(!ctxAnchor){ ctxAnchor = document.createElement('div'); ctxAnchor.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;'; document.body.appendChild(ctxAnchor); }
  ctxAnchor.style.left = e.clientX+'px'; ctxAnchor.style.top = e.clientY+'px';
  openMenu(ctxAnchor,items);
}
// menús: flechas, Inicio y Fin; Esc cierra y devuelve el foco
function menuKey(e){
  if(e.key==='Escape'){ const a = menuAnchor; closeMenu(); if(a && a.focus) try{ a.focus(); }catch(_){} return; }
  const its = [...$('menu').querySelectorAll('.mitem')], n = its.length; if(!n) return;
  const i = its.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){ e.preventDefault(); its[i<0 ? 0 : (i+1)%n].focus(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); its[i<0 ? n-1 : (i-1+n)%n].focus(); }
  else if(e.key==='Home'){ e.preventDefault(); its[0].focus(); }
  else if(e.key==='End'){ e.preventDefault(); its[n-1].focus(); }
}
function texKey(e){
  if(typing(e.target)) return;
  const md = e.ctrlKey || e.metaKey, kk = e.key.toLowerCase();
  if(e.key==='Escape') closeTexEditor();
  else if(md && kk==='z'){ e.preventDefault(); e.shiftKey ? texRedo() : texUndo(); }
  else if(md && kk==='y'){ e.preventDefault(); texRedo(); }
  else if(md && kk==='d' && ted.view==='graph'){ e.preventDefault(); dupNode(); }
  else if((e.key==='Delete' || e.key==='Backspace') && ted.view==='graph'){ e.preventDefault(); delNode(); }
}
function kbUV(e){
  const mod = e.ctrlKey || e.metaKey, kl = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if(e.key==='Escape'){ uvClose(); return; }
  if(CTRL.kbd===false || e.altKey) return;
  if(mod && kl==='a'){ e.preventDefault(); ME.sel.clear(); uvFaces().forEach(i => ME.sel.add(i)); renderME(); uvRefresh(); return; }
  if(mod) return;
  const t = {g:'move', r:'rot', s:'size'}[kl]; if(t){ UVE.tool = t; uvToolbar(); }
}
function kbME(e){
  const mod = e.ctrlKey || e.metaKey, kl = e.key.length===1 ? e.key.toLowerCase() : e.key, c = e.code;
  if(mod && kl==='a'){ e.preventDefault(); meAll(); return true; }
  if(mod || e.altKey) return false;
  if(kl==='v' || c==='Digit1'){ meMode('vert'); return true; }
  if(kl==='a' || c==='Digit2'){ meMode('edge'); return true; }
  if(kl==='c' || c==='Digit3'){ meMode('face'); return true; }
  if(kl==='o'){ exitME(); return true; }
  if(kl==='u'){ uvOpen(); return true; }
  if(kl==='x' || kl==='i' || kl==='b'){
    if(!(ME.mode==='face' && ME.sel.size>0)){ toast('Elegí caras en el modo Caras'); return true; }
    const op = kl==='x' ? 'ext' : kl==='i' ? 'inset' : 'bev';
    ME.op = ME.op===op ? null : op; renderWheel(); return true;
  }
  return false;
}
function kbEsc(){
  if(WH.dialIt){ const b = document.querySelector('#wheel [data-wcenter]'); if(b){ b.click(); return; } }   // cierra el dial como «Listo»
  if(ME.on){ if(ME.op){ ME.op = null; renderWheel(); } else if(ME.sel.size){ ME.sel.clear(); renderME(); renderWheel(); } else exitME(); return; }
  if(PSX.on){ setPsx(false); return; }
  if(appEl.classList.contains('open')){ closePanel(); return; }
  if(sel.length){ setSel([]); return; }
  if(tool!=='move') setTool('move');
}
function kbMain(e){
  const mod = e.ctrlKey || e.metaKey, c = e.code, k = e.key, kl = k.length===1 ? k.toLowerCase() : k;
  const shown = id => { const el = $(id); return !!el && el.classList.contains('show'); };
  if(shown('prjEd') || shown('ctlEd')){ if(k==='Escape'){ if(shown('prjEd')) prjClose(); else ctlClose(); } return; }   // con una vista encima, solo Esc
  // siempre disponibles
  if(mod && kl==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(mod && kl==='y'){ e.preventDefault(); redo(); return; }
  if(mod && kl==='s'){ e.preventDefault(); if(PROJ.ok) projFlush().then(() => toast('Proyecto guardado')); else { save(); toast('Proyecto guardado'); } return; }
  if(UVE.on){ kbUV(e); return; }
  if(mod && kl==='d'){ e.preventDefault(); dupSel(); return; }
  if(k==='Delete' || k==='Backspace'){ e.preventDefault(); if(ME.on) meDelete(); else delSel(); return; }
  if(k==='Escape'){ kbEsc(); return; }
  if(CTRL.kbd===false) return;
  // desplazar el mapa con Espacio + arrastrar
  if(c==='Space'){ const ae = document.activeElement; if(!ae || ae===document.body || ae===canvas){ e.preventDefault(); if(!KB.space){ KB.space = true; setCur('grab'); } return; } }
  if(ME.on && kbME(e)) return;
  // herramientas
  const tl = {w:'move', v:'move', e:'rot', r:'size', b:'paint', t:'terrain', p:'place', l:'light', n:'pin'}[kl];
  if(tl && !mod && !e.altKey && (!ME.on || tl==='move' || tl==='rot' || tl==='size')){ e.preventDefault(); if(tool!==tl) setTool(tl); return; }
  // vista
  if((c==='KeyF' || kl==='f' || c==='Home' || c==='NumpadDecimal') && !mod && !e.altKey){ e.preventDefault(); frame(c==='Home' ? null : sel); updateCamera(); return; }
  if(kl==='o' && !mod && !e.altKey){ $('bProj').click(); return; }
  if(c==='Numpad5'){ e.preventDefault(); $('bProj').click(); return; }
  if(c==='Numpad1'){ e.preventDefault(); viewPreset(mod ? Math.PI : 0, 0.02); return; }
  if(c==='Numpad3'){ e.preventDefault(); viewPreset(mod ? -Math.PI/2 : Math.PI/2, 0.02); return; }
  if(c==='Numpad7'){ e.preventDefault(); viewPreset(0, 1.553); return; }
  // selección y edición
  if(kl==='h' && !mod){ e.preventDefault(); if(e.altKey) showAllObjs(); else toggleHideSel(); return; }
  if(mod && kl==='a'){ e.preventDefault(); selectAll(); return; }
  if(mod && kl==='g'){ e.preventDefault(); if(e.shiftKey) ungroupSel(); else groupSel(); return; }
  if(c==='F2'){ e.preventDefault(); renameSel(); return; }
  if(k==='F1' || k==='?'){ e.preventDefault(); openHelp(); return; }
  if(/^(Arrow(Up|Down|Left|Right)|PageUp|PageDown)$/.test(c) && !mod && !e.altKey && !WH.dialIt){ if(kbNudge(e)) return; }
  if(!mod && !e.altKey){
    if(tool==='terrain' && !ME.on && (k==='-' || k==='+' || k==='=' || k==='_')){
      e.preventDefault(); TERR.radius = clamp(TERR.radius+((k==='-' || k==='_') ? -1 : 1),1,30); drawRing(); invalidate(); saveTerr(); renderWheel(); return;
    }
    if(k===',' || k==='.' || k==='[' || k===']'){
      if(!ME.on && sel.length){ e.preventDefault(); const st = WH.rstep>0 ? WH.rstep : 15; rotateSel((k===',' || k==='[') ? st : -st); }
      return;
    }
  }
}
window.addEventListener('keydown', e => {
  if((e.key==='Control' || e.key==='Shift') && !typing(e.target)) physMod(e.key==='Control' ? 'ctrl' : 'shift',true);
  if(modalOpen()){ if(e.key==='Escape'){ e.preventDefault(); closeModal(); } return; }
  if(menuAnchor){ menuKey(e); return; }
  if(ted){ texKey(e); return; }
  if(walk.on){ walkKey(e,true); return; }
  if(typing(e.target)) return;
  kbMain(e);
});

/* ---------- bucle ---------- */
let wireOn = false;
// alambre: las mallas de la escena se dibujan como líneas (no el piso ni los gizmos)
function applyWire(){
  const on = !!view.wire && !PSX.on;
  if(!on && !wireOn) return;
  scene.traverse(m => {
    if(!m.isMesh || m===ground || !m.material) return;
    for(let p = m; p; p = p.parent) if(p===gizMove || p===gizSize || p===gizRot) return;
    for(const mt of (Array.isArray(m.material) ? m.material : [m.material])) if(mt && mt.depthTest!==false && 'wireframe' in mt) mt.wireframe = on;
  });
  wireOn = on;
}
function render(){
  renderer.info.reset();
  applyWire(); updateColliders(); atlasFlush();
  for(const o of S.objects) if(o.kind==='light'){ const n = nodes.get(o.id); if(n) n.visible = !o.hidden && !PSX.on && !walk.on; }
  updateGizmo();
  groundMat.uniforms.uFade.value = Math.max(60, view.dist*3);
  updateGround();
  waterMat.uniforms.uTime.value = performance.now()/1000;
  updateCombiner(); terrFrame();
  updateCulling();
  updateLighting();
  if(PSX.on) renderPsx(); else { renderer.render(scene, cam); captureInfo(); }
  updatePins();
  noteFrame();
}
(function loop(){
  requestAnimationFrame(loop);
  if(document.hidden || !S) return;
  if(walk.on){ const nw = performance.now(); walkStep((nw-walk.last)/1000); walk.last = nw; idle = 2; }
  if(terrDrag){ terrainTick(); idle = Math.max(idle,2); }
  if((PSX.on || walk.on) && waterAnim()) idle = Math.max(idle,2);
  if(STATS.on && STATS.live) idle = Math.max(idle,2);
  if(idle>0){ idle--; render(); }
  if(STATS.on) maybeStats();
})();

/* ---------- arranque ---------- */
(function boot(){
  bootState().then(src => {
    PROJ.ready = true;
    rebuildAll(); updateSnapUI(); updateProjUI(); renderSelbar(); renderEditbar(); applyPsx();
    resize(); frame(null); updateCamera(); resetHistory(); renderWheel();
    firstRun();
    if(PROJ.ok && src==='legacy') toast('Proyecto guardado ahora en archivos. Tu copia anterior sigue en el navegador.');
    else if(!PROJ.ok && PROJ.err && /dañado/.test(PROJ.err)) toast('El proyecto guardado en archivos está dañado: se abrió la copia anterior.');
    if(PROJ.bad.length) toast('Hay '+PROJ.bad.length+' archivo(s) dañado(s). Mirá Más › Archivos del proyecto.');
  });
})();
})();
