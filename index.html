    drag.plane = new T.Plane(drag.n.clone(), -drag.n.dot(c));
    drag.screen = Math.abs(ray.ray.direction.dot(drag.n))<=0.12;      // anillo de canto: se mide el ángulo en la pantalla
    const a = rotAngle(drag); if(a===null){ drag = null; return false; }
    drag.last = a; drag.acc = 0;
  } else if(h==='x'||h==='y'||h==='z'){
    drag.P0 = c; drag.d = new T.Vector3(h==='x'?1:0,h==='y'?1:0,h==='z'?1:0);
    drag.s0 = lineParam(drag.P0,drag.d);
    if(drag.s0===null){ drag=null; return false; }
  } else if(h==='xz'){
    drag.plane = new T.Plane(new T.Vector3(0,1,0), -c.y);
    const q = new T.Vector3();
    if(!ray.ray.intersectPlane(drag.plane,q)){ drag=null; return false; }
    drag.q0 = q;
  } else {
    const o = objs[0]; drag.a = +h[1]; drag.sg = h[2]==='+'?1:-1;
    drag.d = axisDir(o,drag.a).multiplyScalar(drag.sg);
    drag.P0 = new T.Vector3(o.pos[0],o.pos[1],o.pos[2]).addScaledVector(drag.d, o.size[drag.a]/2);
    drag.s0 = lineParam(drag.P0,drag.d);
    if(drag.s0===null){ drag=null; return false; }
  }
  gest = {type:'gizmo'};
  return true;
}
// ángulo del puntero alrededor del centro del giro: sobre el piso, o en la pantalla si la cámara mira de costado
function rotAngle(d){
  const q = new T.Vector3();
  if(!d.screen && ray.ray.intersectPlane(d.plane,q)){ q.sub(d.c); return Math.atan2(q.dot(d.v), q.dot(d.u)); }
  const p = d.c.clone().project(cam), r = canvas.getBoundingClientRect(), asp = r.width/Math.max(1,r.height);
  if(Math.abs(ndc.x-p.x)+Math.abs(ndc.y-p.y)<1e-4) return null;
  const sg = cam.position.clone().sub(d.c).dot(d.n)>=0 ? 1 : -1;
  return sg*Math.atan2(ndc.y-p.y, (ndc.x-p.x)*asp);
}
function dragGizmo(){
  if(!drag) return;
  if(drag.me){ meDrag(); return; }
  if(drag.surf){ surfDrag(); return; }
  if(drag.h[0]==='r'){
    const a = rotAngle(drag); if(a===null) return;
    let da = a-drag.last; while(da>Math.PI) da -= Math.PI*2; while(da<-Math.PI) da += Math.PI*2;
    drag.acc += da; drag.last = a;
    const st = modFine() ? 1 : (WH.rstep>0 ? WH.rstep : 1), deg = Math.round(drag.acc*180/Math.PI/st)*st, Rw = axisRot(drag.ax,deg);
    for(const s of drag.start){
      setRot(s.o, eulerOf(mulM(Rw, rotMat(s.rx,s.rot,s.rz))));
      if(drag.start.length>1){
        const v = mvec(Rw,[s.pos[0]-drag.c.x, s.pos[1]-drag.c.y, s.pos[2]-drag.c.z]);
        s.o.pos = [r4(drag.c.x+v[0]), r4(drag.c.y+v[1]), r4(drag.c.z+v[2])];
      }
      syncNode(s.o);
    }
    drag.moved = deg!==0; refreshOutlines(); updateSelInfo(); invalidate();
    return;
  }
  const step = snapStep();
  if(drag.h.length===1 || drag.h==='xz'){
    const delta = new T.Vector3();
    if(drag.h==='xz'){
      const q = new T.Vector3();
      if(!ray.ray.intersectPlane(drag.plane,q)) return;
      delta.copy(q).sub(drag.q0); delta.y = 0;
    } else {
      const s = lineParam(drag.P0,drag.d); if(s===null) return;
      delta.copy(drag.d).multiplyScalar(s-drag.s0);
    }
    if(step){
      for(let a=0;a<3;a++){
        const dv = delta.getComponent(a);
        if(Math.abs(dv)<1e-9) continue;
        delta.setComponent(a, Math.round((drag.b0[a]+dv)/step)*step - drag.b0[a]);
      }
    }
    for(const s of drag.start){
      s.o.pos = [r4(s.pos[0]+delta.x), r4(s.pos[1]+delta.y), r4(s.pos[2]+delta.z)];
      syncNode(s.o);
    }
    renderBar();
    if(delta.lengthSq()>1e-9) drag.moved = true;
  } else {
    const st = drag.start[0], o = st.o;
    const s = lineParam(drag.P0,drag.d); if(s===null) return;
    let ns = st.size[drag.a] + (s-drag.s0);
    if(step) ns = Math.round(ns/Math.min(step,1))*Math.min(step,1);
    ns = Math.max(ns,0.25);
    o.size = st.size.slice(); o.size[drag.a] = r4(ns);
    const dl = ns - st.size[drag.a];
    o.pos = [r4(st.pos[0]+drag.d.x*dl/2), r4(st.pos[1]+drag.d.y*dl/2), r4(st.pos[2]+drag.d.z*dl/2)];
    syncNode(o,true); refreshOutlines(); updateSelInfo();
    if(Math.abs(dl)>1e-9) drag.moved = true;
  }
  invalidate();
}
function endGizmo(){
  const moved = drag && drag.moved, wasMe = drag && drag.me;
  drag = null; gest = null;
  if(moved){ if(wasMe) meCommit(); else commit(); }
}
function cancelGizmo(){
  if(!drag) return;
  for(const s of drag.start){
    s.o.pos = s.pos.slice(); if(s.size) s.o.size = s.size.slice(); setRot(s.o,[s.rx||0,s.rot,s.rz||0]);
    syncNode(s.o, !!s.size);
  }
  refreshOutlines(); drag = null; gest = null;
}

/* ---------- cámara: gestos ---------- */
const pointers = new Map();
function panCam(dx,dy){
  const k = wpp(view.target), m = cam.matrixWorld;
  const r = new T.Vector3().setFromMatrixColumn(m,0), u = new T.Vector3().setFromMatrixColumn(m,1);
  view.target.addScaledVector(r,-dx*k).addScaledVector(u,dy*k);
}
function startPinch(){
  const [a,b] = [...pointers.values()];
  pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
  for(const p of pointers.values()) p.moved = true;
  gest = {type:'pinch'};
}
function pinchMove(){
  const [a,b] = [...pointers.values()];
  const d = Math.hypot(a.x-b.x,a.y-b.y), cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  if(pinch.d>0 && d>0) view.dist = clamp(view.dist*pinch.d/d, 2, 250);
  panCam(cx-pinch.cx, cy-pinch.cy);
  pinch.d = d; pinch.cx = cx; pinch.cy = cy;
  updateCamera();
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if(walk.on) return;
  const dy = e.deltaMode===1 ? e.deltaY*33 : e.deltaMode===2 ? e.deltaY*400 : e.deltaY;
  const d0 = view.dist, d1 = clamp(d0*Math.exp(dy*0.0012), 2, 250), r = d1/d0;
  if(CTRL.zoomTo!==false && r!==1){   // hacia el cursor: el punto que está bajo el mouse queda en su lugar
    setRay(e); const h = surfaceHit();
    if(h && h.point && h.point.distanceTo(view.target)<d0*6) view.target.copy(h.point).add(view.target.clone().sub(h.point).multiplyScalar(r));
  }
  view.dist = d1; updateCamera();
}, {passive:false});
canvas.addEventListener('mousedown', e => { if(e.button===1) e.preventDefault(); });   // el botón del medio desplaza: sin el autodesplazamiento del navegador
canvas.addEventListener('dblclick', e => canvasDbl(e));

canvas.addEventListener('pointerdown', e => {
  if(walk.on){ walkDown(e); return; }
  canvas.focus({preventScroll:true});
  if(tool==='terrain' && terrBegin(e)) return;
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  pointers.set(e.pointerId, {x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false,type:e.pointerType});
  invalidate();
  if(pointers.size===1){
    setRay(e); updateGizmo();
    const lmb = !(e.pointerType==='mouse' && e.button!==0), gh = lmb ? gizmoHit() : null;   // botón derecho o medio: solo cámara
    let grabbed = false;
    if(lmb && !gh && tool==='move' && surfOn() && sel.length){   // con Ctrl y Shift a la vez, el objeto elegido se arrastra directamente
      const ph = pickObject(); if(ph && selTreeIds().has(ph.id)) grabbed = startGizmo('surf');
    }
    if(!grabbed && !(gh && startGizmo(gh))){
      const q = (lmb && tool!=='terrain' && tool!=='paint') ? noteAt(e.clientX,e.clientY) : null;
      if(q){ gest = {type:'note', q, moved:false}; setNoteFocus(q.id); } else gest = {type:'cam'};
    }
  } else {
    if(gest && gest.type==='gizmo') cancelGizmo();
    startPinch();
  }
});
canvas.addEventListener('pointermove', e => {
  if(walk.on){ walkMove(e); return; }
  if(e.pointerType==='mouse' && !pointers.size){ const q = noteAt(e.clientX,e.clientY); if(q) setNoteFocus(q.id); }
  if(tool==='terrain' && terrMove(e)) return;
  const p = pointers.get(e.pointerId); if(!p) return;
  const dx = e.clientX-p.x, dy = e.clientY-p.y;
  p.x = e.clientX; p.y = e.clientY;
  if(!p.moved && Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>8) p.moved = true;
  if(pointers.size===1){
    if(gest && gest.type==='note'){ if(p.moved){ setRay(e); const pts = noteGL && noteGL.pts; if(pts) pts.visible = false; const h = surfaceHit(); if(pts) pts.visible = true; if(h){ gest.q.pos = [r4(h.point.x),r4(h.point.y),r4(h.point.z)]; gest.moved = true; moveNotePoint(gest.q); } } }
    else if(gest && gest.type==='gizmo'){ setRay(e); dragGizmo(); }
    else if(gest && gest.type==='cam' && p.moved){
      const pan = p.type==='mouse' && ((e.buttons&2)||(e.buttons&4)||e.shiftKey||KB.space);
      if(pan) panCam(dx,dy);
      else { view.yaw -= dx*0.0065; view.pitch = clamp(view.pitch+dy*0.0065, 0.02, 1.553); }
      updateCamera();
    }
  } else if(pointers.size===2 && pinch){
    pinchMove();
  }
});
function pointerEnd(e){
  if(walk.on){ walkUp(e); return; }
  if(terrDrag && e.pointerId===terrDrag.pid){ terrEnd(); return; }
  const p = pointers.get(e.pointerId); if(!p) return;
  if(gest && gest.type==='note'){
    const g0 = gest; pointers.delete(e.pointerId); gest = pointers.size ? {type:'cam'} : null;
    if(g0.moved) commit(); else if(e.type==='pointerup') openNoteEditor(g0.q.id);
    return;
  }
  const wasGizmo = gest && gest.type==='gizmo';
  const isTap = gest && gest.type==='cam' && pointers.size===1 && !p.moved && (performance.now()-p.t)<600 && e.type==='pointerup';
  pointers.delete(e.pointerId);
  if(wasGizmo && pointers.size===0){ endGizmo(); return; }
  if(isTap){ setRay(e); if(p.type==='mouse' && e.button===2) ctxMenuAt(e); else if(!(p.type==='mouse' && e.button===1)) handleTap(); }
  if(pointers.size===0){ gest = null; pinch = null; }
  else if(pointers.size===1){ gest = {type:'cam'}; pinch = null; }
}
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);

/* ---------- toque en el mapa ---------- */
function handleTap(){
  if(ME.on){ meTap(); return; }
  if(tool==='terrain') return;
  if(tool==='paint'){ paintAt(); return; }
  if(tool==='place'){ placeArmed(); return; }
  if(tool==='light'){ placeLight(WH.ltype||'point'); return; }
  if(tool==='pin'){
    const h = surfaceHit(); if(!h) return;
    const n = {id:newId('n'), kind:'nota', text:'', pos:[r4(h.point.x),r4(h.point.y),r4(h.point.z)]};
    S.notes.push(n); renderPins(); commit(); setTool('move'); openNoteEditor(n.id);
    return;
  }
  const h = pickObject();
  if(h){
    if(multiOn()){ setSel(sel.includes(h.id) ? sel.filter(i => i!==h.id) : [...sel,h.id]); }
    else setSel([h.id]);
  } else if(!multiOn()) setSel([]);
}


/* ---------- jerarquía: cada objeto puede tener un padre (o.parent); las posiciones siguen guardadas en el mundo ---------- */
function childMap(){ const m = new Map(); for(const o of S.objects) if(o.parent){ if(!m.has(o.parent)) m.set(o.parent,[]); m.get(o.parent).push(o); } return m; }
function descendants(id,cm){ cm = cm || childMap(); const out = [], st = [id]; while(st.length){ const k = st.pop(); for(const c of (cm.get(k)||[])){ out.push(c); st.push(c.id); } } return out; }
// lo elegido más todo lo que cuelga de ello: es lo que se mueve, gira, duplica, borra u oculta junto
function selTree(){ const cm = childMap(), seen = new Set(), out = []; for(const o of selObjs()) for(const x of [o].concat(descendants(o.id,cm))) if(!seen.has(x.id)){ seen.add(x.id); out.push(x); } return out; }
function selTreeIds(){ return new Set(selTree().map(o => o.id)); }
function isAncestor(a,b){ let o = byId(b), k = 0; while(o && o.parent && k++<500){ if(o.parent===a) return true; o = byId(o.parent); } return false; }
const geoOf = list => list.filter(o => o.kind==='prim' || o.kind==='inst' || o.kind==='light');
function newGroup(name,objs,parent){
  const b = unionBounds(geoOf(objs).length ? geoOf(objs) : objs);
  const g = {id:newId('o'), kind:'group', name, pos:[r4((b[0]+b[3])/2), r4(b[1]), r4((b[2]+b[5])/2)], rot:0};
  if(parent) g.parent = parent;
  if(edit) g.edit = true;
  return g;
}
// proyectos anteriores: cada edificio generado pasa a ser un grupo; los padres que ya no existen se quitan
function migrateGroups(){
  const ids = new Set(S.objects.map(o => o.id));
  for(const o of S.objects) if(o.parent && !ids.has(o.parent)) delete o.parent;
  const byGid = new Map();
  for(const o of S.objects) if(o.gid && o.kind!=='group' && !o.parent){ if(!byGid.has(o.gid)) byGid.set(o.gid,[]); byGid.get(o.gid).push(o); }
  let n = S.objects.filter(isGroup).length;
  for(const [gid,list] of byGid){
    let g = S.objects.find(o => isGroup(o) && o.gid===gid);
    if(!g){ g = newGroup('Edificio '+(++n), list); g.gid = gid; S.objects.push(g); }
    for(const o of list) o.parent = g.id;
  }
}
function groupSel(){
  const roots = selObjs(); if(!roots.length){ toast('Elegí qué agrupar'); return; }
  const par = roots.every(o => o.parent===roots[0].parent) ? roots[0].parent : undefined;
  const g = newGroup('Grupo '+(S.objects.filter(isGroup).length+1), selTree(), par);
  S.objects.push(g); syncNode(g,true);
  for(const o of roots) o.parent = g.id;
  hierOpen(g.id); setSel([g.id]); commit(); toast('Se agruparon '+roots.length+' objetos');
}
function ungroupSel(){
  const roots = selObjs().filter(o => S.objects.some(c => c.parent===o.id)); if(!roots.length){ toast('Elegí un grupo u objeto con hijos'); return; }
  const freed = [];
  for(const o of roots){
    for(const c of S.objects) if(c.parent===o.id){ if(o.parent) c.parent = o.parent; else delete c.parent; freed.push(c.id); }
    if(isGroup(o)) removeObj(o.id);
  }
  setSel(freed); commit();
}
function unparentSel(){
  const os = selObjs().filter(o => o.parent); if(!os.length){ toast('Lo elegido no está dentro de un grupo'); return; }
  for(const o of os){ const p = byId(o.parent); if(p && p.parent) o.parent = p.parent; else delete o.parent; }
  setSel(os.map(o => o.id)); commit();
}
function selectParent(){
  const o = selObjs()[0]; if(!o || !o.parent){ toast('No tiene padre'); return; }
  setSel([o.parent]);
}
function reparent(ids,target){
  const moved = [];
  for(const id of ids){
    const o = byId(id); if(!o || id===target) continue;
    if(target && isAncestor(id,target)) continue;          // no se puede meter algo dentro de su propio hijo
    if(target) o.parent = target; else delete o.parent;
    moved.push(id);
  }
  if(moved.length){ if(target) hierOpen(target); commit(); renderHier(); }
  return moved.length;
}
// mueve y gira un objeto llevando consigo a sus hijos (para las medidas exactas)
function moveTree(o,np){
  const d = [np[0]-o.pos[0], np[1]-o.pos[1], np[2]-o.pos[2]];
  for(const x of [o].concat(descendants(o.id))){ x.pos = [r4(x.pos[0]+d[0]), r4(x.pos[1]+d[1]), r4(x.pos[2]+d[2])]; syncNode(x); }
}
function rotateTree(o,e){
  const M0 = rotMatOf(o), M1 = rotMat(e[0],e[1],e[2]), Rw = mulM(M1, transM(M0));
  for(const x of descendants(o.id)){
    const v = mvec(Rw,[x.pos[0]-o.pos[0], x.pos[1]-o.pos[1], x.pos[2]-o.pos[2]]);
    x.pos = [r4(o.pos[0]+v[0]), r4(o.pos[1]+v[1]), r4(o.pos[2]+v[2])]; setRot(x, eulerOf(mulM(Rw, rotMatOf(x)))); syncNode(x);
  }
  setRot(o,e); syncNode(o);
}

/* ---------- panel de jerarquía (lo pidió Brian: ver el nivel, elegir y emparentar) ---------- */
const HKEY = 'maqueta.hier.v1';
const HIER = Object.assign({show:false}, loadJson(HKEY)); HIER.exp = new Set();
const saveHier = () => { try{ localStorage.setItem(HKEY, JSON.stringify({show:HIER.show})); }catch(_){} };
function hierOpen(id){ let o = byId(id), k = 0; while(o && k++<500){ HIER.exp.add(o.id); o = o.parent ? byId(o.parent) : null; } }
const objIcon = o => o.kind==='group' ? 'folder' : o.kind==='light' ? (LTYPES.find(t => t[0]===o.ltype)||LTYPES[0])[2] : o.kind==='inst' ? 'prefab' : ((PRIMS[o.prim]||{}).ic || 'box');
function toggleHier(on){
  HIER.show = on===undefined ? !HIER.show : !!on; saveHier();
  const el = $('hier'); if(el) el.classList.toggle('show',HIER.show);
  appEl.classList.toggle('hieron',HIER.show);   // los avisos de arriba se corren para no tapar el panel
  if(HIER.show){ for(const id of sel){ const o = byId(id); if(o && o.parent) hierOpen(o.parent); } renderHier(); }
  renderWheel();
}
function renderHier(){
  const el = $('hier'); if(!el || !HIER.show) return;
  const list = $('hierList'); if(!list) return;
  const cm = childMap(), ss = new Set(sel), ids = new Set(S.objects.map(o => o.id));
  let h = '', n = 0;
  const row = (o,dep) => {
    n++;
    const kids = cm.get(o.id) || [], open = HIER.exp.has(o.id);
    h += '<div class="hr'+(ss.has(o.id)?' sel':'')+(o.hidden?' hid':'')+'" data-id="'+o.id+'" style="padding-left:'+(4+dep*14)+'px">'
      +(kids.length ? '<button class="hx" data-h="exp" aria-label="'+(open?'Contraer':'Expandir')+'">'+(open?'▾':'▸')+'</button>' : '<i class="hx"></i>')
      +svg(objIcon(o))+'<span class="hn">'+esc(o.name||'Objeto')+(kids.length ? ' <small>'+kids.length+'</small>' : '')+'</span>'
      +'<button class="he" data-h="eye" aria-label="'+(o.hidden?'Mostrar':'Ocultar')+'">'+svg(o.hidden?'eyeoff':'eye')+'</button></div>';
    if(open) for(const c of kids) row(c,dep+1);
  };
  for(const o of S.objects) if(!o.parent || !ids.has(o.parent)) row(o,0);
  list.innerHTML = h || '<p class="hint" style="padding:12px">La escena está vacía.</p>';
  if($('hierCount')) $('hierCount').textContent = S.objects.length;
  const one = selObjs();
  for(const b of el.querySelectorAll('.hh [data-h]')){
    const a = b.dataset.h;
    b.disabled = (a==='group' && !one.length) || (a==='ungroup' && !one.some(o => cm.has(o.id))) || (a==='up' && !one.some(o => o.parent)) || (a==='ren' && one.length!==1);
  }
  const s0 = list.querySelector('.hr.sel'); if(s0 && HIER.scrollTo){ HIER.scrollTo = false; s0.scrollIntoView({block:'nearest'}); }
}
function hierInit(){
  const el = document.createElement('div'); el.id = 'hier'; el.className = HIER.show ? 'show' : ''; el.setAttribute('aria-label','Jerarquía del nivel');
  el.innerHTML = '<div class="hh"><b>Jerarquía</b><span id="hierCount"></span>'
    +'<button class="ib" data-h="group" aria-label="Agrupar lo elegido" title="Agrupar">'+svg('group')+'</button>'
    +'<button class="ib" data-h="ungroup" aria-label="Desagrupar" title="Desagrupar">'+svg('ungroup')+'</button>'
    +'<button class="ib" data-h="up" aria-label="Sacar del grupo" title="Sacar del grupo">'+svg('parentup')+'</button>'
    +'<button class="ib" data-h="ren" aria-label="Renombrar" title="Renombrar">'+svg('edit')+'</button>'
    +'<button class="ib" data-h="close" aria-label="Cerrar la jerarquía">'+svg('close')+'</button></div>'
    +'<div class="hl" id="hierList"></div><div class="hdrop" id="hierRoot">Soltá acá para sacarlo de todo grupo</div>'
    +'<p class="hhint">Tocá para elegir. Mantené apretada una fila y arrastrala sobre otra para emparentarla.</p>';
  stage.appendChild(el); appEl.classList.toggle('hieron',HIER.show);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-h]'); if(!b) return;
    const a = b.dataset.h, r = b.closest('.hr'), id = r && r.dataset.id;
    if(a==='close'){ toggleHier(false); return; }
    if(a==='group'){ groupSel(); return; }
    if(a==='ungroup'){ ungroupSel(); return; }
    if(a==='up'){ unparentSel(); return; }
    if(a==='ren'){ const o = selObjs()[0]; if(o) askText('Nombre', o.name||'', v => { if(v){ o.name = v; commit(); renderHier(); } }); return; }
    if(a==='exp' && id){ if(HIER.exp.has(id)) HIER.exp.delete(id); else HIER.exp.add(id); renderHier(); return; }
    if(a==='eye' && id){ const o = byId(id); if(!o) return; const v = !o.hidden; for(const x of [o].concat(descendants(id))){ if(v) x.hidden = true; else delete x.hidden; syncNode(x); } commit(); renderHier(); return; }
  });
  // tocar elige; mantener apretado y arrastrar emparenta
  let P = null, tapPrev = null;
  const list = el.querySelector && el.querySelector('#hierList'); if(!list) return;
  list.addEventListener('pointerdown', e => {
    const r = e.target.closest('.hr'); if(!r || e.target.closest('[data-h]')) return;
    P = {id:r.dataset.id, x:e.clientX, y:e.clientY, pid:e.pointerId, drag:false, row:r, mouse:e.pointerType==='mouse'};
    const q = P;
    q.begin = () => {
      if(P!==q) return; q.drag = true; r.classList.add('drag'); el.classList.add('dragging');
      try{ list.setPointerCapture(q.pid); }catch(_){}
      if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){}
    };
    q.timer = setTimeout(q.begin, 420);
  });
  list.addEventListener('pointermove', e => {
    if(!P || e.pointerId!==P.pid) return;
    if(!P.drag){ if(Math.hypot(e.clientX-P.x,e.clientY-P.y)>8){ clearTimeout(P.timer); if(P.mouse) P.begin(); else P = null; } if(!P || !P.drag) return; }   // con mouse, arrastrar mueve al instante; con el dedo, moverse antes es scroll
    e.preventDefault();
    for(const x of el.querySelectorAll('.over')) x.classList.remove('over');
    const t = document.elementFromPoint(e.clientX,e.clientY), tr = t && t.closest && t.closest('.hr'), root = t && t.closest && t.closest('#hierRoot');
    if(tr && tr.dataset.id!==P.id) tr.classList.add('over'); else if(root) root.classList.add('over');
  });
  const up = e => {
    if(!P || e.pointerId!==P.pid) return;
    clearTimeout(P.timer); const q = P; P = null;
    // el destino se lee antes de salir del modo arrastre (al salir, la zona de arriba se oculta y la lista ocupa su lugar)
    const t = q.drag ? document.elementFromPoint(e.clientX,e.clientY) : null, tr = t && t.closest && t.closest('.hr'), root = t && t.closest && t.closest('#hierRoot');
    el.classList.remove('dragging');
    for(const x of el.querySelectorAll('.over,.drag')) x.classList.remove('over','drag');
    if(!q.drag){
      if(e.type!=='pointerup') return;
      // doble toque o doble clic en la misma fila: renombrar (se detecta por el id, porque tocar vuelve a dibujar las filas)
      const now = performance.now(), dbl = !!(tapPrev && tapPrev.id===q.id && now-tapPrev.t<380 && !multiOn());
      tapPrev = dbl ? null : {id:q.id, t:now};
      if(dbl){ const o = byId(q.id); if(o) askText('Nombre', o.name||'', v => { if(v){ o.name = v; commit(); renderHier(); } }); return; }
      if(multiOn()) setSel(sel.includes(q.id) ? sel.filter(i => i!==q.id) : [...sel,q.id]); else setSel([q.id]);
      return;
    }
    const ids = sel.includes(q.id) ? sel.slice() : [q.id];
    if(tr && tr.dataset.id!==q.id){ const nmv = reparent(ids,tr.dataset.id); toast(nmv ? 'Dentro de «'+(byId(tr.dataset.id)||{}).name+'»' : 'No se puede meter algo dentro de sí mismo'); }
    else if(root){ if(reparent(ids,null)) toast('Fuera de los grupos'); }
  };
  list.addEventListener('pointerup', up); list.addEventListener('pointercancel', up);
  // una vez que empezó el arrastre, el dedo ya no desplaza la lista
  list.addEventListener('touchmove', e => { if(P && P.drag && e.cancelable) e.preventDefault(); }, {passive:false});
  renderHier();
}

/* ---------- luces ---------- */
function newLight(type,pos){
  const n = S.objects.filter(isLight).length+1, nm = {point:'Luz', dir:'Sol', spot:'Foco'}[type] || 'Luz';
  const o = {id:newId('o'), kind:'light', name:nm+' '+n, ltype:type, pos, rot:0, lc:type==='dir' ? '#fff1d6' : '#ffd9a0', li:100, lr:type==='spot' ? 12 : 8, la:45, lf:false};
  if(type==='dir'){ o.rx = 50; o.rot = 30; }
  if(type==='spot') o.rx = 90;
  if(edit) o.edit = true;
  return o;
}
function placeLight(type){
  const h = surfaceHit(), p = h ? h.point : view.target, n = h ? h.normal : {x:0,y:1,z:0};
  const pos = [p.x+n.x*0.4, p.y+n.y*0.4, p.z+n.z*0.4];
  if(type==='dir') pos[1] += 4; else if(n.y>0.6) pos[1] += 1.8;
  const o = newLight(type,pos.map(r4)); S.objects.push(o); syncNode(o,true);
  setSel([o.id]); setTool('move'); commit();
  const f = type==='point';   // «Luz» es femenino; «Sol» y «Foco», masculinos
  toast(o.name+(f ? ' colocada: movela con las flechas' : ' colocado: movelo con las flechas y orientalo con Rotar'));
}
// forma de la luz para el sombreado: tipo 0 puntual, 1 direccional, 2 foco; d = hacia dónde apunta
function lightOfObj(o,gain,t){
  const c = hexRgb(o.lc||'#ffd9a0'); let k = (o.li==null ? 100 : o.li)/100*(gain==null ? 1 : gain);
  if(o.lf && t!=null) k *= 0.8+0.2*Math.sin(t*11+o.pos[0]*3.1)*Math.sin(t*5.3+o.pos[2]*1.7);
  const M = rotMatOf(o), ty = o.ltype==='dir' ? 1 : o.ltype==='spot' ? 2 : 0;
  return {x:o.pos[0], y:o.pos[1], z:o.pos[2], r:ty===1 ? 1e5 : (o.lr||8), c:[c[0]/255*k, c[1]/255*k, c[2]/255*k], ty, d:[M[2],M[5],M[8]], cosO:Math.cos(clamp(o.la||45,5,170)/2*D2R), flick:!!o.lf};
}
const sceneLights = () => S.objects.filter(o => o.kind==='light' && !o.hidden);
// convierte proyectos anteriores: las notas «luz» pasan a ser luces (puntuales)
function migrateLights(){
  const ls = S.notes.filter(n => n.kind==='luz'); if(!ls.length) return;
  for(const n of ls){
    const o = newLight('point', n.pos.slice()); o.name = n.text && n.text!=='Luz' ? n.text : o.name;
    o.lc = n.lc || o.lc; o.lr = n.lr || 6; o.li = n.li==null ? 100 : n.li; o.lf = !!n.lf; if(n.gid) o.gid = n.gid;
    S.objects.push(o);

function placeArmed(){
  if(!armed){ toast('Elegí qué colocar en el panel'); openPanel('add'); return; }
  const h = surfaceHit(); if(!h) return;
  const n = h.normal, p = h.point;
  const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
  if(armed.kind==='prim'){
    const size = PRIMS[armed.key].size(S.meta);
    const ex = size[0]/2, ez = size[2]/2;
    let x = snapEdge(p.x,ex), y, z = snapEdge(p.z,ez);
    if(h.terrain || (ay>=ax && ay>=az)){
      y = (h.id ? snapV(p.y) : 0) + (n.y>=0 ? size[1]/2 : -size[1]/2);
      if(!h.id) y = h.terrain ? p.y+size[1]/2 : size[1]/2;
    } else if(ax>=az){
      x = snapV(p.x) + (n.x>0?1:-1)*ex; y = snapV(Math.max(p.y,0)) + size[1]/2;
    } else {
      z = snapV(p.z) + (n.z>0?1:-1)*ez; y = snapV(Math.max(p.y,0)) + size[1]/2;
    }
    const o = addPrim(armed.key, size, [r4(x),r4(y),r4(z)], 0, curColor);
    placed(o);
  } else {
    if(!S.prefabs[armed.pid]){ armed=null; return; }
    const y = h.terrain ? p.y : ((h.id && ay>=ax && ay>=az) ? p.y : 0);
    const o = {id:newId('o'), kind:'inst', name:S.prefabs[armed.pid].name, prefab:armed.pid, pos:[r4(snapV(p.x)),r4(y),r4(snapV(p.z))], rot:0};
    S.objects.push(o); syncNode(o,true);

/* ---------- notas (pines) ---------- */
const pinEls = new Map();
// todas las notas se dibujan en un solo lote (puntos con un atlas de íconos): una llamada de dibujo, sin elementos HTML
let noteGL = null, noteFocus = null, noteLabel = null;
function noteAtlas(){
  const c = document.createElement('canvas'), N = KINDS.length; c.width = 64*N; c.height = 64;
  const x = c.getContext && c.getContext('2d'); if(!x || !x.beginPath) return null;
  KINDS.forEach((k,i) => {
    const cx = i*64+32;
    x.beginPath(); x.arc(cx,32,27,0,Math.PI*2); x.fillStyle = 'rgba(0,0,0,.55)'; x.fill();
    x.beginPath(); x.arc(cx,32,24,0,Math.PI*2); x.fillStyle = k.color; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#14110e'; x.stroke();
    x.fillStyle = '#14110e'; x.font = 'bold 26px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(k.ch,cx,33);
  });
  const t = new T.CanvasTexture(c); t.minFilter = T.LinearFilter; t.magFilter = T.LinearFilter; t.generateMipmaps = false;
  return t;
}
function renderPins(){
  if(noteGL){ scene.remove(noteGL.pts); noteGL.pts.geometry.dispose(); }
  if(!noteGL) noteGL = {tex:noteAtlas(), pts:null};
  const n = S.notes.length, pos = new Float32Array(n*3), kind = new Float32Array(n), foc = new Float32Array(n);
  S.notes.forEach((q,i) => { pos[i*3] = q.pos[0]; pos[i*3+1] = q.pos[1]; pos[i*3+2] = q.pos[2]; kind[i] = Math.max(0,KINDS.findIndex(k => k.id===q.kind)); foc[i] = q.id===noteFocus ? 1 : 0; });
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(pos,3)); geo.setAttribute('aK', new T.BufferAttribute(kind,1)); geo.setAttribute('aF', new T.BufferAttribute(foc,1));
  if(!noteGL.mat) noteGL.mat = new T.ShaderMaterial({
    uniforms:{uTex:{value:noteGL.tex}, uN:{value:KINDS.length}, uSize:{value:30*(renderer.getPixelRatio ? renderer.getPixelRatio() : 1)}},
    vertexShader:'attribute float aK; attribute float aF; uniform float uSize; varying float vK; void main(){ vK = aK; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_PointSize = uSize*(aF>0.5 ? 1.3 : 1.0); }',
    fragmentShader:'uniform sampler2D uTex; uniform float uN; varying float vK; void main(){ vec4 c = texture2D(uTex, vec2((gl_PointCoord.x+vK)/uN, 1.0-gl_PointCoord.y)); if(c.a<0.05) discard; gl_FragColor = c; }',
    transparent:true, depthTest:false, depthWrite:false});
  const pts = new T.Points(geo, noteGL.mat); pts.renderOrder = 997; pts.frustumCulled = false; pts.userData.notes = true;
  noteGL.pts = pts; noteGL.count = n; noteGL.kinds = kind; scene.add(pts);
  if(!noteLabel){ noteLabel = document.createElement('div'); noteLabel.className = 'pinlbl'; pinsEl.appendChild(noteLabel); }
  invalidate();
}
const notesShown = () => pinsEl.style.display!=='none' && !PSX.on && !walk.on;
// la nota más cercana al dedo (en pantalla), si está a menos de un dedo de distancia
function noteAt(cx,cy){
  if(!notesShown() || !S.notes.length) return null;
  const r = canvas.getBoundingClientRect(); let best = null, bd = 22;
  for(const q of S.notes){
    pv.set(q.pos[0],q.pos[1],q.pos[2]).project(cam); if(!(pv.z>-1 && pv.z<1)) continue;
    const d = Math.hypot(r.left+(pv.x*0.5+0.5)*r.width-cx, r.top+(-pv.y*0.5+0.5)*r.height-cy);
    if(d<bd){ bd = d; best = q; }
  }
  return best;
}
function moveNotePoint(q){
  if(!noteGL || !noteGL.pts) return;
  const i = S.notes.indexOf(q); if(i<0) return;
  const a = noteGL.pts.geometry.attributes.position; a.array[i*3] = q.pos[0]; a.array[i*3+1] = q.pos[1]; a.array[i*3+2] = q.pos[2]; a.needsUpdate = true; invalidate();
}
function setNoteFocus(id){ if(noteFocus===id) return; noteFocus = id; renderPins(); }
function bindPin(el,n){

/* ---------- historia y guardado ---------- */
/* ---------- archivos del proyecto (IndexedDB) ----------
   Un proyecto = archivos chicos: shared/ (meta, texturas, mallas, prefabs, grafos, pinturas, comunes a todos los niveles) y
   levels/<id>/ (escena y terreno de cada nivel). project.json es el manifiesto (hash de cada archivo) y registry.json la lista de proyectos.
   Cada guardado escribe lo que cambió y el manifiesto, todo en UNA transacción: queda el estado nuevo completo o el anterior.
   El primer proyecto vive en la raíz (base ''); los demás en p/<id>/. */
function hash53(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0, ch; i<str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(36)+'.'+str.length.toString(36);   // el largo también cuenta: detecta archivos cortados
}
const fsSize = h => parseInt(String(h).split('.')[1] || '0',36) || 0;
const FS = (() => {
  let db = null;
  const reqP = r => new Promise((res,rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const doneP = t => new Promise((res,rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('transacción abortada')); });
  const open = () => db ? Promise.resolve(db) : new Promise((res,rej) => {
    if(!window.indexedDB){ rej(new Error('sin IndexedDB')); return; }
    const r = indexedDB.open('maqueta.fs',1);
    r.onupgradeneeded = () => { r.result.createObjectStore('files',{keyPath:'path'}); };
    r.onsuccess = () => { db = r.result; db.onversionchange = () => { db.close(); db = null; }; res(db); };
    r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('bloqueado'));
  });
  return {
    open,
    async get(p){ const d = await open(); return reqP(d.transaction('files').objectStore('files').get(p)); },
    async getMany(ps){ const d = await open(), st = d.transaction('files').objectStore('files'); return Promise.all(ps.map(p => reqP(st.get(p)))); },
    async list(prefix){ const d = await open(), st = d.transaction('files').objectStore('files'); return reqP(st.getAllKeys(prefix ? IDBKeyRange.bound(prefix,prefix+'\uffff') : undefined)); },
    async commit(puts,dels){ const d = await open(), t = d.transaction('files','readwrite'), st = t.objectStore('files'); for(const f of puts) st.put(f); for(const p of dels) st.delete(p); return doneP(t); }
  };
})();
let REG = {cur:'p1', projects:[{id:'p1', name:'Proyecto', base:'', updated:0}]};   // registro de proyectos
const PROJ = {ready:false, ok:false, err:'', id:'p1', base:'', name:'Proyecto', levels:[{id:'n1',name:'Nivel 1'}], cur:'n1', hashes:{}, bad:[], t:null, q:Promise.resolve(), last:0};
const fsSafe = id => String(id).replace(/[^\w.-]/g,'_');
const fsPart = p => (p.startsWith('shared/nodes/') || p.startsWith('shared/paint/')) ? 'tex' : p.startsWith('shared/') ? 'shared' : p.startsWith('levels/'+PROJ.cur+'/') ? 'level' : null;
const idNext = (ids,pre) => { const re = new RegExp('^'+pre+'(\\d+)$'); return pre+(ids.reduce((m,id) => { const q = re.exec(id); return q ? Math.max(m,+q[1]) : m; },0)+1); };
const lvName = id => (PROJ.levels.find(l => l.id===id) || {name:id}).name;
const projManifest = (now,files) => JSON.stringify({app:'maqueta', v:2, id:PROJ.id, name:PROJ.name, levels:PROJ.levels, cur:PROJ.cur, updated:now, files});
function regRec(now){
  REG.cur = PROJ.id;
  const data = JSON.stringify({v:1, cur:REG.cur, projects:REG.projects});
  return {path:'registry.json', data, hash:hash53(data), t:now};
}
function regPut(now){
  const e = REG.projects.find(p => p.id===PROJ.id);
  if(e){ e.name = PROJ.name; e.updated = now; }
  return regRec(now);
}
function projFiles(parts){
  const out = new Map(), put = (p,o) => out.set(p,JSON.stringify(o));
  if(parts.shared){
    const {cull, terrains, ...rest} = S.meta;
    put('shared/meta.json',{meta:rest, seq:S.seq});
    put('shared/textures.json',S.texList);
    for(const id of Object.keys(S.meshes||{})) put('shared/meshes/'+fsSafe(id)+'.json',{id, mesh:S.meshes[id]});
    for(const id of Object.keys(S.prefabs||{})) put('shared/prefabs/'+fsSafe(id)+'.json',{id, prefab:S.prefabs[id]});
  }
  if(parts.level){
    const lv = 'levels/'+PROJ.cur+'/', {cull, terrains} = S.meta;
    put(lv+'scene.json',{objects:S.objects, notes:S.notes, cull:cull || null});
    put(lv+'terrain.json',terrains || []);
  }
  if(parts.tex){
    for(const m of S.texList){
      const d = TEXDATA[m.id]; if(!d) continue;
      const sid = fsSafe(m.id);
      if(typeof d==='string'){ put('shared/nodes/'+sid+'.json',{id:m.id, legacy:d}); continue; }
      put('shared/nodes/'+sid+'.json',{id:m.id, doc:d.doc});
      for(const k of ['pix','mpix']) for(const nid of Object.keys(d[k] || {})) put('shared/paint/'+sid+'/'+k+'_'+fsSafe(nid)+'.json',{tex:m.id, node:nid, k, url:d[k][nid]});
    }
  }
  return out;
}
// Todas las escrituras pasan por una sola cola: nunca dos transacciones pisándose el manifiesto.
function projQ(fn){ const r = PROJ.q.then(fn); PROJ.q = r.catch(() => {}); return r; }
function projSchedule(){ if(!PROJ.ok) return; clearTimeout(PROJ.t); PROJ.t = setTimeout(projFlush,500); }
function projFlush(){ clearTimeout(PROJ.t); return projQ(projWrite); }
async function projWrite(){
  if(!PROJ.ok || !PROJ.ready || !S) return;
  try{
    packDirtyTex();
    const parts = {shared:!edit, level:!edit, tex:true}, base = PROJ.base;   // editando un prefab, la escena no se toca (igual que antes)
    const nf = projFiles(parts), puts = [], dels = [], hashes = Object.assign({},PROJ.hashes), now = Date.now();
    for(const [p,txt] of nf){ const h = hash53(txt); if(hashes[p]!==h){ puts.push({path:base+p, data:txt, hash:h, t:now}); hashes[p] = h; } }
    const keep = new Set(S.texList.filter(m => !TEXDATA[m.id]).map(m => fsSafe(m.id)));   // texturas todavía sin empaquetar: no se borran sus archivos
    for(const p of Object.keys(PROJ.hashes)){
      const part = fsPart(p);
      if(!part || !parts[part] || nf.has(p) || PROJ.bad.includes(p)) continue;
      if(part==='tex' && keep.has(p.split('/')[2].replace(/\.json$/,''))) continue;
      dels.push(base+p); delete hashes[p];
    }
    if(puts.length || dels.length){
      const man = projManifest(now,hashes);
      puts.push({path:base+'project.json', data:man, hash:hash53(man), t:now}, regPut(now));   // el manifiesto va al final: es el «commit»
      await FS.commit(puts,dels);
      PROJ.hashes = hashes; PROJ.last = now;
      drvMark(PROJ.id);
    }
  }catch(err){ console.warn('guardado',err); saveFailed(); }
}
// Cambios que no son del contenido: nombres, niveles, proyecto abierto. dels: rutas relativas a borrar; extra: [{rel,data,hash}] archivos a escribir.
function projCommitMeta(dels,extra){
  return projQ(async () => {
    const now = Date.now(), hashes = Object.assign({},PROJ.hashes), base = PROJ.base;
    for(const p of dels || []) delete hashes[p];
    for(const f of extra || []) hashes[f.rel] = f.hash;
    const man = projManifest(now,hashes), puts = [{path:base+'project.json', data:man, hash:hash53(man), t:now}, regPut(now)];
    for(const f of extra || []) puts.push({path:base+f.rel, data:f.data, hash:f.hash, t:now});
    await FS.commit(puts,(dels || []).map(p => base+p));
    PROJ.hashes = hashes; PROJ.last = now;
    drvMark(PROJ.id);
  });
}
async function projLoad(base,wantLv){
  const mr = await FS.get(base+'project.json');
  if(!mr) return null;
  if(hash53(mr.data)!==mr.hash) throw new Error('el manifiesto está dañado');
  const man = JSON.parse(mr.data), levels = (man.levels && man.levels.length) ? man.levels : [{id:'n1',name:'Nivel 1'}];
  const cur = (wantLv && levels.some(l => l.id===wantLv)) ? wantLv : levels.some(l => l.id===man.cur) ? man.cur : levels[0].id, lv = 'levels/'+cur+'/';
  const want = Object.keys(man.files || {}).filter(p => !p.startsWith('levels/') || p.startsWith(lv));   // solo la escena del nivel abierto
  const recs = await FS.getMany(want.map(p => base+p)), data = {}, bad = [];
  want.forEach((p,i) => { const r = recs[i]; try{ if(!r || hash53(r.data)!==man.files[p]) throw 0; data[p] = JSON.parse(r.data); }catch(_){ bad.push(p); } });
  const mt = data['shared/meta.json'] || {meta:{M:4,H:3,snap:0.5}, seq:1}, sc = data[lv+'scene.json'] || {objects:[], notes:[]};
  const S2 = {meta:Object.assign({},mt.meta), objects:sc.objects || [], prefabs:{}, notes:sc.notes || [], texList:data['shared/textures.json'] || [], meshes:{}, seq:mt.seq || 1};
  if(sc.cull) S2.meta.cull = sc.cull;
  const tr = data[lv+'terrain.json']; if(tr && tr.length) S2.meta.terrains = tr;
  const T = {};
  for(const p of want){
    const d = data[p]; if(!d) continue;
    if(p.startsWith('shared/meshes/')) S2.meshes[d.id] = d.mesh;
    else if(p.startsWith('shared/prefabs/')) S2.prefabs[d.id] = d.prefab;
    else if(p.startsWith('shared/nodes/')) T[d.id] = d.legacy ? d.legacy : {doc:d.doc, pix:{}, mpix:{}};
  }
  for(const p of want){ const d = data[p]; if(d && p.startsWith('shared/paint/') && T[d.tex] && typeof T[d.tex]==='object') T[d.tex][d.k][d.node] = d.url; }
  return {S:S2, TEXDATA:T, info:{name:man.name || 'Proyecto', levels, cur, hashes:Object.assign({},man.files), bad, last:man.updated || 0}};
}
const projAdopt = (e,info) => Object.assign(PROJ,{id:e.id, base:e.base, name:info.name, levels:info.levels, cur:info.cur, hashes:info.hashes, bad:info.bad, last:info.last});
async function regLoad(){
  try{ const r = await FS.get('registry.json'); if(r && hash53(r.data)===r.hash){ const o = JSON.parse(r.data); if(o && Array.isArray(o.projects) && o.projects.length) return o; } }catch(_){}
  // sin registro (primera vez, o dañado): se reconstruye con lo que haya en el almacén
  const found = [];
  if(await FS.get('project.json')) found.push({id:'p1', name:'Proyecto', base:'', updated:0});
  for(const k of await FS.list('p/')){ const m = /^p\/([^/]+)\/project\.json$/.exec(k); if(m) found.push({id:m[1], name:m[1], base:'p/'+m[1]+'/', updated:0}); }
  return found.length ? {v:1, cur:found[0].id, projects:found} : null;
}
async function bootState(){
  const fromFiles = async () => {
    await FS.open();
    const reg = await regLoad();
    PROJ.ok = true;
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}
    if(!reg) return false;
    REG = reg;
    const first = reg.projects.find(p => p.id===reg.cur), order = (first ? [first] : []).concat(reg.projects.filter(p => p!==first));
    for(const e of order){
      try{ const r = await projLoad(e.base); if(r){ S = r.S; TEXDATA = r.TEXDATA; projAdopt(e,r.info); return true; } }
      catch(err){ console.warn('proyecto ilegible',e.id,err); PROJ.err = String(err && err.message || err); }
    }
    throw new Error(PROJ.err || 'el proyecto está dañado');
  };
  try{
    const ok = await Promise.race([fromFiles(), new Promise((_,rej) => setTimeout(() => rej(new Error('tiempo agotado')),6000))]);
    if(ok) return 'files';
  }catch(err){ console.warn('archivos del proyecto no disponibles',err); PROJ.ok = false; PROJ.err = String(err && err.message || err); }
  let raw = null, ok = false;
  try{ raw = localStorage.getItem(KEY); }catch(_){}
  if(raw){
    try{
      const o = JSON.parse(raw);
      S = {meta:o.meta, objects:o.objects, prefabs:o.prefabs || {}, notes:o.notes || [], texList:o.texList || [], meshes:o.meshes || {}, seq:o.seq || 1};
      ok = Array.isArray(S.objects) && !!S.meta;
    }catch(_){ ok = false; }
  }
  if(!ok) starter();
  try{ TEXDATA = JSON.parse(localStorage.getItem(TEXKEY) || '{}') || {}; }catch(_){ TEXDATA = {}; }
  return ok ? 'legacy' : 'new';
}

const levelSnap = () => ({objects:S.objects, notes:S.notes, cull:S.meta.cull || null, terrains:S.meta.terrains || []});

// Lee un nivel desde los archivos (verificando el hash). Un nivel que nunca se guardó viene vacío.
async function levelRead(id){
  const lv = 'levels/'+id+'/', ps = [lv+'scene.json', lv+'terrain.json'];
  const rs = await FS.getMany(ps.map(p => PROJ.base+p)), out = {objects:[], notes:[], cull:null, terrains:[]};
  const get = i => { const r = rs[i], want = PROJ.hashes[ps[i]]; if(!want) return null; if(!r || hash53(r.data)!==want) throw new Error('el nivel está dañado ('+ps[i]+')'); return JSON.parse(r.data); };
  const sc = get(0), tr = get(1);

  if(tr) out.terrains = tr;

async function levelWrite(id,d){

async function levelsUsing(test){
  const out = [];

    if(l.id===PROJ.cur) continue;
    try{ const n = test(await levelRead(l.id)); if(n) out.push({id:l.id, name:l.name, n}); }catch(_){}

async function lvSwitch(id){

async function lvNew(name){

const emptyLevelFiles = id => [['levels/'+id+'/scene.json',{objects:[], notes:[], cull:null}], ['levels/'+id+'/terrain.json',[]]].map(([rel,o]) => { const data = JSON.stringify(o); return {rel, data, hash:hash53(data)}; });

// Edita el manifiesto de OTRO proyecto (y sus archivos) en una sola transacción.
function mfEdit(e,fn){
  return projQ(async () => {
    const mr = await FS.get(e.base+'project.json');
    if(!mr || hash53(mr.data)!==mr.hash) throw new Error('manifiesto ilegible');
    const man = JSON.parse(mr.data), puts = [], dels = [], now = Date.now();
    man.files = man.files || {}; man.levels = (man.levels && man.levels.length) ? man.levels : [{id:'n1', name:'Nivel 1'}];
    await fn(man,puts,dels,now);
    man.updated = now; const data = JSON.stringify(man);
    puts.push({path:e.base+'project.json', data, hash:hash53(data), t:now});
    e.updated = now; puts.push(regRec(now));
    await FS.commit(puts,dels);
  });
}
function mfLvAdd(e,name){
  let nid; return mfEdit(e,(man,puts,dels,now) => {
    nid = idNext(man.levels.map(l => l.id),'n'); man.levels.push({id:nid, name});
    for(const f of emptyLevelFiles(nid)){ man.files[f.rel] = f.hash; puts.push({path:e.base+f.rel, data:f.data, hash:f.hash, t:now}); }
  }).then(() => nid);
}
const mfLvRename = (e,id,name) => mfEdit(e,man => { const l = man.levels.find(q => q.id===id); if(!l) throw new Error('no existe el nivel'); l.name = name; });
function mfLvDup(e,id){
  let nid; return mfEdit(e,async (man,puts,dels,now) => {
    const src = man.levels.find(l => l.id===id); if(!src) throw new Error('no existe el nivel');
    const pre = 'levels/'+id+'/', ps = Object.keys(man.files).filter(p => p.startsWith(pre)), rs = await FS.getMany(ps.map(p => e.base+p));
    nid = idNext(man.levels.map(l => l.id),'n');
    ps.forEach((p,i) => { const r = rs[i]; if(!r || hash53(r.data)!==man.files[p]) throw new Error('archivo dañado: '+p); const rel = 'levels/'+nid+'/'+p.slice(pre.length); man.files[rel] = r.hash; puts.push({path:e.base+rel, data:r.data, hash:r.hash, t:now}); });
    man.levels.push({id:nid, name:src.name+' (copia)'});
  }).then(() => nid);
}
const mfLvDel = (e,id) => mfEdit(e,(man,puts,dels) => {
  if(man.levels.length<2) throw new Error('tiene que quedar un nivel');
  man.levels = man.levels.filter(l => l.id!==id);
  for(const p of Object.keys(man.files)) if(p.startsWith('levels/'+id+'/')){ dels.push(e.base+p); delete man.files[p]; }

async function prjInfo(e){
  let files, levels, name, cur, upd;

  }

  return {id:e.id, name, cur, upd, size:Object.values(files).reduce((a,h) => a+fsSize(h),0), levels:levels.map(l => ({id:l.id, name:l.name, size:sum('levels/'+l.id+'/')}))};

// Doble toque en un nombre: se vuelve un campo de texto. Enter o salir del campo guarda; Escape cancela.
function prjRename(k,id){
  const tile = [...document.querySelectorAll(k==='pj' ? '#prjBody .ptl[data-k="pj"]' : '#prjSide .ptl[data-k="lv"]')].find(t => t.dataset.id===id);
  const tn = tile && tile.querySelector('.tn'); if(!tn || tn.querySelector('input')) return;
  const old = tn.textContent, inp = document.createElement('input');
  inp.className = 'tin'; inp.value = old; inp.maxLength = 60; inp.setAttribute('aria-label','Nombre');
  tn.textContent = ''; tn.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const fin = async ok => { if(done) return; done = true; const v = inp.value.trim(); if(ok && v && v!==old) await prjDoRename(k,id,v); prjRender(); };
  inp.addEventListener('keydown',ev => { if(ev.key==='Enter'){ ev.preventDefault(); fin(true); } else if(ev.key==='Escape'){ ev.preventDefault(); fin(false); } ev.stopPropagation(); });
  inp.addEventListener('blur',() => fin(true));
}

// Abrir, Duplicar y Borrar actúan sobre lo elegido: un nivel si hay uno elegido, si no el proyecto.
async function prjAct(x){
  const e = prjProj(), i = e && PRJ.infos[e.id]; if(!e || !i) return;
  const lv = prjSelLv(), open = e.id===PROJ.id;
  if(x==='open'){ if(await prjOpenAt(e.id,lv ? lv.id : null)) prjClose(); }

      if(nid) PRJ.lv = nid;

    await prjRender();
  }
  else if(x==='del'){
    if(lv) confirmBox('Borrar el nivel','«'+lv.name+'» se borra con todo lo que tiene colocado. Las texturas, mallas y prefabs compartidos no se tocan.','Borrar',async () => {
      try{ if(open) await lvDelete(lv.id); else await mfLvDel(e,lv.id); }catch(err){ console.warn(err); toast('No se pudo borrar el nivel'); }
      PRJ.lv = null; prjRender();
    });
    else confirmBox('Borrar el proyecto','«'+i.name+'» se borra con todos sus niveles, texturas, mallas y prefabs. No se puede deshacer.','Borrar',async () => {
      await pjDelete(e.id); if(PRJ.sel===e.id){ PRJ.sel = null; PRJ.lv = null; } prjRender();

}

/* ---- desplegables: un grupo de botones que se excluyen entre sí pasa a ser un select (los botones quedan ocultos y siguen manejando la acción) ---- */
function selectify(root){
  root.querySelectorAll('.chips').forEach(box => {
    if(box.dataset.sel || (box.closest && box.closest('#pbody'))) return; box.dataset.sel = '1';
    const groups = new Map();
    for(const b of Array.from(box.children)){
      if(b.tagName!=='BUTTON' || !b.classList.contains('chip')) continue;
      const ak = ['act','ta','tr','pact'].find(k => b.dataset[k]!==undefined); if(!ak) continue;
      const vk = ['v','n','c'].find(k => b.dataset[k]!==undefined); if(!vk) continue;
      const key = ak+'|'+b.dataset[ak]+'|'+vk; if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(b);
    }
    for(const g of groups.values()){
      if(g.length<2 || g.filter(b => b.classList.contains('on')).length>1) continue;
      const sl = document.createElement('select'); sl.className = 'csel'; sl.setAttribute('aria-label', box.getAttribute('aria-label') || 'Opciones');
      if(!g.some(b => b.classList.contains('on'))){ const o = document.createElement('option'); o.textContent = 'Elegí una opción'; o.value = ''; o.disabled = true; o.selected = true; sl.appendChild(o); }
      g.forEach((b,i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = (b.textContent || b.getAttribute('aria-label') || b.title || '').trim(); if(b.classList.contains('on')) o.selected = true; sl.appendChild(o); b.hidden = true; });
      const stop = e => e.stopPropagation();
      sl.addEventListener('input',stop);
      sl.addEventListener('change', e => { e.stopPropagation(); const b = g[+sl.value]; if(b) b.click(); });
      box.insertBefore(sl,g[0]);
    }
  });
}

/* ---- secciones: un panel largo muestra una sección por vez, elegida con un desplegable ---- */
function sectionize(h,tab){
  const parts = h.split(/(?=<h3[ >])/);
  const intro = parts.length && parts[0].indexOf('<h3')!==0 ? parts.shift() : '';
  if(parts.length<2) return h;
  const titles = parts.map(p => { const m = /<h3[^>]*>([^<]*)<\/h3>/.exec(p); return m ? m[1] : 'Sección'; });
  let k = PSEC[tab]|0; if(k>=parts.length) k = 0;

/* ---------- atlas único: todas las texturas viven en celdas fijas de 128 × 128 dentro de una imagen de 2048 × 2048 ---------- */

const ATL_W = 2048, ATL_CELL = 128, ATL_N = 16, ATL_WHITE = 255, ATL_MAX = 255;

  let next = 0;

    else { m.slot = -1; if(!slotWarned){ slotWarned = true; toast('El atlas está lleno: el máximo es '+ATL_MAX+' texturas'); } }

  vec2 q = p/s;
  vec2 g = abs(fract(q-0.5)-0.5)/max(fwidth(q), vec2(1e-4));
  return 1.0-min(min(g.x,g.y),1.0);
}
void main(){
  vec3 n = normalize(vWN);
  float l = dot(n, normalize(vec3(0.4,0.85,0.35)));
  float shade = mix(mix(0.55,0.42,vPlain),1.0,clamp(l*0.5+0.5,0.0,1.0));
  vec3 lt = vec3(shade);
  if(uPsx>0.5){ if(uBaked>0.5) lt = vCol; else if(uLit>0.5) lt = psxLight(vWP,n); }
  vec2 f = fract(vUvW/vW);
  vec3 tx = texture2D(uAtlas, vRect.xy + f*vRect.zw).rgb, tn = vTint;
  if(uChk>0.5){ vec2 q = floor(f*8.0); tx = mix(vec3(0.16,0.18,0.22), vec3(0.92,0.9,0.84), mod(q.x+q.y,2.0)); tn = vec3(1.0); }   // cuadros: muestran cómo se estiran las UV
  vec3 base = tx*tn*lt;
  vec3 c = base;
  if(uPsx<0.5 && vPlain>0.5 && uChk<0.5){   // en el editor, lo que solo lleva color muestra la grilla métrica
    vec3 w = pow(abs(n), vec3(8.0)); w /= (w.x+w.y+w.z+1e-5);
    float g1 = grid(vWP.zy,1.0)*w.x + grid(vWP.xz,1.0)*w.y + grid(vWP.xy,1.0)*w.z;
    float g4 = grid(vWP.zy,uMod)*w.x + grid(vWP.xz,uMod)*w.y + grid(vWP.xy,uMod)*w.z;
    c = mix(base, base*0.62, g1*0.55);
    c = mix(c, base*0.36, g4*0.85);
  }
  if(uPsx>0.5 && uFogOn>0.5){ float fg = clamp((vDepth-uFogN)/max(uFogF-uFogN,0.001),0.0,1.0); c = mix(c,uFogC,fg); }

function newLayer(e,kind,over){
  const isGen = kind!=='fill' && kind!=='paint';
  const def = isGen ? GENDEF[kind] : null;
  const L = {id:'l'+(e.doc.seq++), kind:isGen?'gen':kind, name:KLABEL[kind]||kind, vis:true, op:1,
    blend:(isGen && GEN_BLEND[kind]) || 'normal', adj:{bri:0,con:0,sat:0,hue:0},
    mask:{type:'none', inv:false, scale:2, th:50, soft:30, seed:1+Math.floor(Math.random()*999), from:0, to:100, gen:'noise', gap:50, warp:0},
    A:'#6b5d4a', M:'#6b5d4a', B:'#a8987a', mid:50, scale:2, gap:50, inten:60, warp:0, relief:0, ao:0, wear:0, grain:0, light:135,
    seed:1+Math.floor(Math.random()*9999)};
  if(isGen){
    L.gen = kind;
    Object.assign(L, def.d);
    L.A = def.c[0]; L.M = def.c[1]; L.B = def.c[2];
  }
  if(over) for(const k of Object.keys(over)){
    if((k==='mask'||k==='adj') && typeof over[k]==='object') Object.assign(L[k], over[k]); else L[k] = over[k];
  }
  return L;
}
// Completa los campos que faltan (documentos de versiones anteriores o materiales guardados)
function fixLayer(L){
  if(!L.mask) L.mask = {type:'none'};
  const m = L.mask;
  if(m.inv===undefined) m.inv = false;
  if(m.scale===undefined) m.scale = 2;
  if(m.th===undefined) m.th = 50;
  if(m.soft===undefined) m.soft = 30;
  if(m.seed===undefined) m.seed = 1;
  if(m.from===undefined) m.from = 0;
  if(m.to===undefined) m.to = 100;
  if(!m.gen || !GENDEF[m.gen]) m.gen = 'noise';
  if(m.gap===undefined) m.gap = 50;
  if(m.warp===undefined) m.warp = 0;
  if(!L.adj) L.adj = {bri:0,con:0,sat:0,hue:0};
  if(L.kind==='gen'){
    if(!GENDEF[L.gen]) L.gen = 'noise';
    const def = GENDEF[L.gen];
    if(L.M===undefined){
      // formato anterior: A principal, B acento -> rampa oscuro / medio / claro
      const oa = L.A || '#6b5d4a', ob = L.B || '#3d352b', overlay = (L.gen==='grime'||L.gen==='cracks'||L.gen==='scratch'||L.gen==='speckle');
      L.M = oa; L.B = shiftHex(oa,0,0,0.2); L.A = overlay ? oa : ob;
    }
    for(const k of Object.keys(def.d)) if(L[k]===undefined) L[k] = def.d[k];
    if(L.mid===undefined) L.mid = 50;
    if(L.light===undefined) L.light = 135;
  }
  if(L.kind==='fill' && L.M===undefined) L.M = L.A;
  return L;
}
function getPix(e,L){
  let c = e.pix[L.id];
  if(!c){ c = document.createElement('canvas'); c.width = c.height = e.size; c.getContext('2d',{willReadFrequently:true}).imageSmoothingEnabled = false; e.pix[L.id] = c; }
  return c;
}
function getMpix(e,L){
  let c = e.mpix[L.id];
  if(!c){ c = document.createElement('canvas'); c.width = c.height = e.size; c.getContext('2d',{willReadFrequently:true}).imageSmoothingEnabled = false; e.mpix[L.id] = c; }
  return c;
}
function loadInto(e,canvas,url,key){
  e.pending++;
  const im = new Image();
  const done = () => { if(--e.pending<=0){ e.pending = 0; scheduleRender(e,false); refreshThumbs(); if(ted && ted.e===e) renderTexSide(); } };
  im.onload = () => { const cx = canvas.getContext('2d'); cx.imageSmoothingEnabled = im.width>=e.size; cx.drawImage(im,0,0,e.size,e.size); e.ver[key] = (e.ver[key]||0)+1; done(); };
  im.onerror = done;
  im.src = url;
}
function ensureTex(meta){
  let e = TEX.get(meta.id);
  if(e) return e;
  fixSlots();
  const resized = !!meta.size && meta.size!==ATL_CELL; meta.size = ATL_CELL;   // todas las texturas son de 128 × 128
  const s = ATL_CELL, c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled = false;
  const tex = new T.CanvasTexture(c);
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.magFilter = T.NearestFilter; tex.minFilter = PSX.on ? T.NearestFilter : T.NearestMipmapNearestFilter;
  e = {id:meta.id, size:s, canvas:c, ctx, tex, doc:null, pix:{}, mpix:{}, cache:{}, ver:{}, dirty:false, raf:0, pending:0};
  TEX.set(meta.id, e); if(resized) e.dirty = true;
  const raw = TEXDATA[meta.id];
  if(raw && typeof raw==='object' && raw.doc){
    let doc = JSON.parse(JSON.stringify(raw.doc)), mmap = {};
    if(!doc.nodes){                     // documento de capas (versión anterior): se convierte a nodos y se guarda una copia del original
      const r = graphFromLayers(doc); mmap = r.mmap;
      r.doc.legacy = {layers:doc.layers||[], out:doc.out||defaultOut()};
      doc = r.doc; e.dirty = true;
    }
    e.doc = fixGraph(doc);
    for(const N of e.doc.nodes){
      if(N.type==='paint' && raw.pix && raw.pix[N.id]) loadInto(e, getPix(e,N), raw.pix[N.id], N.id+'p');
      if(N.type==='mpaint'){ const u = raw.mpix && (raw.mpix[N.id] || (mmap[N.id] && raw.mpix[mmap[N.id]])); if(u) loadInto(e, getMpix(e,N), u, N.id+'m'); }
    }
  } else {
    e.doc = fixGraph({v:3, seq:1, nodes:[]});
    const out = outNode(e.doc);
    if(typeof raw==='string'){ const P = newNode(e.doc,'paint'); P.title = 'Imagen'; e.doc.nodes.push(P); out.in.In = P.id; loadInto(e, getPix(e,P), raw, P.id+'p'); }
    else { const F = newNode(e.doc,'fill'); e.doc.nodes.push(F); out.in.In = F.id; }
    autoLayout(e.doc);
  }
  renderDoc(e);
  if(e.dirty) saveTexData();
  return e;
}
function texMat(id){
  const meta = texMeta(id); if(!meta) return null;
  const e = ensureTex(meta);
  let m = texMats.get(id);
  if(!m){
    m = new T.ShaderMaterial({uniforms:Object.assign({uTex:{value:e.tex}, uMeters:{value:meta.tile||2}}, UPSX), vertexShader:VS_TEX, fragmentShader:FS_TEX});
    texMats.set(id,m);
  }
  m.uniforms.uMeters.value = meta.tile || 2;
  return m;
}
function matsFor(src){
  if(src.water) return [waterMat,waterMat,waterMat,waterMat,waterMat,waterMat];
  const arr = [];
  for(let s=0;s<6;s++){
    const id = src.tex && src.tex[s];
    arr.push((id && texMat(id)) || getMat(src.color));
  }
  return arr;
}

/* ---- documento de nodos (v3) ---- */
// Cada textura es un grafo: los nodos tienen tipo, parámetros (p), posición en el lienzo (x, y) y entradas
// (in: ranura -> id del nodo de origen). Los nodos de color dan RGB + alfa; los de máscara, un valor de 0 a 1.
// El nodo Salida aplica la paleta y el dither PSX. Una entrada de color acepta una máscara (se ve en gris) y al revés.
// Como en Material Maker: patrones (en gris) y superficies (a color) sin entradas; se combinan con Mezcla
// y se modifican con efectos. Tipo de puerto: c = color, m = gris, x = cualquiera (el efecto conserva el tipo).
const NT = {
  out:      {label:'Salida',               ins:[['In','Resultado','x']], o:null},
  fill:     {label:'Color',                ins:[], o:'c'},
  paint:    {label:'Pintura',              ins:[], o:'c', outs:[['Color','c'],['Alfa','m']]},
  gen:      {label:'Superficie',           ins:[], o:'c', outs:[['Color','c'],['Altura','m'],['Tono','m']]},
  pnoise:   {label:'Ruido',                ins:[], o:'m'},
  pcells:   {label:'Celdas',               ins:[], o:'m', outs:[['Distancia','m'],['Bordes','m'],['Celdas','m']]},
  pbricks:  {label:'Ladrillos',            ins:[], o:'m', outs:[['Patrón','m'],['Juntas','m'],['Tono','m']]},
  pstripes: {label:'Rayas',                ins:[], o:'m'},
  pchecker: {label:'Damero',               ins:[], o:'m'},
  pshape:   {label:'Forma',                ins:[], o:'m'},
  mnoise:   {label:'Manchas',              ins:[], o:'m'},
  mgrad:    {label:'Degradado',            ins:[], o:'m'},
  mgen:     {label:'Silueta de superficie',ins:[], o:'m'},
  mpaint:   {label:'Pintura en gris',      ins:[], o:'m'},
  blend:    {label:'Mezcla',               ins:[['A','Base','x'],['B','Capa','x'],['M','Máscara','m']], o:'c'},
  mcomb:    {label:'Combinar grises',      ins:[['A','A','x'],['B','B','x']], o:'m'},
  ramp:     {label:'Colorear',             ins:[['In','Entrada','x'],['M','Máscara','m']], o:'c'},
  adjust:   {label:'Ajustes de color',     ins:[['In','Entrada','x'],['M','Máscara','m']], o:'c'},
  levels:   {label:'Niveles',              ins:[['In','Entrada','x']], o:'x'},
  thresh:   {label:'Umbral',               ins:[['In','Entrada','x']], o:'m'},
  invert:   {label:'Invertir',             ins:[['In','Entrada','x']], o:'x'},
  blur:     {label:'Desenfoque',           ins:[['In','Entrada','x']], o:'x'},
  warp:     {label:'Deformar',             ins:[['In','Entrada','x']], o:'x'},
  xform:    {label:'Repetir y girar',      ins:[['In','Entrada','x']], o:'x'},
  emboss:   {label:'Relieve',              ins:[['In','Altura','x']], o:'m'}
};
const OPS = {};
const MCOMB = [['mul','Multiplicar'],['add','Sumar'],['sub','Restar'],['max','Máximo'],['min','Mínimo'],['diff','Diferencia']];
const NODE_W = 156, COLW = 200, GAPY = 20;
// una conexión es «id» (primera salida) o «id/k» (salida k)
const refId = r => { const i = String(r).indexOf('/'); return i<0 ? r : String(r).slice(0,i); };
const refK = r => { const i = String(r).indexOf('/'); return i<0 ? 0 : (+String(r).slice(i+1)||0); };
const mkRef = (id,k) => k ? id+'/'+k : id;
const outsOf = N => NT[N.type].outs || (NT[N.type].o ? [['',NT[N.type].o]] : []);
const nodeH = N => Math.max(96, 24+18+(Math.max(NT[N.type].ins.length, outsOf(N).length)-1)*22+22);
const inPortY = i => 42+i*22, OUT_PORT_Y = 60;
const outPortY = (N,k) => outsOf(N).length>1 ? 42+k*22 : OUT_PORT_Y;
const nodeTitle = N => N.title || (N.type==='gen' ? (KLABEL[N.p.gen] || 'Generador') : NT[N.type].label);
const rseed = n => 1+Math.floor(Math.random()*n);
const nodeById = (doc,id) => doc.nodes.find(n => n.id===id);
const outNode = doc => doc.nodes.find(n => n.type==='out');
function nodeDefaults(type,gen){
  switch(type){
    case 'fill': return {A:'#6b5d4a'};
    case 'paint': return {};
    case 'gen': {
      const g = GENDEF[gen] ? gen : 'noise', def = GENDEF[g];
      return Object.assign({gen:g, A:def.c[0], M:def.c[1], B:def.c[2], mid:50, scale:2, gap:50, inten:60, warp:0, relief:0, ao:0, wear:0, grain:0, light:135}, def.d, {seed:rseed(9999)});
    }
    case 'pnoise': return {scale:4, detail:4, con:0, seed:rseed(9999)};
    case 'pcells': return {scale:6, jit:80, seed:rseed(9999)};
    case 'pbricks': return {rows:8, cols:4, mortar:12, bevel:30, offset:50, vari:30, seed:rseed(9999)};
    case 'pstripes': return {count:8, angle:0, hard:false, width:50};
    case 'pchecker': return {count:8};
    case 'pshape': return {kind:'circle', size:60, soft:20, rep:1};
    case 'blend': return {mode:'normal', op:1, on:true};
    case 'adjust': return {bri:0, con:0, sat:0, hue:0};
    case 'ramp': return {A:'#1c1814', M:'#6b5d4a', B:'#c9bb9a', mid:50, mode:'normal', op:1, on:true};
    case 'levels': return {lo:0, hi:100, gam:100};
    case 'thresh': return {th:50, soft:10};
    case 'invert': return {};
    case 'blur': return {rad:2};
    case 'warp': return {amt:20, scale:4, seed:rseed(9999)};
    case 'xform': return {rep:1, rot:0, ox:0, oy:0};
    case 'emboss': return {angle:135, str:60};
    case 'mnoise': return {scale:2, th:50, soft:30, seed:rseed(999), inv:false};
    case 'mgrad': return {from:0, to:100, dir:'v', inv:false};
    case 'mgen': return {gen:'noise', scale:2, gap:50, warp:0, seed:rseed(999), th:50, soft:30, inv:false};
    case 'mpaint': return {inv:false};
    case 'mcomb': return {mode:'mul', inv:false};
    case 'out': return defaultOut();
  }

}
function newNode(doc,type,p,x,y){
  return {id:'n'+(doc.seq++), type, x:Math.round(x||0), y:Math.round(y||0), p:Object.assign(nodeDefaults(type, p && p.gen), p||{}), in:{}};
}
// completa lo que falte y quita conexiones rotas (documentos guardados, deshacer, materiales)
function fixGraph(doc){
  if(!doc.nodes) doc.nodes = [];
  if(!doc.seq) doc.seq = 1;
  if(doc.v===4) expandOps(doc);
  for(const N of doc.nodes){
    if(!NT[N.type]) N.type = 'fill';
    N.p = Object.assign(nodeDefaults(N.type, N.p && N.p.gen), N.p||{});
    if((N.type==='gen' || N.type==='mgen') && !GENDEF[N.p.gen]) N.p.gen = 'noise';
    if(!N.in || typeof N.in!=='object') N.in = {};
    if(typeof N.x!=='number') N.x = 0;
    if(typeof N.y!=='number') N.y = 0;
    const m = /^n(\d+)$/.exec(N.id); if(m && +m[1]>=doc.seq) doc.seq = +m[1]+1;
  }
  let out = outNode(doc);
  if(!out){ out = newNode(doc,'out',null,COLW,0); doc.nodes.push(out); }
  doc.nodes = doc.nodes.filter(n => n.type!=='out' || n===out);
  for(const C of doc.nodes) if(C.type==='pcells' && C.p.mode){
    const k = C.p.mode==='edge' ? 1 : C.p.mode==='flat' ? 2 : 0; delete C.p.mode;
    if(k) for(const M of doc.nodes) for(const q of Object.keys(M.in)) if(M.in[q]===C.id) M.in[q] = mkRef(C.id,k);
  }
  const byId = new Map(doc.nodes.map(n => [n.id,n]));
  for(const N of doc.nodes) for(const k of Object.keys(N.in)){
    const S = byId.get(refId(N.in[k]));
    if(!S || S.id===N.id || !NT[N.type].ins.some(q => q[0]===k) || refK(N.in[k])>=outsOf(S).length) delete N.in[k];
  }
  if(doc.v!==5){ doc.v = 5; if(!doc.manual) autoLayout(doc); }
  return doc;
}
// documento de capas (v2) -> grafo equivalente: cada capa es fuente (+ ajustes) + máscara + Mezcla sobre lo anterior
function graphFromLayers(old){
  const doc = {v:5, seq:1, nodes:[]}, mmap = {};
  let prev = null;
  for(const L0 of (old.layers||[])){
    const L = fixLayer(JSON.parse(JSON.stringify(L0)));
    let src;
    if(L.kind==='paint') src = {id:L.id, type:'paint', x:0, y:0, p:{}, in:{}};
    else if(L.kind==='fill') src = newNode(doc,'fill',{A:L.A});
    else src = newNode(doc,'gen',Object.assign({gen:L.gen}, genParams(L)));
    const auto = KLABEL[L.kind==='gen' ? L.gen : L.kind];
    if(L.name && L.name!==auto) src.title = L.name;
    doc.nodes.push(src);
    let top = src;
    const a = L.adj;
    if(a && (a.bri || a.con || a.sat || a.hue)){ const ad = newNode(doc,'adjust',{bri:a.bri, con:a.con, sat:a.sat, hue:a.hue}); ad.in.In = top.id; doc.nodes.push(ad); top = ad; }
    let mk = null; const m = L.mask;
    if(m && m.type && m.type!=='none'){
      if(m.type==='noise') mk = newNode(doc,'mnoise',{scale:m.scale, th:m.th, soft:m.soft, seed:m.seed, inv:!!m.inv});
      else if(m.type==='grad') mk = newNode(doc,'mgrad',{from:m.from, to:m.to, inv:!!m.inv});
      else if(m.type==='gen') mk = newNode(doc,'mgen',{gen:m.gen, scale:m.scale, gap:m.gap, warp:m.warp, seed:m.seed, th:m.th, soft:m.soft, inv:!!m.inv});
      else if(m.type==='paint'){ mk = newNode(doc,'mpaint',{inv:!!m.inv}); mmap[mk.id] = L.id; }
      if(mk) doc.nodes.push(mk);
    }
    const bl = newNode(doc,'blend',{mode:L.blend||'normal', op:L.op==null ? 1 : L.op, on:L.vis!==false});
    if(prev) bl.in.A = prev.id;
    bl.in.B = top.id;
    if(mk) bl.in.M = mk.id;
    doc.nodes.push(bl); prev = bl;
  }
  const out = newNode(doc,'out',Object.assign(defaultOut(), old.out||{}));
  if(prev) out.in.In = prev.id;
  doc.nodes.push(out);
  doc.v = 5;
  autoLayout(doc);
  return {doc, mmap};
}

// «fuente + Mezcla» -> la fuente pasa a ser una operación sobre la Base de la Mezcla (mismo resultado, la mitad de nodos)
// ayer las superficies eran operaciones sobre una Entrada; hoy son fuentes: cada una vuelve a una Mezcla (mismo resultado)
function expandOps(doc){
  for(const N of doc.nodes){ const m = /^n(\d+)$/.exec(N.id); if(m && +m[1]>=doc.seq) doc.seq = +m[1]+1; }
  for(const S of [...doc.nodes]){
    if(S.type!=='fill' && S.type!=='gen' && S.type!=='paint') continue;
    const ins = S.in || {}, p = S.p || (S.p = {}), In = ins.In, M = ins.M;
    const mode = p.mode || 'normal', op = p.op==null ? 1 : p.op, on = p.on!==false;
    delete p.mode; delete p.op; delete p.on;
    if(!In && !M && op>=1 && on){ S.in = {}; continue; }
    const Bl = {id:'n'+(doc.seq++), type:'blend', x:S.x, y:S.y, p:{mode:In ? mode : 'normal', op, on}, in:{}};
    for(const N of doc.nodes) for(const k of Object.keys(N.in||{})) if(N.in[k]===S.id) N.in[k] = Bl.id;
    if(In) Bl.in.A = In;
    Bl.in.B = S.id;
    if(M) Bl.in.M = M;
    S.in = {};
    doc.nodes.push(Bl);
  }
  return doc;
}
// orden automático: columnas por distancia a la Salida (fuentes a la izquierda), y en cada columna según a quién alimentan
function autoLayout(doc,vert){
  const out = outNode(doc); if(!out) return;
  if(vert===undefined) vert = tallGraph();
  const depth = new Map();
  const visit = (N,d,stk) => {
    if(stk.has(N.id) || (depth.has(N.id) && depth.get(N.id)>=d)) return;
    depth.set(N.id,d); stk.add(N.id);
    for(const k of Object.keys(N.in)){ const S = nodeById(doc,refId(N.in[k])); if(S) visit(S,d+1,stk); }
    stk.delete(N.id);
  };
  visit(out,0,new Set());
  let maxD = 0; for(const v of depth.values()) maxD = Math.max(maxD,v);
  for(const N of doc.nodes) if(!depth.has(N.id)) depth.set(N.id,maxD+1);
  for(const v of depth.values()) maxD = Math.max(maxD,v);
  const cols = [];
  for(const N of doc.nodes){ const d = depth.get(N.id); (cols[d] = cols[d] || []).push(N); }
  const size = N => vert ? NODE_W : nodeH(N), gap = vert ? 24 : GAPY;
  const cpos = new Map();
  for(let d=0; d<=maxD; d++){
    const col = cols[d] || [];
    const key = N => {
      let s = 0, c = 0;
      for(const M of doc.nodes) NT[M.type].ins.forEach((q,i) => { if(M.in[q[0]] && refId(M.in[q[0]])===N.id && cpos.has(M.id)){ s += cpos.get(M.id)+i*0.01; c++; } });
      return c ? s/c : 1e9;
    };
    const keys = new Map(col.map(N => [N.id,key(N)]));
    col.sort((a,b) => keys.get(a.id)-keys.get(b.id));
    const total = col.reduce((t,N) => t+size(N)+gap, -gap);
    const anchor = col.length && keys.get(col[0].id)<1e8 ? col.reduce((t,N) => t+Math.min(keys.get(N.id),1e5), 0)/col.length : 0;
    let c = (d===0 ? 0 : anchor) - total/2;
    for(const N of col){
      if(vert){ N.y = (maxD-d)*(108+44); N.x = Math.round(c); cpos.set(N.id, N.x+NODE_W/2); }   // de arriba hacia abajo
      else { N.x = (maxD-d)*COLW; N.y = Math.round(c); cpos.set(N.id, N.y+nodeH(N)/2); }         // de izquierda a derecha
      c += size(N)+gap;
    }
  }
  doc.vert = !!vert;
}
// ¿el lienzo es más alto que ancho? (celular en vertical): entonces la cadena se ordena de arriba hacia abajo
function tallGraph(){
  const g = typeof document!=='undefined' && document.getElementById ? document.getElementById('graph') : null;
  if(g && g.clientWidth) return g.clientHeight>g.clientWidth*1.15;
  return typeof window!=='undefined' && window.innerHeight>window.innerWidth*1.15 && window.innerWidth<700;
}
// ¿conectar src -> dst crearía un ciclo? (dst ya alimenta a src)
function wouldCycle(doc,srcId,dstId){
  if(srcId===dstId) return true;
  const seen = new Set(), st = [srcId];
  while(st.length){
    const id = st.pop(); if(id===dstId) return true;
    if(seen.has(id)) continue; seen.add(id);
    const N = nodeById(doc,id); if(N) for(const k of Object.keys(N.in)) st.push(refId(N.in[k]));
  }
  return false;
}

/* ---- evaluación del grafo (con caché por nodo: solo se recalcula lo que cambió) ---- */
function asMask(r){
  if(r.k==='m') return r.v;
  if(r._m) return r._m;
  const n = r.al.length, v = new Float32Array(n), c = r.rgb;
  for(let i=0;i<n;i++) v[i] = (0.299*c[i*3]+0.587*c[i*3+1]+0.114*c[i*3+2])/255*r.al[i];
  return (r._m = v);
}
function asColor(r){
  if(r.k==='c') return r;
  if(r._c) return r._c;
  const n = r.v.length, rgb = new Float32Array(n*3);
  for(let i=0;i<n;i++){ const g = r.v[i]*255; rgb[i*3] = g; rgb[i*3+1] = g; rgb[i*3+2] = g; }
  return (r._c = {k:'c', rgb, al:new Float32Array(n).fill(1)});
}
// RGB opaco: si hay transparencia se compone sobre el gris de fondo (el mismo que usaban las capas)
function asOpaque(r){
  const c = asColor(r);
  if(c._o) return c._o;
  const n = c.al.length; let op = true;
  for(let i=0;i<n;i++) if(c.al[i]<1){ op = false; break; }
  if(op) return (c._o = c.rgb);
  const o = new Float32Array(n*3);
  for(let i=0;i<n;i++){ const a = c.al[i]; for(let k=0;k<3;k++) o[i*3+k] = a<=0.001 ? 119 : 119+(c.rgb[i*3+k]-119)*a; }   // mismo umbral que las mezclas
  return (c._o = o);
}
function maskThresh(src,p){
  const n = src.length, t = p.th/100, sf = Math.max(0.002, p.soft/100*0.5), v = new Float32Array(n);
  for(let i=0;i<n;i++){ const u = clamp((src[i]-(t-sf))/(2*sf),0,1); v[i] = u*u*(3-2*u); }
  return v;
}

// el dibujo propio de Color, Generador y Pintura se cachea aparte: cambiar el modo, la opacidad o la entrada no lo regenera
function patternOf(e,N){
  const c = e.cache[N.id] || (e.cache[N.id] = {}), p = N.p, s = e.size, n = s*s;
  const key = N.type==='gen' ? 'g'+JSON.stringify([p.gen,genParams(p)])+s : N.type==='fill' ? 'f'+p.A+s : 'p'+(e.ver[N.id+'p']||0)+s;
  if(c.pk===key && c.pv) return c.pv;
  let pv;
  if(N.type==='gen'){ const P = genParams(p), F = genField(p.gen, s, P), r = shadeField(F, P, s); pv = {rgb:r.rgb, al:r.al, H:F.H, T:F.T || F.H}; }
  else if(N.type==='fill'){
    const col = hexRgb(p.A), rgb = new Float32Array(n*3);
    for(let i=0;i<n;i++){ rgb[i*3] = col[0]; rgb[i*3+1] = col[1]; rgb[i*3+2] = col[2]; }
    pv = {rgb, al:new Float32Array(n).fill(1)};
  } else {
    const d = getPix(e,N).getContext('2d').getImageData(0,0,s,s).data, rgb = new Float32Array(n*3), al = new Float32Array(n);
    for(let i=0;i<n;i++){ rgb[i*3] = d[i*4]; rgb[i*3+1] = d[i*4+1]; rgb[i*3+2] = d[i*4+2]; al[i] = d[i*4+3]/255; }
    pv = {rgb, al};
  }
  c.pk = key; c.pv = pv;
  return pv;
}
function blendInto(buf,rgb,al,mode,op,mk){
  const n = al.length;
  for(let i=0;i<n;i++){
    let a = al[i]*op; if(mk) a *= mk[i];
    if(a<=0.001) continue;
    const r = rgb[i*3], g = rgb[i*3+1], b = rgb[i*3+2], br = buf[i*3], bg = buf[i*3+1], bb = buf[i*3+2];
    if(mode==='normal'){ buf[i*3] = br+(r-br)*a; buf[i*3+1] = bg+(g-bg)*a; buf[i*3+2] = bb+(b-bb)*a; }
    else { buf[i*3] = br+(blendCh(mode,br,r)-br)*a; buf[i*3+1] = bg+(blendCh(mode,bg,g)-bg)*a; buf[i*3+2] = bb+(blendCh(mode,bb,b)-bb)*a; }
  }
}

/* ---- patrones en gris (todos repiten sin costura) y efectos ---- */
function cellsField(s,p){
  const N = Math.max(1,Math.round(p.scale)), r = mulberry(p.seed), pts = new Float32Array(N*N*2), val = new Float32Array(N*N), j = p.jit/100;
  for(let i=0;i<N*N;i++){ pts[i*2] = 0.5+(r()-0.5)*j; pts[i*2+1] = 0.5+(r()-0.5)*j; val[i] = r(); }
  const dist = new Float32Array(s*s), edge = new Float32Array(s*s), flat = new Float32Array(s*s), cs = s/N;
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    const fx = (x+0.5)/cs, fy = (y+0.5)/cs, cx = Math.floor(fx), cy = Math.floor(fy);
    let d1 = 9, d2 = 9, id = 0;
    for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++){
      const gx = cx+ox, gy = cy+oy, k = (((gy%N)+N)%N)*N+(((gx%N)+N)%N);
      const dx = gx+pts[k*2]-fx, dy = gy+pts[k*2+1]-fy, d = Math.sqrt(dx*dx+dy*dy);
      if(d<d1){ d2 = d1; d1 = d; id = k; } else if(d<d2) d2 = d;
    }
    const i = y*s+x; dist[i] = clamp(d1/1.1,0,1); edge[i] = clamp((d2-d1)*2.5,0,1); flat[i] = val[id];
  }
  return {dist, edge, flat};
}
function bricksField(s,p){
  const rows = Math.max(2,Math.round(p.rows/2)*2), cols = Math.max(1,Math.round(p.cols)), bh = s/rows, bw = s/cols;
  const m = p.mortar/100*0.5, bev = Math.max(1e-3,p.bevel/100*0.5), r = mulberry(p.seed), tone = new Float32Array(rows*cols);
  for(let i=0;i<tone.length;i++) tone[i] = r();
  const v = new Float32Array(s*s), mortar = new Float32Array(s*s), tn = new Float32Array(s*s), short = Math.min(bw,bh);
  for(let y=0;y<s;y++){
    const yc = y+0.5, ry = Math.floor(yc/bh), vv = yc/bh-ry, off = (ry&1) ? p.offset/100*bw : 0;   // centro del píxel: la junta queda simétrica
    for(let x=0;x<s;x++){
      const fx = ((x+0.5+off)%s)/bw, cx = Math.floor(fx), u = fx-cx;
      const e = Math.min(Math.min(u,1-u)*bw, Math.min(vv,1-vv)*bh)/short;
      let h = clamp((e-m)/bev,0,1); h = h*h*(3-2*h);
      const t = tone[ry*cols+(cx%cols)], i = y*s+x;
      v[i] = h*(1-p.vari/100*t); mortar[i] = 1-h; tn[i] = t;
    }
  }
  return {v, mortar, tone:tn};
}
function patternField(N,s){
  const p = N.p, n = s*s, v = new Float32Array(n);
