<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maqueta — blockout para Unity</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#202328">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maqueta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#202328; --panel:#2a2e34; --raised:#343940; --raised2:#414850; --line:#464c55;
  --text:#ece7da; --muted:#a39f93; --accent:#e0a93b; --accent-ink:#2a2007; --danger:#d4544a;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;}
body{
  font:500 15px/1.35 "Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
svg{width:22px;height:22px;display:block;}
h2,h3{margin:0;font-weight:600;}
h3{font-size:14px;color:var(--muted);margin:16px 0 8px;font-weight:500;}

#app{display:flex;height:100%;width:100%;}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:var(--bg);}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.pin{
  position:absolute;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;
  display:grid;place-items:center;pointer-events:auto;touch-action:none;
  border:2px solid var(--bg);box-shadow:0 1px 6px rgba(0,0,0,.5);color:#1c1c1c;
}
.pin b{font-weight:600;font-size:14px;}
.pin .lb{
  position:absolute;left:36px;top:3px;font-style:normal;font-size:12px;white-space:nowrap;max-width:170px;
  overflow:hidden;text-overflow:ellipsis;background:var(--panel);color:var(--text);padding:2px 7px;border-radius:7px;
  border:1px solid var(--line);
}

/* barra superior */
#topbar{
  position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:4px;padding:4px 6px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:none;
}
#topbar::-webkit-scrollbar{display:none;}
#topbar>*{flex:0 0 auto;}
.brand{font-weight:600;font-size:17px;padding:0 8px 0 6px;}
.spacer{flex:1 1 auto !important;min-width:8px;}
.ib{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;}
.ib:active{background:var(--raised2);}
.ib[disabled]{opacity:.32;pointer-events:none;}
.ib.on{background:var(--raised2);color:var(--accent);}
.chip{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:var(--raised);}
.chip:active{background:var(--raised2);}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

#editbar{
  position:absolute;top:66px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;
  padding:6px 8px 6px 14px;background:var(--accent);color:var(--accent-ink);border-radius:14px;font-weight:600;
  max-width:calc(100% - 16px);
}
#editbar.show{display:flex;}
#editbar button{border:0;border-radius:9px;height:36px;padding:0 14px;background:var(--accent-ink);color:var(--text);font-weight:600;}
#editbar button.ghost{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--accent-ink);}

/* dock y selección */
#dock{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
}
.tool{
  width:64px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:0;border-radius:12px;background:transparent;font-size:12px;
}
.tool svg{width:23px;height:23px;}
.tool:active{background:var(--raised2);}
.tool.on{background:var(--accent);color:var(--accent-ink);}
#selbar{position:absolute;left:8px;right:8px;bottom:84px;display:none;justify-content:center;pointer-events:none;}
#selbar.show{display:flex;}
#selbar .inner{
  pointer-events:auto;display:flex;align-items:center;gap:4px;padding:5px 6px;max-width:100%;width:max-content;
  overflow-x:auto;scrollbar-width:none;touch-action:pan-x;background:var(--panel);border:1px solid var(--line);border-radius:14px;
}
#selbar .inner::-webkit-scrollbar{display:none;}
#selbar .inner>*{flex:0 0 auto;}
.info{font-size:13px;color:var(--muted);padding:0 8px;white-space:nowrap;}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0;}
.sw.on{border-color:var(--text);box-shadow:inset 0 0 0 2px var(--bg);}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px;}
.tb{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;white-space:nowrap;}
.tb:active{background:var(--raised2);}
.tb.danger{color:#f08a82;}

#toast{
  position:absolute;left:50%;bottom:156px;transform:translateX(-50%) translateY(8px);opacity:0;pointer-events:none;
  background:var(--raised2);padding:8px 14px;border-radius:12px;max-width:calc(100% - 24px);text-align:center;
  transition:opacity .18s, transform .18s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast{position:fixed;z-index:60;bottom:calc(156px + env(safe-area-inset-bottom,0px));}

/* panel */
#panel{
  display:none;flex:0 0 auto;width:min(350px,40vw);flex-direction:column;min-height:0;background:var(--panel);
  border-left:1px solid var(--line);
}
.open #panel{display:flex;}
#tabs{display:flex;gap:2px;padding:8px 8px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);}
#tabs::-webkit-scrollbar{display:none;}
#tabs button{
  flex:0 0 auto;height:42px;padding:0 13px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);
}
#tabs button.on{color:var(--text);border-bottom-color:var(--accent);}
#pbody{flex:1;min-height:0;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;}
.tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 9px;border-radius:12px;
  border:1px solid var(--line);background:var(--raised);
}
.tile svg{width:30px;height:30px;}
.tile:active{background:var(--raised2);}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
label{display:block;font-size:13px;color:var(--muted);}
label.full{margin-bottom:10px;}
input,textarea{
  display:block;width:100%;margin-top:4px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit;-webkit-user-select:text;user-select:text;
}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
textarea{min-height:90px;resize:vertical;}
.empty{color:var(--muted);padding:18px 6px;text-align:center;}
.list{display:flex;flex-direction:column;gap:8px;}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--raised);border:1px solid var(--line);}
.item .t{flex:1;min-width:0;}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .t span{font-size:13px;color:var(--muted);}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#1c1c1c;font-weight:600;font-size:13px;flex:0 0 auto;}
.btn{height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--raised);}
.btn:active{background:var(--raised2);}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
.btn.danger{color:#f08a82;}
.btn.sm{height:38px;padding:0 12px;}
.stack{display:flex;flex-direction:column;gap:8px;}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0;}

#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,9,11,.6);z-index:50;padding:12px;}
#modal.show{display:grid;}
#mcard{width:min(440px,100%);max-height:90%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;}
#mcard h2{font-size:18px;margin-bottom:12px;}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.kinds .chip{display:flex;align-items:center;gap:6px;}
.kinds .chip i{width:12px;height:12px;border-radius:50%;display:block;}

input[type=range]{padding:0;height:34px;accent-color:var(--accent);background:transparent;border:0;}
input[type=color]{height:44px;padding:3px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips .chip{height:40px;}
#terrbar{position:absolute;left:8px;right:8px;bottom:84px;display:none;justify-content:center;pointer-events:none;}
#terrbar.show{display:flex;}
#terrbar .inner{pointer-events:auto;display:flex;flex-direction:column;gap:8px;padding:8px;width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;}
#terrbar .trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
#terrbar .trow.sl{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
#terrbar .trow.sl.one{grid-template-columns:1fr;}
#terrbar label{font-size:12px;color:var(--muted);display:block;}
#terrbar label b{float:right;font-weight:600;color:inherit;}
#terrbar input[type=range]{width:100%;margin:6px 0 0;}
.psx-on #terrbar,.walking #terrbar{display:none !important;}
#paintbar{position:absolute;left:8px;right:8px;bottom:84px;display:none;justify-content:center;pointer-events:none;}
#paintbar.show{display:flex;}
#paintbar .inner{
  pointer-events:auto;display:flex;align-items:center;gap:6px;padding:6px;max-width:100%;width:max-content;overflow-x:auto;
  scrollbar-width:none;touch-action:pan-x;background:var(--panel);border:1px solid var(--line);border-radius:14px;
}
#paintbar .inner::-webkit-scrollbar{display:none;}
#paintbar .inner>*{flex:0 0 auto;}
.th{width:48px;height:48px;border-radius:9px;border:2px solid var(--line);padding:0;overflow:hidden;background:var(--bg);display:grid;place-items:center;}
.th canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
.th.on{border-color:var(--accent);}
.th.none{color:var(--muted);}

#texEd{
  position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
#texEd.show{display:flex;}
#texHead{display:flex;align-items:center;gap:8px;padding:8px;background:var(--panel);border-bottom:1px solid var(--line);}
#texHead input{margin:0;}
#texName{flex:1 1 140px;min-width:100px;}
#texHead .tl{display:flex;align-items:center;gap:6px;white-space:nowrap;}
#texHead .tl input{width:78px;}
#texBody{flex:1;min-height:0;display:flex;}
#texStage{position:relative;flex:1;min-width:0;min-height:0;background:#17191c;overflow:hidden;}
#texWrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none;}
#texView{position:absolute;top:8px;left:8px;display:flex;gap:6px;z-index:2;}
#texView .chip{background:rgba(42,46,52,.92);}
#texView .chip.on{background:var(--accent);}
.mosc{image-rendering:pixelated;box-shadow:0 0 0 1px var(--line);}
.sec{border-bottom:1px solid var(--line);}
.sech{width:100%;display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 2px;border:0;background:transparent;font-weight:600;text-align:left;}
.sech i{font-style:normal;color:var(--muted);font-size:20px;width:24px;text-align:center;}
.secb{padding:2px 0 14px;}
.lrow{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 4px;margin-bottom:6px;border-radius:11px;border:1px solid transparent;background:var(--raised);cursor:pointer;}
.lrow.sel{border-color:var(--accent);}
.lrow.off .ln,.lrow.off canvas{opacity:.45;}
.lrow canvas{width:36px;height:36px;flex:0 0 auto;border-radius:6px;image-rendering:pixelated;background:#555;}
.lrow .ln{flex:1;min-width:0;}
.lrow .ln b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lrow .ln span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.eye{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--muted);}
.eye.on{color:var(--text);}
label b{color:var(--text);font-weight:600;margin-left:4px;}
#walkui{position:absolute;inset:0;display:none;pointer-events:none;z-index:6;}
.walking #walkui{display:block;}
#walkExit{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;pointer-events:auto;background:rgba(42,46,52,.92);}
#walkFlash{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:10px;pointer-events:auto;background:rgba(42,46,52,.92);}
#joyBase{position:absolute;display:none;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);}
#stats{position:absolute;right:8px;top:66px;z-index:6;display:none;min-width:206px;max-width:min(300px,calc(100% - 16px));padding:8px 10px;background:rgba(32,35,40,.92);border:1px solid var(--line);border-radius:12px;font-size:12.5px;font-variant-numeric:tabular-nums;pointer-events:none;}
.sthead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.sthead span{display:flex;gap:4px;}
.sx{pointer-events:auto;height:30px;min-width:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-size:12px;}
.sx.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.strow{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-top:1px solid rgba(255,255,255,.06);}
.strow span{color:var(--muted);}
.strow b{font-weight:600;text-align:right;}
.walking #stats{top:calc(10px + env(safe-area-inset-top,0px));}
#cullStat{position:absolute;right:10px;bottom:10px;display:none;z-index:7;pointer-events:none;font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:3px 9px;border-radius:9px;}
#joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.42);}
.walking #topbar,.walking #dock,.walking #selbar,.walking #paintbar,.walking #editbar{display:none !important;}
.tile{position:relative;}
.tile canvas{width:100%;max-width:72px;aspect-ratio:1;image-rendering:pixelated;border-radius:6px;background:#555;}
.tdel{position:absolute;top:2px;right:2px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.55);font-style:normal;font-size:18px;line-height:1;}
#texWrap canvas{image-rendering:pixelated;box-shadow:0 0 0 1px var(--line);touch-action:none;cursor:crosshair;}
#texSide{width:min(360px,42vw);overflow-y:auto;padding:12px;background:var(--panel);border-left:1px solid var(--line);-webkit-overflow-scrolling:touch;}
#texPrev{display:block;width:100%;max-width:230px;aspect-ratio:1;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px;background:#000;}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px;}
.pal button{aspect-ratio:1;min-height:30px;border-radius:7px;border:1px solid var(--line);padding:0;}

/* ---- revisión de usabilidad ---- */
button:focus-visible,[role=tab]:focus-visible,input:focus-visible,textarea:focus-visible,.th:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.chip.on::before{content:"✓ ";}
#topbar{overflow:visible;}
@media (max-width:480px){.brand{display:none;}}
#legacy{display:none;}
#tabs{flex-wrap:wrap;overflow:visible;gap:4px;padding:8px;}
#tabs button{flex:1 1 auto;min-width:76px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--muted);}
#tabs button.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);}
#dock{width:calc(100% - 16px);max-width:460px;}
.tool{flex:1 1 0;min-width:0;width:auto;}
#selbar .inner{flex-wrap:wrap;justify-content:center;gap:4px 8px;width:auto;max-width:min(100%,580px);overflow:visible;touch-action:auto;}
.srow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;}
.info{white-space:normal;max-width:220px;}
#toast{display:flex;align-items:center;}
#toast.has-action{pointer-events:auto;}
.tact{margin-left:12px;height:36px;padding:0 14px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;}
#menu{position:fixed;z-index:45;display:none;min-width:240px;max-width:calc(100vw - 16px);padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.45);}
#menu.show{display:block;}
.mitem{display:flex;align-items:center;gap:6px;width:100%;min-height:44px;padding:0 12px 0 4px;border:0;border-radius:9px;background:transparent;text-align:left;}
.mitem:hover,.mitem:active{background:var(--raised2);}
.mk{width:24px;text-align:center;color:var(--accent);font-weight:600;}
.ml{flex:1;}
.mh{color:var(--muted);font-size:12px;}
.msep{height:1px;background:var(--line);margin:4px 6px;}
.mtitle{padding:6px 12px 2px;font-size:12px;color:var(--muted);}
#modeBanner{position:absolute;top:66px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:6px 8px 6px 14px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--accent);border-radius:14px;z-index:4;}
#modeBanner.show{display:flex;}
#modeBanner button{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--raised);}
#modeBanner button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
.walking #modeBanner{top:calc(12px + env(safe-area-inset-top,0px));}
.psx-on #selbar,.psx-on #paintbar,.psx-on #dock{display:none !important;}
.mtile canvas{width:72px;height:72px;max-width:none;image-rendering:auto;background:transparent;}
.help dt{font-weight:600;margin-top:12px;}
.help dd{margin:2px 0 0;color:var(--muted);}
#texHead{flex-wrap:wrap;}
@media (pointer:coarse){
  .chip{min-height:44px;} .chips .chip{height:44px;} .sw{width:40px;height:40px;} .eye{width:44px;height:44px;}
  input[type=range]{height:44px;} .pal button{min-height:38px;} .tile{min-height:84px;}
}
@media (max-width:820px), (orientation:portrait){
  #app{flex-direction:column;}
  #panel{width:auto;height:min(46vh,430px);border-left:0;border-top:1px solid var(--line);}
  .tool{width:54px;}
  #texBody{flex-direction:column;}
  #texStage{flex:0 0 46%;}
  #texSide{width:auto;flex:1;border-left:0;border-top:1px solid var(--line);}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none;}}

/* ================= móvil 16:9: vertical (360×640) y horizontal (640×360) ================= */
:root{--rail:54px;}
#stage{--bars-b:84px;}
#stage.sm{--bars-b:78px;}
/* pila superior: barra, aviso de modo, editor de prefab, métricas; se acomodan solos y no se pisan */
#topstack{position:absolute;top:8px;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
#topstack>*{pointer-events:auto;}
#topstack>#topbar{position:static;width:100%;}
#topstack>#modeBanner,#topstack>#editbar{position:static;transform:none;left:auto;top:auto;max-width:100%;flex-wrap:wrap;justify-content:center;row-gap:6px;}

  #app.rad #panel{left:8px;right:8px;width:auto !important;top:8px;bottom:var(--wh-top,260px);}
}
/* diales */
label.dial{display:inline-flex !important;flex-direction:column;align-items:center;vertical-align:top;width:31%;min-width:76px;margin:2px 0 8px !important;text-align:center;}
label.dial>input[type=range]{display:none !important;}
.dring{position:relative;display:block;width:64px;height:64px;touch-action:none;cursor:grab;border-radius:50%;outline-offset:2px;}
.dring.drag{cursor:grabbing;}
.dring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.dring .dtr{fill:none;stroke:var(--line);stroke-width:6;stroke-linecap:round;}
.dring .dval{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;}
.dring .dknob{fill:var(--text);stroke:var(--bg);stroke-width:2;}
.dring.drag .dknob{r:7;}
.dring b{position:absolute !important;inset:0;display:flex !important;align-items:center;justify-content:center;float:none !important;margin:0 !important;font-size:12.5px;font-weight:600;color:var(--text);pointer-events:none;}
.dcap{display:block;font-size:11.5px;line-height:1.2;color:var(--muted);margin-top:2px;max-width:100%;}
#terrbar label.dial{width:auto;min-width:80px;}

/* rueda: arco desplazable, valores y dial */
#wheel .wb{touch-action:none;}
#wheel .wb.it.on{background:var(--accent);}
#wheel .wb.num{flex-direction:column;gap:1px;}
#wheel .wb.num svg{width:38%;height:38%;}
#wheel .wv{font-size:11px;line-height:1;font-weight:700;}
#wheel .wr2.scr{pointer-events:all;touch-action:none;}
#wheel .wsb{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;opacity:.75;}
#wheel .wdtr{fill:var(--line);}
#wheel .wdval{fill:var(--accent);}
#wheel .wdthumb{fill:var(--text);stroke:var(--panel);stroke-width:3;pointer-events:none;}
#wheel .whit{fill:transparent;pointer-events:all;touch-action:none;cursor:grab;}
#wheel .wc.dial b{font-size:17px;line-height:1.05;font-weight:700;color:var(--accent);}
#wheel .wc.dial span{font-size:8.5px;}
#wheel .sat.del{color:#f08a82;}

/* sin paneles ni tarjetas: todo vive en la rueda */
#app.rad #panel,#app.rad #selbar,#app.rad #paintbar,#app.rad #terrbar{display:none !important;}
#wheel .wt{font-size:12.5px;font-weight:700;line-height:1;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
#wheel .wax{font-style:normal;font-weight:800;font-size:12px;line-height:1;}
#wheel .wax.axX{color:#f08a82;} #wheel .wax.axY{color:#8fd18a;} #wheel .wax.axZ{color:#8ab8f0;}
#wheel .wb.on .wax{color:inherit;}

/* tipos de elemento de la rueda: carpeta, opción, interruptor, botón y valor */
#wheel .wb.grp::after{display:none;}
#wheel .wb.it.k-tog.on{background:transparent;color:var(--accent);}
#wheel .wtg{position:absolute;left:50%;bottom:4px;width:15px;height:8px;margin-left:-7.5px;border-radius:4px;border:1.5px solid currentColor;opacity:.7;box-sizing:border-box;}
#wheel .wtg::after{content:'';position:absolute;top:1px;left:1px;width:3px;height:3px;border-radius:50%;background:currentColor;}
#wheel .k-tog.on .wtg{background:var(--accent);border-color:var(--accent);opacity:1;}
#wheel .k-tog.on .wtg::after{left:auto;right:1px;background:var(--accent-ink);}
#wheel .k-tog svg{margin-top:-5px;}
#wheel .wdr{position:absolute;right:2px;top:50%;margin-top:-4px;width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.55;}
#wheel .wsw b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:11px;color:#14110e;font-weight:800;}

/* jerarquía */
#hier{position:absolute;z-index:7;right:calc(8px + env(safe-area-inset-right,0px));top:8px;bottom:8px;width:min(300px,40vw);display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden;}
#hier.show{display:flex;}
#hier .hh{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);}
#hier .hh b{font-size:14px;}
#hier .hh #hierCount{font-size:11.5px;color:var(--muted);margin-right:auto;margin-left:6px;}
#hier .hh .ib{width:34px;height:34px;}
#hier .hh .ib:disabled{opacity:.3;}
#hier .hl{flex:1;overflow-y:auto;touch-action:pan-y;padding:4px 0;}
#hier .hr{display:flex;align-items:center;gap:6px;min-height:36px;padding-right:4px;user-select:none;-webkit-user-select:none;border-radius:8px;margin:0 4px;}
#hier .hr>svg{width:16px;height:16px;flex:0 0 auto;color:var(--muted);}
#hier .hr .hn{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hier .hr .hn small{color:var(--muted);font-size:11px;}
#hier .hr .hx{width:22px;height:30px;flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:12px;padding:0;display:block;}
#hier .hr .he{width:32px;height:32px;flex:0 0 auto;border:0;background:none;color:var(--muted);padding:6px;opacity:.55;}
#hier .hr .he svg{width:18px;height:18px;}
#hier .hr.sel{background:var(--accent);color:var(--accent-ink);}
#hier .hr.sel>svg,#hier .hr.sel .he,#hier .hr.sel .hx,#hier .hr.sel small{color:var(--accent-ink);}
#hier .hr.hid .hn{opacity:.45;text-decoration:line-through;}
#hier .hr.drag{opacity:.5;}
#hier .hr.over{outline:2px dashed var(--accent);outline-offset:-2px;}
#hier .hdrop{display:none;margin:4px 8px;padding:8px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted);text-align:center;}
#hier.dragging .hdrop{display:block;}
#hier .hdrop.over{border-color:var(--accent);color:var(--accent);}
#hier .hhint{margin:0;padding:6px 10px 8px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);}
#wheel .sat.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
@media (orientation:portrait){ #hier{left:8px;right:8px;width:auto;bottom:auto;height:44%;} }

.pinlbl{position:absolute;left:0;top:0;pointer-events:none;margin:-44px 0 0 0;padding:3px 8px;border-radius:8px;background:rgba(20,17,14,.82);color:#f3ead8;font-size:12px;white-space:nowrap;transform-origin:0 0;translate:-50% 0;}

/* con la jerarquía abierta, los avisos de arriba no la tapan */
#app.rad.hieron #topstack{right:calc(min(300px,40vw) + 16px) !important;}
#app.rad.hieron #toast{right:calc(min(300px,40vw) + 16px) !important;}
@media (orientation:portrait){
  #app.rad.hieron #topstack{right:calc(8px + env(safe-area-inset-right,0px)) !important;top:calc(44% + 16px) !important;}
  #app.rad.hieron #toast{right:8px !important;top:calc(44vh + 72px) !important;}
}

/* barra de la rueda */
#uvEd{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#uvEd.show{display:flex;}
#uvHead{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;}
#uvHead::-webkit-scrollbar{display:none;}
@media (max-width:560px){ #uvHead{gap:4px;padding:6px 6px;} #uvHead .uvt{display:none;} #uvHead .ib{width:36px;height:36px;} #uvHead .uvb{padding:0 6px;} #uvHead .uvb select{max-width:84px;} }
#uvHead .ib{width:40px;height:40px;flex:0 0 auto;}
#uvHead .ib.on{background:var(--accent);color:var(--accent-ink);}
#uvHead .uvt{font-size:15px;white-space:nowrap;}
#uvHead .uvfill{flex:1;}
#uvStage{position:relative;flex:1;min-height:0;background:#17191c;overflow:hidden;}
#uvcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;}
#uvTools{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;}
#uvTools .uvrow{display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:var(--line) transparent;cursor:grab;}
#uvTools .uvrow::-webkit-scrollbar{height:4px;} #uvTools .uvrow::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
#uvTools .uvrow.drag{cursor:grabbing;user-select:none;}
.uvb{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:4px;height:38px;min-width:40px;padding:0 9px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);cursor:pointer;}
.uvb svg{width:18px;height:18px;flex:0 0 auto;}
.uvb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.uvb.off{opacity:.4;}
.uvb select{height:30px;max-width:130px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px;}
.uvsp{flex:0 0 1px;align-self:stretch;margin:4px 2px;background:var(--line);}
.uvn{flex:0 0 auto;display:flex;align-items:center;gap:2px;height:38px;padding:0 4px 0 9px;border-radius:10px;border:1px solid var(--line);background:var(--raised);}
.uvn.off{opacity:.45;}
.uvn em{font-style:normal;font-weight:800;font-size:12.5px;margin-right:2px;white-space:nowrap;}
.uvn em.axX{color:#f08a82;} .uvn em.axY{color:#8fd18a;}
.uvn button{width:30px;height:30px;border:0;border-radius:8px;background:var(--bg);color:var(--text);font-size:18px;line-height:1;}
.uvn input{width:70px;height:30px;margin:0;padding:0 4px;background:transparent;border:0;color:var(--text);text-align:center;font:inherit;font-size:14px;font-weight:700;}
#uvmods{position:absolute;z-index:4;}
.wmods{position:absolute;z-index:6;display:flex;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none;}
.mkey{min-width:calc(58px*var(--mk,1));height:calc(40px*var(--mk,1));padding:0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:12px;border:1px solid var(--line);background:rgba(36,40,46,.92);color:var(--text);touch-action:none;-webkit-touch-callout:none;}
.mkey b{font-size:13px;line-height:1.1;} .mkey i{font-style:normal;font-size:10.5px;line-height:1.1;opacity:.8;}
.mkey.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.mkey.idle{opacity:.5;}
.mboth{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:calc(48px*var(--mk,1));height:calc(40px*var(--mk,1));padding:0 6px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);background:rgba(36,40,46,.7);pointer-events:none;}
.mboth b{font-size:11px;line-height:1.1;} .mboth i{font-style:normal;font-size:10.5px;line-height:1.1;}
.mboth.on{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);} .mboth.idle{opacity:.45;}
#ctlEd,#prjEd{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#ctlEd.show,#prjEd.show{display:flex;}
#ctlHead,#prjHead{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);}
#ctlHead .ib,#prjHead .ib{width:40px;height:40px;}
#ctlBody,#prjBody{flex:1;overflow-y:auto;padding:12px;max-width:720px;width:100%;margin:0 auto;box-sizing:border-box;-webkit-overflow-scrolling:touch;}
.cs{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:12px;}
.cs h3{margin:4px 0 6px;font-size:14px;}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;border-top:1px solid var(--line);}
.cr label{flex:1;font-size:14px;}
.cr select{height:34px;max-width:58%;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px;}
.cr input[type=checkbox]{width:22px;height:22px;}
.cr .c2{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-size:12.5px;} .cr .c2 select{max-width:130px;}
.cs .hint{font-size:12px;color:var(--muted);margin:6px 0 4px;}
#prjBar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;}
#prjBar .pbl{flex:1 1 140px;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#prjBar .chip{height:34px;min-height:34px;padding:0 12px;font-size:13px;} #prjBar .chip:disabled{opacity:.4;pointer-events:none;} #prjBar .danger{color:#f08a82;}
#prjMain{position:relative;flex:1;min-height:0;display:flex;}
#prjMain #prjBody{flex:1;}
#prjSide{position:absolute;top:0;right:0;bottom:0;width:min(300px,84vw);box-sizing:border-box;padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.35);transform:translateX(104%);transition:transform .18s ease;z-index:2;}
#prjSide.show{transform:none;}
#prjSide .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
#prjSide .sh b{display:block;font-size:14px;} #prjSide .sh small{display:block;max-width:210px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} #prjSide .sh .ib{width:36px;height:36px;}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
.tg.sg{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;}
.ptl{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;min-width:0;padding:6px;box-sizing:border-box;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
.ptl .tz{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:9px;}
.ptl .tz span{font-size:34px;font-weight:600;color:rgba(255,255,255,.88);}
.ptl .tz em{position:absolute;top:4px;left:4px;font-style:normal;font-size:10px;padding:1px 6px;border-radius:8px;background:var(--accent);color:var(--accent-ink);}
.ptl .tn{margin-top:5px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ptl small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ptl .tin{width:100%;height:26px;box-sizing:border-box;padding:0 6px;font:inherit;font-size:12.5px;border-radius:6px;border:1px solid var(--accent);background:var(--bg);color:var(--text);}
.ptl.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);} .ptl.sub{border-color:var(--accent);}
.ptl.add{align-items:center;justify-content:center;border:2px dashed var(--line);background:transparent;}
.ptl.add span{font-size:38px;line-height:1;color:var(--muted);}
#wbar{position:absolute;z-index:5;display:none;left:var(--wb-l,200px);right:8px;bottom:10px;height:52px;box-sizing:border-box;align-items:center;gap:6px;padding:6px 8px 4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:var(--line) transparent;-webkit-overflow-scrolling:touch;cursor:grab;}
#wbar::-webkit-scrollbar{height:5px;}
#wbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
#wbar.drag{cursor:grabbing;user-select:none;}
#wbar .bc{cursor:pointer;}
#wbar.show{display:flex;}
#app.rad.hieron #wbar{right:calc(min(300px,40vw) + 16px);}
#wbar .bc{flex:0 0 auto;height:36px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);font-size:12.5px;white-space:nowrap;position:relative;}
#wbar .bc svg{width:18px;height:18px;flex:0 0 auto;}
#wbar .bc.ico{padding:0 9px;}
#wbar .bc.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
#wbar .bc.k-tog.on{background:var(--raised);color:var(--accent);border-color:var(--accent);}
#wbar .bc.off{opacity:.4;}
#wbar .bc.act{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
#wbar .bc.crumb{cursor:default;}
#wheel .wlink{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;}
#wheel .wlink-dot{fill:var(--accent);}
#wbar .bc.k-num b{font-size:13px;font-weight:700;}
#wbar .bc .bl{font-size:11px;color:var(--muted);}
#wbar .bc em{font-style:normal;font-weight:800;font-size:13px;}
#wbar .bc em.axX{color:#f08a82;} #wbar .bc em.axY{color:#8fd18a;} #wbar .bc em.axZ{color:#8ab8f0;}
#wbar .bc .wsw{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.35);}
#wbar .bc .wsw b{font-size:11px;color:#14110e;}

#wbar .bc canvas{width:28px;height:28px;border-radius:6px;image-rendering:pixelated;background:#14110e;}
#wbar .bc .wtg{position:static;width:15px;height:8px;margin:0;}
#wbar .bc .bdr{font-style:normal;opacity:.6;}
#wbar .blbl{flex:0 0 auto;font-size:11px;color:var(--muted);padding:0 2px;}
#wbar .selc{padding:0 6px 0 10px;}
#wbar select{height:30px;max-width:150px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px;}
@media (hover:hover) and (pointer:fine){
  .ib:not(.on):hover,.chip:not(.on):hover,.tool:not(.on):hover{background:var(--raised2);}
  #wheel .wb:hover,#wheel .sat:hover,.mkey:hover{filter:brightness(1.18);}
  .ptl:hover{border-color:var(--accent);}
}
.kbh h3,.cs h3{margin:10px 0 4px;}
.kg h4{margin:12px 0 4px;font-size:12.5px;color:var(--muted);font-weight:600;}
.kr{display:flex;gap:10px;align-items:flex-start;padding:3px 0;font-size:13px;line-height:1.5;}
.kr .kk{flex:0 0 46%;min-width:0;}
.kbd{display:inline-block;min-width:20px;padding:0 6px;margin:1px 2px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--raised);font:600 11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:center;}
#prjHead .chip{margin-left:auto;height:34px;min-height:34px;padding:0 12px;font-size:12.5px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#prjHead b{flex:0 1 auto;white-space:nowrap;}

<body>
<div id="app">
  <div id="stage">
    <canvas id="gl" tabindex="0"></canvas>
    <div id="pins"></div>

    <div id="topstack">
    <header id="topbar">
      <div class="brand">Maqueta</div>
      <button class="ib" id="bUndo" aria-label="Deshacer" data-ic="undo"></button>
      <button class="ib" id="bRedo" aria-label="Rehacer" data-ic="redo"></button>
      <button class="chip" id="bSnap" aria-haspopup="menu" aria-expanded="false">Snap 0.5 ▾</button>
      <div class="spacer"></div>
      <button class="chip" id="bView" aria-haspopup="menu" aria-expanded="false">Vista ▾</button>
      <button class="ib" id="bPanel" aria-label="Panel" aria-expanded="false" data-ic="panel"></button>
      <button class="ib" id="bMore" aria-label="Más opciones" aria-haspopup="menu" aria-expanded="false" data-ic="more"></button>
    </header>
    <div id="modeBanner" role="status"></div>

    <div id="editbar">
      <span id="editLabel">Editando prefab</span>
      <button id="editOk">Listo</button>
      <button id="editCancel" class="ghost">Cancelar</button>
    </div>
      <div id="cullStat"></div>
      <div id="stats" aria-label="Estadísticas"></div>
    </div>
    <div id="legacy" hidden>
      <button id="bProj"></button><button id="bPlan"></button><button id="bPsx"></button>
      <button id="bWalk"></button><button id="bFrame"></button><button id="bPins" class="on"></button>
    </div>
    <div id="selbar"><div class="inner" id="selInner"></div></div>
    <div id="paintbar"><div class="inner" id="paintInner"></div></div>

uniform float uLit; uniform float uNL; uniform float uAmb; uniform float uBaked;
uniform vec4 uLP[8]; uniform vec3 uLC[8]; uniform float uLW[8]; uniform vec4 uLD[8]; uniform float uLT[8];
vec3 psxLight(vec3 wp, vec3 n){
  vec3 acc = vec3(uAmb);

varying vec3 vWP; varying vec3 vWN; varying float vDepth; varying vec3 vCol;
float grid(vec2 p, float s){

/* ---------- geometría ---------- */
function triGeo(arr){
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(arr,3));
  return g;
}
function addTri(a,p,q,r){ a.push(p[0],p[1],p[2],q[0],q[1],q[2],r[0],r[1],r[2]); }
function boxInto(a,cx,cy,cz,w,h,d){
  const g = new T.BoxGeometry(w,h,d).toNonIndexed();
  g.translate(cx,cy,cz);
  const p = g.attributes.position.array;
  for(let i=0;i<p.length;i++) a.push(p[i]);
  g.dispose();
}
function extrude(shape, depth){
  const g = new T.ExtrudeGeometry(shape, {depth, bevelEnabled:false, curveSegments:8});
  g.translate(0,0,-depth/2);
  return g;
}
function buildGeo(geo, size){
  const mm = meshOf(geo); if(mm && mm.f.length) return meshBuild(mm);
  const sx = Math.max(size[0],0.02), sy = Math.max(size[1],0.02), sz = Math.max(size[2],0.02);
  const hx = sx/2, hy = sy/2, hz = sz/2;
  let g;
  switch(geo){
    case 'cylinder':
      g = new T.CylinderGeometry(0.5,0.5,1,8,1).toNonIndexed(); g.scale(sx,sy,sz); break;
    case 'ramp': {
      const A=[-hx,-hy,-hz], B=[hx,-hy,-hz], C=[hx,-hy,hz], D=[-hx,-hy,hz], E=[-hx,hy,hz], F=[hx,hy,hz];
      const a=[];
      addTri(a,A,B,C); addTri(a,A,C,D);       // base
      addTri(a,C,F,E); addTri(a,C,E,D);       // fondo
      addTri(a,A,D,E); addTri(a,B,F,C);       // laterales
      addTri(a,A,F,B); addTri(a,A,E,F);       // pendiente
      g = triGeo(a); break;
    }
    case 'stairs': {
      const n = clamp(Math.round(sy/0.25), 2, 40), dz = sz/n, a=[];
      for(let i=0;i<n;i++){
        const h = sy*(i+1)/n;
        boxInto(a, 0, -hy+h/2, -hz+dz*(i+0.5), sx, h, dz);
      }
      g = triGeo(a); break;
    }
    case 'door': {
      const dw = Math.min(1.2, sx*0.5), dh = Math.min(2.1, sy*0.8);
      const sh = new T.Shape();
      sh.moveTo(-hx,-hy); sh.lineTo(-dw/2,-hy); sh.lineTo(-dw/2,-hy+dh); sh.lineTo(dw/2,-hy+dh);
      sh.lineTo(dw/2,-hy); sh.lineTo(hx,-hy); sh.lineTo(hx,hy); sh.lineTo(-hx,hy); sh.lineTo(-hx,-hy);
      g = extrude(sh, sz); break;
    }
    case 'window': {
      const ww = Math.min(1.4,sx*0.45), wh = Math.min(1.2,sy*0.4), cy0 = -hy+sy*0.55;
      const sh = new T.Shape();
      sh.moveTo(-hx,-hy); sh.lineTo(hx,-hy); sh.lineTo(hx,hy); sh.lineTo(-hx,hy); sh.lineTo(-hx,-hy);
      const hole = new T.Path();
      hole.moveTo(-ww/2,cy0-wh/2); hole.lineTo(-ww/2,cy0+wh/2); hole.lineTo(ww/2,cy0+wh/2); hole.lineTo(ww/2,cy0-wh/2); hole.lineTo(-ww/2,cy0-wh/2);
      sh.holes.push(hole);
      g = extrude(sh, sz); break;
    }
    case 'arch': {
      const yt = hy - Math.min(0.35, sy*0.1);
      let r = Math.min(sx*0.3, 1.5, hx-0.05);
      let yc = yt - r;
      if(yc < -hy+0.2){ r = Math.max(0.1, yt+hy-0.2); yc = yt-r; }
      const sh = new T.Shape();
      sh.moveTo(-hx,-hy); sh.lineTo(-r,-hy); sh.lineTo(-r,yc);
      sh.absarc(0,yc,r,Math.PI,0,true);
      sh.lineTo(r,-hy); sh.lineTo(hx,-hy); sh.lineTo(hx,hy); sh.lineTo(-hx,hy); sh.lineTo(-hx,-hy);
      g = extrude(sh, sz); break;
    }
    default:
      g = new T.BoxGeometry(sx,sy,sz).toNonIndexed();
  }
  return finishGeo(g);
}
// Ordena los triángulos por cara local (+x,-x,+y,-y,+z,-z), calcula UV en metros y crea grupos.
function finishGeo(g){
  if(g.index) g = g.toNonIndexed();
  g.computeVertexNormals();
  const pos = g.attributes.position.array, nor = g.attributes.normal.array, nt = pos.length/9;
  const slotOf = new Uint8Array(nt);
  for(let t=0;t<nt;t++){
    const nx = nor[t*9], ny = nor[t*9+1], nz = nor[t*9+2];
    const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
    slotOf[t] = (ax>=ay && ax>=az) ? (nx>=0?0:1) : (ay>=az ? (ny>=0?2:3) : (nz>=0?4:5));
  }
  const P = new Float32Array(pos.length), N = new Float32Array(pos.length), UV = new Float32Array(nt*6);
  const minU = [1e9,1e9,1e9,1e9,1e9,1e9], minV = [1e9,1e9,1e9,1e9,1e9,1e9];
  const sub = []; let w = 0;
  for(let s=0;s<6;s++){
    const start = w;
    for(let t=0;t<nt;t++){
      if(slotOf[t]!==s) continue;
      for(let k=0;k<3;k++){
        const a = t*9+k*3, b = w*3, x = pos[a], y = pos[a+1], z = pos[a+2];
        P[b]=x; P[b+1]=y; P[b+2]=z; N[b]=nor[a]; N[b+1]=nor[a+1]; N[b+2]=nor[a+2];
        let u, v;
        switch(s){
          case 0: u=-z; v=y; break;
          case 1: u=z;  v=y; break;
          case 2: u=x;  v=-z; break;
          case 3: u=x;  v=z; break;
          case 4: u=x;  v=y; break;
          default: u=-x; v=y;
        }
        UV[w*2]=u; UV[w*2+1]=v;
        if(u<minU[s]) minU[s]=u;
        if(v<minV[s]) minV[s]=v;
        w++;
      }
    }
    if(w>start) sub.push({slot:s, start, count:w-start});
  }
  for(const q of sub) for(let i=q.start;i<q.start+q.count;i++){ UV[i*2]-=minU[q.slot]; UV[i*2+1]-=minV[q.slot]; }
  const out = new T.BufferGeometry();
  out.setAttribute('position', new T.BufferAttribute(P,3));
  out.setAttribute('normal', new T.BufferAttribute(N,3));
  out.setAttribute('uv', new T.BufferAttribute(UV,2));
  out.setAttribute('color', new T.BufferAttribute(new Float32Array(nt*9).fill(1),3));
  for(const q of sub) out.addGroup(q.start,q.count,q.slot);
  out.userData.sub = sub;
  g.dispose();
  return out;
}

/* ---------- giro en 3 ejes: rx, rot (Y) y rz en grados; R = Ry·Rx·Rz, el mismo orden que Unity ---------- */
function rotMat(rx,ry,rz){   // matriz 3×3 por filas
  const a = rx*D2R, b = ry*D2R, c = rz*D2R, ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cc = Math.cos(c), sc = Math.sin(c);
  return [cb*cc+sb*sa*sc, -cb*sc+sb*sa*cc, sb*ca,
          ca*sc,          ca*cc,           -sa,
          -sb*cc+cb*sa*sc, sb*sc+cb*sa*cc, cb*ca];
}
const rotMatOf = o => rotMat(o.rx||0, o.rot||0, o.rz||0);
function mulM(A,B){ const r = new Array(9); for(let i=0;i<3;i++) for(let j=0;j<3;j++) r[i*3+j] = A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j]; return r; }
const mvec = (M,v) => [M[0]*v[0]+M[1]*v[1]+M[2]*v[2], M[3]*v[0]+M[4]*v[1]+M[5]*v[2], M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];
const transM = M => [M[0],M[3],M[6],M[1],M[4],M[7],M[2],M[5],M[8]];
const axisRot = (ax,deg) => ax===0 ? rotMat(deg,0,0) : ax===1 ? rotMat(0,deg,0) : rotMat(0,0,deg);
function eulerOf(M){   // [rx, ry, rz] en grados (0 a 360) para R = Ry·Rx·Rz
  const x = Math.asin(clamp(-M[5],-1,1)); let y, z;
  if(Math.abs(M[5])<0.9999999){ y = Math.atan2(M[2],M[8]); z = Math.atan2(M[3],M[4]); }
  else { y = Math.atan2(-M[6],M[0]); z = 0; }
  const f = v => { const d = normDeg(Math.round(v*180/Math.PI*1e4)/1e4); return d>=359.99995 || d<5e-5 ? 0 : d; };
  return [f(x), f(y), f(z)];
}
function setRot(o,e){ o.rot = e[1]; if(e[0]) o.rx = e[0]; else delete o.rx; if(e[2]) o.rz = e[2]; else delete o.rz; }
// una parte de prefab ubicada en el mundo: posición y matriz de giro
function partXf(o,p){
  const M = rotMatOf(o), lp = mvec(M,p.pos);
  return {pos:[o.pos[0]+lp[0], o.pos[1]+lp[1], o.pos[2]+lp[2]], m:mulM(M,rotMatOf(p))};
}
const asMat = R => typeof R==='number' ? rotMat(0,R,0) : (R.length===9 ? R : rotMat(R[0],R[1],R[2]));

/* ---------- límites y snap ---------- */
// las luces y los grupos no tienen malla: una luz ocupa un cubito y un grupo, la caja de lo que contiene
function lightBounds(o){ const p = o.pos; return [p[0]-0.3,p[1]-0.3,p[2]-0.3,p[0]+0.3,p[1]+0.3,p[2]+0.3]; }
function partBounds(size,pos,R){
  const M = asMat(R||0), h = [0,1,2].map(i => Math.abs(M[i*3])*size[0]/2+Math.abs(M[i*3+1])*size[1]/2+Math.abs(M[i*3+2])*size[2]/2);
  return [pos[0]-h[0], pos[1]-h[1], pos[2]-h[2], pos[0]+h[0], pos[1]+h[1], pos[2]+h[2]];
}
function bounds(o){
  if(o.kind==='light') return lightBounds(o);
  if(o.kind==='group'){ const ds = descendants(o.id).filter(d => !isGroup(d)); if(ds.length) return unionBounds(ds); const p = o.pos; return [p[0]-0.25,p[1],p[2]-0.25,p[0]+0.25,p[1]+0.5,p[2]+0.25]; }
  if(o.kind==='prim') return partBounds(o.size,o.pos,rotMatOf(o));
  const pf = S.prefabs[o.prefab];
  if(!pf || !pf.parts.length) return [o.pos[0],o.pos[1],o.pos[2],o.pos[0],o.pos[1],o.pos[2]];
  const b = [Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];
  for(const p of pf.parts){
    const x = partXf(o,p), pb = partBounds(p.size,x.pos,x.m);
    for(let i=0;i<3;i++){ b[i]=Math.min(b[i],pb[i]); b[i+3]=Math.max(b[i+3],pb[i+3]); }
  }
  return b;
}
function unionBounds(objs){
  const b = [Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];
  for(const o of objs){
    const ob = bounds(o);
    for(let i=0;i<3;i++){ b[i]=Math.min(b[i],ob[i]); b[i+3]=Math.max(b[i+3],ob[i+3]); }
  }
  return b;
}
const selBounds = () => unionBounds(selObjs());
const snapV = v => { const s = snapStep(); return s ? Math.round(v/s)*s : v; };
const snapEdge = (v,half) => { const s = snapStep(); return s ? Math.round((v-half)/s)*s+half : v; };

/* ---------- nodos 3D ---------- */
const nodes = new Map();
let outlines = [];
const isPickable = o => !edit || !!o.edit;

// una luz se ve como un diamante en alambre; las direccionales y los focos, con una flecha (y el foco con su cono)
function buildLightNode(o){
  const g = new T.Group(), mat = new T.LineBasicMaterial({color:new T.Color(o.lc||'#ffd9a0')});
  g.add(new T.LineSegments(new T.EdgesGeometry(new T.OctahedronGeometry(0.28,0)), mat));
  if(o.ltype==='dir' || o.ltype==='spot'){
    const L = o.ltype==='dir' ? 1.5 : 1.0, h = 0.18, w = 0.09;
    const pts = [0,0,0.3, 0,0,L, 0,0,L, w,0,L-h, 0,0,L, -w,0,L-h, 0,0,L, 0,w,L-h, 0,0,L, 0,-w,L-h];
    if(o.ltype==='spot'){
      const len = 1.4, rr = Math.tan(clamp(o.la||45,5,170)/2*D2R)*len;
      for(let k=0;k<4;k++){ const t = k*Math.PI/2; pts.push(0,0,0.28, Math.cos(t)*rr,Math.sin(t)*rr,len); }
      for(let k=0;k<20;k++){ const a0 = k/20*Math.PI*2, a1 = (k+1)/20*Math.PI*2; pts.push(Math.cos(a0)*rr,Math.sin(a0)*rr,len, Math.cos(a1)*rr,Math.sin(a1)*rr,len); }
    }
    const geo = new T.BufferGeometry(); geo.setAttribute('position', new T.Float32BufferAttribute(pts,3));
    g.add(new T.LineSegments(geo, mat));
  }
  const pick = new T.Mesh(new T.SphereGeometry(0.36,8,6), new T.MeshBasicMaterial({visible:false}));
  pick.userData.noOutline = true; g.add(pick);
  g.userData.marker = true; g.userData.lmat = mat;
  return g;
}
function buildNodeRaw(o){
  if(o.kind==='light') return buildLightNode(o);
  if(o.kind==='group') return new T.Group();
  if(o.kind==='inst'){
    const g = new T.Group();
    const pf = S.prefabs[o.prefab];
    if(pf) for(const p of pf.parts){
      const m = objMesh(p);
      m.position.set(p.pos[0],p.pos[1],p.pos[2]); m.rotation.order = 'YXZ'; m.rotation.set((p.rx||0)*D2R, p.rot*D2R, (p.rz||0)*D2R);
      g.add(m);
    }
    return g;
  }
  return objMesh(o);
}
function disposeNode(n){
  n.traverse(m => { if((m.isMesh||m.isLineSegments) && m.geometry) m.geometry.dispose(); });
}
function syncNode(o, rebuild){
  let n = nodes.get(o.id);
  if(!n || rebuild){
    if(n){ disposeNode(n); scene.remove(n); }
    n = buildNode(o); n.userData.objId = o.id; nodes.set(o.id,n); scene.add(n);
  }
  n.position.set(o.pos[0],o.pos[1],o.pos[2]);
  n.rotation.order = 'YXZ'; n.rotation.set((o.rx||0)*D2R, o.rot*D2R, (o.rz||0)*D2R);
  n.userData.hid = !!o.hidden;
  n.visible = !o.hidden && !n.userData.culled;
  n.userData.pickable = isPickable(o);
  invalidate();
  return n;
}
function removeObj(id){
  const ro = byId(id); if(ro) for(const c of S.objects) if(c.parent===id){ if(ro.parent) c.parent = ro.parent; else delete c.parent; }   // los hijos no quedan colgando
  const i = S.objects.findIndex(o => o.id===id);
  if(i>=0) S.objects.splice(i,1);
  const n = nodes.get(id);
  if(n){ disposeNode(n); scene.remove(n); nodes.delete(id); }
}
function refreshFlags(){
  for(const o of S.objects){
    const n = nodes.get(o.id);
    if(n){ n.userData.pickable = isPickable(o); n.userData.hid = !!o.hidden; n.visible = !o.hidden && !n.userData.culled; }
  }
  invalidate();
}
function refreshOutlines(){
  for(const l of outlines){ if(l.parent) l.parent.remove(l); l.geometry.dispose(); }
  outlines = [];
  for(const id of selTreeIds()){
    const n = nodes.get(id); if(!n) continue;
    const ms = []; n.traverse(m => { if(m.isMesh && !m.userData.noOutline) ms.push(m); });
    for(const m of ms){
      const l = new T.LineSegments(new T.EdgesGeometry(m.geometry,25), outlineMat);
      l.renderOrder = 998; l.raycast = () => {};
      m.add(l); outlines.push(l);
    }
  }
  for(const o of S.objects) if(o.kind==='light'){ const n = nodes.get(o.id); if(n && n.userData.lmat) n.userData.lmat.color.set(selTreeIds().has(o.id) ? '#ffd166' : (o.lc||'#ffd9a0')); }
  invalidate();
}
function rebuildAll(){
  migrateLights(); migrateGroups(); fixSlots(); atlasResync();
  docRev++; currentBake = null;
  if(bakeActive){ bakeActive = false; UPSX.uBaked.value = 0; }
  for(const n of nodes.values()){ disposeNode(n); scene.remove(n); }
  nodes.clear(); outlines = [];
  for(const o of S.objects) syncNode(o,true);
  U_MOD.value = S.meta.M;
  S.texList.forEach(t => ensureTex(t));
  renderPins(); refreshOutlines(); syncTerrains();
}

/* ---------- gizmos ---------- */
const GIZ_PX = 96;
const AXC = [0xe5534b,0x57ab5a,0x539bf5];
const gizMove = new T.Group(), gizSize = new T.Group(), gizRot = new T.Group();
scene.add(gizMove, gizSize, gizRot);
gizMove.visible = false; gizSize.visible = false; gizRot.visible = false;

const sizeHandles = [];
const gizHits = [];
(function buildGizmos(){
  const mk = (c,op) => new T.MeshBasicMaterial({color:c, depthTest:false, depthWrite:false, transparent:true, opacity:op==null?1:op});
  const hitMat = new T.MeshBasicMaterial({visible:false, side:T.DoubleSide});
  ['x','y','z'].forEach((a,i) => {
    const g = new T.Group(), m = mk(AXC[i]);
    const shaft = new T.Mesh(new T.CylinderGeometry(0.035,0.035,0.72,8), m); shaft.position.y = 0.36;
    const cone = new T.Mesh(new T.ConeGeometry(0.11,0.28,12), m); cone.position.y = 0.86;
    const hit = new T.Mesh(new T.CylinderGeometry(0.24,0.24,1.1,8), hitMat); hit.position.y = 0.55; hit.userData.handle = a;
    shaft.renderOrder = 999; cone.renderOrder = 999;
    g.add(shaft,cone,hit);
    if(a==='x') g.rotation.z = -Math.PI/2;
    if(a==='z') g.rotation.x = Math.PI/2;
    gizMove.add(g);
  });
  const pl = new T.Mesh(new T.PlaneGeometry(0.32,0.32), mk(0xe0a93b,0.6));
  pl.rotation.x = -Math.PI/2; pl.position.set(0.3,0,0.3); pl.renderOrder = 999; gizMove.add(pl);
  const ph = new T.Mesh(new T.PlaneGeometry(0.55,0.55), hitMat);
  ph.rotation.x = -Math.PI/2; ph.position.set(0.3,0,0.3); ph.userData.handle = 'xz'; gizMove.add(ph);
  for(let a=0;a<3;a++){   // giro: un anillo por eje, alineados al mundo como en Unity
    const g = new T.Group(), m = mk(AXC[a]);
    const ring = new T.Mesh(new T.TorusGeometry(0.9,0.03,8,72), m); ring.renderOrder = 999;
    const hit = new T.Mesh(new T.TorusGeometry(0.9,0.16,6,36), hitMat); hit.userData.handle = 'r'+a;
    g.add(ring,hit);
    if(a===0) g.rotation.y = Math.PI/2;
    if(a===1) g.rotation.x = Math.PI/2;
    gizRot.add(g);
  }
  for(let a=0;a<3;a++) for(const sg of [1,-1]){
    const g = new T.Group();
    const dot = new T.Mesh(new T.SphereGeometry(1,14,10), mk(AXC[a])); dot.renderOrder = 999;
    const hit = new T.Mesh(new T.SphereGeometry(2.4,8,6), hitMat);
    hit.userData.handle = 's'+a+(sg>0?'+':'-');
    g.add(dot,hit); g.userData = {a,sg};
    gizSize.add(g); sizeHandles.push(g);
  }
})();
function axisDir(o,a){
  const M = rotMatOf(o); return new T.Vector3(M[a], M[3+a], M[6+a]);
}
function updateGizmo(){
  if(ME.on){ meGizmo(); return; }
  const objs = selTree();
  const single = (objs.length===1 && objs[0].kind==='prim') ? objs[0] : null;
  const showMove = objs.length>0 && tool==='move' && !PSX.on, showSize = !!single && tool==='size' && !PSX.on && !isLight(single) && !isGroup(single) && !meshOf(single.geo);
  gizMove.visible = showMove; gizSize.visible = showSize;
  const showRot = objs.length>0 && tool==='rot' && !PSX.on;
  gizRot.visible = showRot;
  gizHits.length = 0;
  if(showRot){
    const b = unionBounds(objs), c = new T.Vector3((b[0]+b[3])/2,(b[1]+b[4])/2,(b[2]+b[5])/2);
    gizRot.position.copy(c); gizRot.scale.setScalar(wpp(c)*GIZ_PX*1.15);
    gizRot.updateMatrixWorld(true);
    gizRot.traverse(m => { if(m.userData.handle) gizHits.push(m); });
  }
  if(showMove){
    const b = unionBounds(objs);
    const c = new T.Vector3((b[0]+b[3])/2,(b[1]+b[4])/2,(b[2]+b[5])/2);
    gizMove.position.copy(c); gizMove.scale.setScalar(wpp(c)*GIZ_PX);
    gizMove.updateMatrixWorld(true);
    gizMove.traverse(m => { if(m.userData.handle) gizHits.push(m); });
  }
  if(showSize){
    for(const g of sizeHandles){
      const d = axisDir(single,g.userData.a).multiplyScalar(g.userData.sg);
      const p = new T.Vector3(single.pos[0],single.pos[1],single.pos[2]).addScaledVector(d, single.size[g.userData.a]/2);
      g.position.copy(p); g.scale.setScalar(wpp(p)*9);
    }
    gizSize.updateMatrixWorld(true);
    gizSize.traverse(m => { if(m.userData.handle) gizHits.push(m); });
  }
}

/* ---------- rayos ---------- */
const ray = new T.Raycaster();
const ndc = new T.Vector2();
function setRay(e){
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, cam);
}
function pickObject(){
  const roots = [];
  for(const n of nodes.values()) if(n.visible && n.userData.pickable) roots.push(n);   // (las notas no están en nodes)
  const hits = ray.intersectObjects(roots,true);
  if(!hits.length) return null;
  let o = hits[0].object;
  while(o && !o.userData.objId) o = o.parent;
  if(!o) return null;
  const th = terrainPick();
  if(th && th.dist<hits[0].distance) return null;
  return {id:o.userData.objId, hit:hits[0]};
}
function surfaceHit(){ // {point, normal, id}
  const h = pickObject(), th = terrainPick();
  if(h && (!th || h.hit.distance<=th.dist)){
    const nrm = h.hit.face.normal.clone().transformDirection(h.hit.object.matrixWorld);
    return {point:h.hit.point.clone(), normal:nrm, id:h.id};
  }
  if(th) return {point:th.point, normal:th.normal, id:null, terrain:true};
  const p = new T.Vector3();
  if(ray.ray.intersectPlane(groundPlane,p)) return {point:p, normal:new T.Vector3(0,1,0), id:null};
  return null;
}
function lineParam(P0,d){
  const o = ray.ray.origin, r = ray.ray.direction;
  const w0 = P0.clone().sub(o);
  const b = d.dot(r), dd = d.dot(w0), e = r.dot(w0);
  const den = 1-b*b;
  if(den<1e-4) return null;
  return (b*e-dd)/den;
}


/* ---------- mover pegado a superficies: lo que se mueve se apoya en lo que tiene debajo (terreno, piso, pared u otro objeto) ---------- */
// desplazamiento para que la caja b quede tocando el punto p de una superficie con normal n (con snap en el plano de la superficie)
function surfaceOffset(b,p,n,snap){
  const cx = (b[0]+b[3])/2, cy = (b[1]+b[4])/2, cz = (b[2]+b[5])/2, hx = (b[3]-b[0])/2, hy = (b[4]-b[1])/2, hz = (b[5]-b[2])/2;
  const se = (v,h) => snap>0 ? Math.round((v-h)/snap)*snap+h : v;
  const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
  let tx, ty, tz;
  if(ay>=ax && ay>=az){ tx = se(p.x,hx); tz = se(p.z,hz); ty = n.y>=0 ? p.y+hy : p.y-hy; }          // piso o techo
  else if(ax>=az){ tz = se(p.z,hz); ty = se(p.y,hy); tx = n.x>0 ? p.x+hx : p.x-hx; }                   // pared que mira en X
  else { tx = se(p.x,hx); ty = se(p.y,hy); tz = n.z>0 ? p.z+hz : p.z-hz; }                             // pared que mira en Z
  return [tx-cx, ty-cy, tz-cz];
}
// giro para apoyarse según la superficie: en pisos y pendientes, su «arriba» sigue la normal (sin perder hacia dónde mira);
// en paredes, su frente (+Z) mira hacia afuera de la pared
function alignEuler(o,n){
  if(Math.abs(n.y)>=0.6){
    const y = (o.rot||0)*D2R, mx = Math.cos(y)*n.x-Math.sin(y)*n.z, mz = Math.sin(y)*n.x+Math.cos(y)*n.z;
    const a = Math.atan2(mz,n.y), c = Math.asin(clamp(-mx,-1,1));
    return [normDeg(r4(a*180/Math.PI)), o.rot||0, normDeg(r4(c*180/Math.PI))].map(v => Math.abs(v)<1e-4 || Math.abs(v-360)<1e-4 ? 0 : v);
  }
  return [0, normDeg(r4(Math.atan2(n.x,n.z)*180/Math.PI)), 0];
}
// superficie bajo el dedo sin contar lo que se está moviendo (ni luces ni grupos, que no tienen cara)
function surfaceHitEx(excl){
  const roots = [];
  for(const [id,n] of nodes){ if(excl.has(id) || !n.visible || !n.userData.pickable) continue; const o = byId(id); if(o && (o.kind==='prim' || o.kind==='inst')) roots.push(n); }
  const hits = ray.intersectObjects(roots,true).filter(x => x.face), th = terrainPick();
  if(hits.length && (!th || hits[0].distance<=th.dist)) return {point:hits[0].point.clone(), normal:hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld)};
  if(th) return {point:th.point, normal:th.normal, terrain:true};
  const p = new T.Vector3(); if(ray.ray.intersectPlane(groundPlane,p)) return {point:p, normal:new T.Vector3(0,1,0)};
  return null;
}
function surfDrag(){
  const h = surfaceHitEx(drag.excl); if(!h) return;
  for(const s of drag.start){ s.o.pos = s.pos.slice(); setRot(s.o,[s.rx||0,s.rot,s.rz||0]); }   // siempre desde cómo estaba al empezar
  if(CTRL.align && drag.root) rotateTree(drag.root, alignEuler(drag.root, h.normal));
  const all = drag.start.map(s => s.o), geo = geoOf(all), d = surfaceOffset(unionBounds(geo.length ? geo : all), h.point, h.normal, snapStep());
  for(const s of drag.start){ s.o.pos = [r4(s.o.pos[0]+d[0]), r4(s.o.pos[1]+d[1]), r4(s.o.pos[2]+d[2])]; syncNode(s.o); }
  drag.moved = true; drag.lastHit = h; refreshOutlines(); updateSelInfo(); invalidate();
}


/* ---------- mallas editables: S.meshes[id] = {v:[x,y,z,...], f:[[a,b,c],[a,b,c,d],...]} en el espacio de la pieza ---------- */
// La pieza guarda size = caja de la malla y la malla queda centrada en su origen: colliders, horneado, combinador y exportación la tratan como cualquier pieza.
const meshOf = geo => (typeof geo==='string' && geo.indexOf('mesh_')===0) ? (S.meshes||{})[geo.slice(5)] : null;
function meshGeo(m){
  const P = []; for(const f of m.f) for(let k=1;k<f.length-1;k++) for(const i of [f[0],f[k],f[k+1]]) P.push(m.v[i*3],m.v[i*3+1],m.v[i*3+2]);
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(P,3)); return g;
}
// triángulos sueltos -> vértices soldados y caras; los triángulos coplanares que forman un cuadrilátero convexo se unen en una cara
function meshFromTris(P){
  const key = new Map(), v = [], tri = [];
  const idx = (x,y,z) => { const k = Math.round(x*1e4)+','+Math.round(y*1e4)+','+Math.round(z*1e4); let i = key.get(k); if(i===undefined){ i = v.length/3; key.set(k,i); v.push(r4(x),r4(y),r4(z)); } return i; };
